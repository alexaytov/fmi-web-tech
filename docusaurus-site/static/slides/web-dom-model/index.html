📄 HTML е статичен текст <!-- .element: class="fragment" -->

⚡ JavaScript манипулира DOM, не HTML файла <!-- .element: class="fragment" -->

Note:
Браузърът парсва HTML и създава DOM. JavaScript работи с DOM обекти.

<script type="text/template">
## Типове Възли (Node Types)

| Тип | Описание | Пример |
|-----|----------|--------|
| Element | HTML елемент | `<div>`, `<p>` |
| Text | Текстово съдържание | "Hello World" |
| Attribute | Атрибут на елемент | `class="btn"` |
| Comment | HTML коментар | `<!-- ... -->` |

Note:
Най-често работим с Element nodes, но е важно да знаем, че има и други типове.
</script>
</section>
<section data-markdown>
<script type="text/template">
### Проверка на типа възел

```javascript
const element = document.querySelector('p');

console.log(element.nodeType);  // 1 (Element)
console.log(element.nodeName);  // "P"

const textNode = element.firstChild;
console.log(textNode.nodeType); // 3 (Text)
```

Note:
nodeType връща число - 1 за елементи, 3 за текст, 8 за коментари.
</script>

<script type="text/template">
## DOM Манипулация

✏️ Промяна на съдържание и атрибути
</script>
</section>
<section data-markdown>
<script type="text/template">
### textContent vs innerHTML

```javascript
const div = document.querySelector('.content');

// textContent - само текст (безопасно)
div.textContent = '<b>Hello</b>';
// Показва: <b>Hello</b> като текст

// innerHTML - парсва HTML (внимание!)
div.innerHTML = '<b>Hello</b>';
// Показва: Hello (bold)
```

Note:
textContent е по-бърз и по-сигурен.
</script>
</section>
<section data-markdown>
<script type="text/template">
### ⚠️ innerHTML и XSS

```javascript
// ОПАСНО! Никога не правете това:
const userInput = '<script>alert("Hacked!")<\/script>';
div.innerHTML = userInput; // XSS уязвимост!

// БЕЗОПАСНО:
div.textContent = userInput; // Escape-ва HTML
```

🛡️ **Правило:** Винаги санитизирайте потребителски вход!

Note:
XSS атаките са сериозен проблем. Използвайте textContent за потребителски данни.
</script>
</section>
<section data-markdown>
<script type="text/template">
### Промяна на атрибути

```javascript
const img = document.querySelector('img');

// Четене
const src = img.getAttribute('src');

// Записване
img.setAttribute('alt', 'Profile picture');

// Премахване
img.removeAttribute('data-temp');

// Директен достъп (за стандартни атрибути)
img.src = 'new-image.jpg';
img.id = 'profile-img';
```

Note:
getAttribute/setAttribute работят с всички атрибути, директният достъп - само със стандартните.
</script>
</section>
<section data-markdown>
<script type="text/template">
### Работа с класове

```javascript
const btn = document.querySelector('.btn');

// Добавяне
btn.classList.add('active', 'highlighted');

// Премахване
btn.classList.remove('disabled');

// Toggle (добави/премахни)
btn.classList.toggle('expanded');

// Проверка
if (btn.classList.contains('active')) {
  console.log('Button is active');
}
```

Note:
classList е модерният начин за работа с класове. Избягвайте className.
</script>
</section>
<section data-markdown>
<script type="text/template">
### Промяна на стилове

```javascript
const box = document.querySelector('.box');

// Inline стилове
box.style.backgroundColor = '#3498db';
box.style.padding = '20px';
box.style.borderRadius = '8px';

// Множество стилове наведнъж
box.style.cssText = `
  background: #3498db;
  padding: 20px;
  border-radius: 8px;
`;
```

Note:
CSS свойствата в JavaScript са camelCase - backgroundColor вместо background-color.
</script>

<section data-markdown>
<script type="text/template">
## Създаване и Премахване на Елементи

🏗️ Динамична промяна на структурата
</script>
</section>
<section data-markdown>
<script type="text/template">
### createElement и appendChild

```javascript
// 1. Създаване на елемент
const newDiv = document.createElement('div');

// 2. Настройка на съдържание и атрибути
newDiv.textContent = 'Hello World';
newDiv.classList.add('card');

// 3. Добавяне към DOM
document.body.appendChild(newDiv);
```

Note:
Елементът съществува в паметта, докато не го добавим към DOM.
</script>
</section>
<section data-markdown>
<script type="text/template">
### Вмъкване на определена позиция

```javascript
const container = document.querySelector('.container');
const newItem = document.createElement('li');
newItem.textContent = 'New Item';

// В началото
container.prepend(newItem);

// Преди конкретен елемент
const reference = container.querySelector('.item-3');
container.insertBefore(newItem, reference);

// След конкретен елемент
reference.after(newItem);
```

Note:
prepend, append, before, after са модерни методи.
</script>
</section>
<section data-markdown>
<script type="text/template">
### Премахване на елементи

```javascript
// Модерен начин
const element = document.querySelector('.to-remove');
element.remove();

// Стар начин (за съвместимост)
const parent = element.parentNode;
parent.removeChild(element);

// Изчистване на съдържание
container.innerHTML = ''; // Внимание: бавно!

// По-добре:
while (container.firstChild) {
  container.removeChild(container.firstChild);
}
```

Note:
remove() е по-чист синтаксис, но removeChild има по-добра съвместимост.
</script>
</section>
<section data-markdown>
<script type="text/template">
### Клониране на елементи

```javascript
const original = document.querySelector('.template');

// Плитко копие (без деца)
const shallow = original.cloneNode(false);

// Дълбоко копие (с всички деца)
const deep = original.cloneNode(true);

document.body.appendChild(deep);
```

Note:
Клонирането е полезно за шаблони. Не забравяйте да промените ID-тата!
</script>
</section>

<section data-markdown>
<script type="text/template">
## Събития (Events)

📡 Интерактивност чрез event listeners
</script>
</section>
<section data-markdown>
<script type="text/template">
### addEventListener Синтаксис

```javascript
element.addEventListener(eventType, handler, options);

// Пример
const btn = document.querySelector('.btn');

btn.addEventListener('click', function(event) {
  console.log('Button clicked!');
  console.log(event.target); // Кликнатият елемент
});
```

Note:
addEventListener е предпочитаният начин за слушане на събития.
</script>
</section>
<section data-markdown>
<script type="text/template">
### Често използвани събития

| Събитие | Описание |
|---------|----------|
| `click` | Клик с мишка |
| `dblclick` | Двоен клик |
| `mouseover` / `mouseout` | Hover |
| `keydown` / `keyup` | Натискане на клавиш |
| `input` | Промяна в input поле |
| `submit` | Изпращане на форма |
| `load` | Зареждане завършено |
| `DOMContentLoaded` | DOM е готов |

Note:
input се тригерира при всяка промяна, change - само при blur.
</script>
</section>
<section data-markdown>
<script type="text/template">
### Event Object

```javascript
document.addEventListener('click', function(event) {
  // Информация за събитието
  console.log(event.type);        // "click"
  console.log(event.target);      // Кликнатият елемент
  console.log(event.currentTarget); // Елементът с listener-а

  // Позиция на мишката
  console.log(event.clientX, event.clientY);

  // Предотвратяване на default поведение
  event.preventDefault();
});
```

Note:
event обектът съдържа цялата информация за събитието.
</script>
</section>
<section data-markdown>
<script type="text/template">
### Премахване на event listener

```javascript
// Handler трябва да е именувана функция
function handleClick(event) {
  console.log('Clicked!');
}

// Добавяне
btn.addEventListener('click', handleClick);

// Премахване (същата функция!)
btn.removeEventListener('click', handleClick);

// НЕ работи с анонимни функции!
btn.addEventListener('click', () => console.log('Hi'));
btn.removeEventListener('click', () => console.log('Hi')); // Различна функция!
```

Note:
За removeEventListener трябва да подадете точно същата референция към функцията.
</script>
</section>

<section data-markdown>
<script type="text/template">
### Практически пример

```javascript
document.querySelector('.outer').addEventListener('click', () => {
  console.log('Outer clicked');
});

document.querySelector('.inner').addEventListener('click', () => {
  console.log('Inner clicked');
});

// Клик на .inner извежда:
// "Inner clicked"
// "Outer clicked"
```

Note:
Bubbling позволява event delegation - мощна техника.
</script>
</section>
<section data-markdown>
<script type="text/template">
### stopPropagation

```javascript
document.querySelector('.inner').addEventListener('click', (e) => {
  e.stopPropagation(); // Спира bubbling
  console.log('Inner clicked');
});

// Сега клик на .inner извежда само:
// "Inner clicked"
```

⚠️ Използвайте внимателно - може да счупи event delegation!

Note:
stopPropagation предотвратява разпространението нагоре.
</script>
</section>
<section data-markdown>
<script type="text/template">
### Event Delegation

```javascript
// Вместо listener на всеки бутон...
document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', handleClick);
});

// ...един listener на родителя!
document.querySelector('.button-container').addEventListener('click', (e) => {
  if (e.target.classList.contains('btn')) {
    handleClick(e);
  }
});
```

✅ По-ефективно за динамични елементи!

Note:
Event delegation работи и за елементи, добавени по-късно.
</script>

<section data-markdown>
<script type="text/template">
### Todo List

```javascript
const form = document.querySelector('#todo-form');
const input = document.querySelector('#todo-input');
const list = document.querySelector('#todo-list');

form.addEventListener('submit', (e) => {
  e.preventDefault();

  if (input.value.trim()) {
    const li = document.createElement('li');
    li.textContent = input.value;

    // Бутон за изтриване
    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = 'X';
    deleteBtn.onclick = () => li.remove();

    li.appendChild(deleteBtn);
    list.appendChild(li);
    input.value = '';
  }
});
```

Note:
Прост, но пълен пример за CRUD операции с DOM.
</script>

<section data-markdown>
<script type="text/template">
### Form Validation

```javascript
const form = document.querySelector('#signup-form');
const email = document.querySelector('#email');
const password = document.querySelector('#password');

email.addEventListener('input', (e) => {
  const isValid = e.target.value.includes('@');
  e.target.classList.toggle('invalid', !isValid);
});

password.addEventListener('input', (e) => {
  const isStrong = e.target.value.length >= 8;
  e.target.classList.toggle('weak', !isStrong);
});

form.addEventListener('submit', (e) => {
  if (!form.checkValidity()) {
    e.preventDefault();
    alert('Please fix the errors');
  }
});
```

Note:
Real-time validation подобрява потребителското изживяване.
</script>

<section data-markdown>
<script type="text/template">
### Modal Dialog

```javascript
const modal = document.querySelector('.modal');
const openBtn = document.querySelector('.open-modal');
const closeBtn = document.querySelector('.close-modal');

openBtn.addEventListener('click', () => {
  modal.classList.add('active');
});

closeBtn.addEventListener('click', () => {
  modal.classList.remove('active');
});

// Затваряне при клик извън модала
modal.addEventListener('click', (e) => {
  if (e.target === modal) {
    modal.classList.remove('active');
  }
});

// Затваряне с Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    modal.classList.remove('active');
  }
});
```

Note:
Множество начини за затваряне подобряват UX.
</script>

<section data-markdown>
<script type="text/template">
## Performance Tips

⚡ Оптимизации за по-бърз код
</script>
</section>
<section data-markdown>
<script type="text/template">
### Cache DOM селекции

```javascript
// ❌ Бавно - селектира всеки път
function updateUI() {
  document.querySelector('.counter').textContent = count;
  document.querySelector('.counter').classList.add('updated');
}

// ✅ Бързо - селектира веднъж
const counter = document.querySelector('.counter');

function updateUI() {
  counter.textContent = count;
  counter.classList.add('updated');
}
```

Note:
DOM селекциите са бавни. Кеширайте резултатите в променливи.
</script>
</section>
<section data-markdown>
<script type="text/template">
### DocumentFragment

```javascript
// ❌ Бавно - множество reflow-ове
items.forEach(item => {
  const li = document.createElement('li');
  li.textContent = item;
  list.appendChild(li); // Reflow!
});

// ✅ Бързо - един reflow
const fragment = document.createDocumentFragment();

items.forEach(item => {
  const li = document.createElement('li');
  li.textContent = item;
  fragment.appendChild(li); // В паметта
});

list.appendChild(fragment); // Един reflow!
```

Note:
DocumentFragment е виртуален контейнер, който не причинява reflow.
</script>
</section>
<section data-markdown>
<script type="text/template">
### Избягвайте layout thrashing

```javascript
// ❌ Layout thrashing
elements.forEach(el => {
  el.style.width = el.offsetWidth + 10 + 'px'; // Read + Write
});

// ✅ Batch reads, then writes
const widths = elements.map(el => el.offsetWidth); // All reads

elements.forEach((el, i) => {
  el.style.width = widths[i] + 10 + 'px'; // All writes
});
```

Note:
Смесването на четене и писане причинява принудителни layout изчисления.
</script>
</section>
