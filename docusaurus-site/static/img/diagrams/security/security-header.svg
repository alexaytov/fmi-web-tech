<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="secHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="50%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#922b21"/>
    </linearGradient>
    <linearGradient id="secShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#d68910"/>
    </linearGradient>
    <filter id="secHeaderShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
    <filter id="secShieldGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#f39c12" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Safe animations - no transform conflicts */
    .sec-shield-glow { animation: secShieldGlow 3s ease-in-out infinite; }
    .sec-tag-pulse { animation: secTagPulse 2s ease-in-out infinite; }

    @keyframes secShieldGlow {
      0%, 100% { filter: url(#secShieldGlow); opacity: 0.95; }
      50% { filter: url(#secShieldGlow) drop-shadow(0 0 8px rgba(243,156,18,0.6)); opacity: 1; }
    }
    @keyframes secTagPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Background -->
  <rect width="800" height="200" rx="16" fill="url(#secHeaderGrad)" filter="url(#secHeaderShadow)"/>

  <!-- Shield Icon with glow (no transform animation) -->
  <g transform="translate(80, 45)" class="sec-shield-glow">
    <path d="M50,0 L100,20 L100,60 C100,90 75,110 50,120 C25,110 0,90 0,60 L0,20 Z"
          fill="url(#secShieldGrad)"/>
    <path d="M50,30 L40,60 L50,55 L60,60 Z" fill="white" opacity="0.9"/>
    <circle cx="50" cy="45" r="6" fill="white" opacity="0.9"/>
  </g>

  <!-- Title -->
  <text x="400" y="75" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="36" font-weight="700">Уеб Сигурност</text>
  <text x="400" y="115" text-anchor="middle" fill="white" fill-opacity="0.9" font-family="system-ui, sans-serif" font-size="20">OWASP Top 10 и Best Practices</text>

  <!-- Security Icons -->
  <g transform="translate(620, 55)">
    <!-- Lock icon -->
    <rect x="0" y="25" width="40" height="35" rx="5" fill="white" fill-opacity="0.3"/>
    <path d="M8,25 L8,15 C8,5 32,5 32,15 L32,25" fill="none" stroke="white" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="42" r="5" fill="white" fill-opacity="0.4"/>
  </g>
  <g transform="translate(680, 65)">
    <!-- Magnifier icon -->
    <circle cx="20" cy="20" r="16" fill="none" stroke="white" stroke-opacity="0.25" stroke-width="3"/>
    <line x1="32" y1="32" x2="45" y2="45" stroke="white" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="750" cy="30" r="20" fill="white" fill-opacity="0.1"/>
  <circle cx="30" cy="170" r="15" fill="white" fill-opacity="0.1"/>

  <!-- Tags with opacity pulse (no transform animation) -->
  <g transform="translate(250, 145)" class="sec-tag-pulse">
    <rect width="80" height="28" rx="14" fill="white" fill-opacity="0.2"/>
    <text x="40" y="19" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Injection</text>
  </g>
  <g transform="translate(340, 145)" class="sec-tag-pulse" style="animation-delay: -1.5s;">
    <rect width="60" height="28" rx="14" fill="white" fill-opacity="0.2"/>
    <text x="30" y="19" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="500">XSS</text>
  </g>
  <g transform="translate(410, 145)" class="sec-tag-pulse" style="animation-delay: -1s;">
    <rect width="70" height="28" rx="14" fill="white" fill-opacity="0.2"/>
    <text x="35" y="19" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="500">CSRF</text>
  </g>
  <g transform="translate(490, 145)" class="sec-tag-pulse" style="animation-delay: -0.5s;">
    <rect width="100" height="28" rx="14" fill="white" fill-opacity="0.2"/>
    <text x="50" y="19" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Auth Failures</text>
  </g>
</svg>
