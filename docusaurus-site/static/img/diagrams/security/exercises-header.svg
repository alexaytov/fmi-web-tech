<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="secExHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#1e8449"/>
    </linearGradient>
    <filter id="secExShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
    <filter id="secExLockGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Safe animations - no transform conflicts */
    .ex-lock-glow { animation: exLockGlow 2s ease-in-out infinite; }
    .ex-shield-pulse { animation: exShieldPulse 3s ease-in-out infinite; }
    .ex-progress-glow { animation: exProgressGlow 2s ease-in-out infinite; }

    @keyframes exLockGlow {
      0%, 100% { filter: url(#secExLockGlow); }
      50% { filter: url(#secExLockGlow) drop-shadow(0 0 6px rgba(255,255,255,0.5)); }
    }
    @keyframes exShieldPulse {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.35; }
    }
    @keyframes exProgressGlow {
      0%, 100% { fill-opacity: 0.8; }
      50% { fill-opacity: 1; }
    }
  </style>

  <rect width="800" height="160" rx="14" fill="url(#secExHeaderGrad)" filter="url(#secExShadow)"/>

  <!-- Lock icon with glow animation (no transform conflict) -->
  <g transform="translate(50, 45)" class="ex-lock-glow">
    <rect x="10" y="25" width="35" height="30" rx="4" fill="white" fill-opacity="0.95"/>
    <path d="M15,25 L15,17 C15,7 40,7 40,17 L40,25" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <circle cx="27" cy="40" r="5" fill="#1e8449"/>
    <rect x="25" y="42" width="4" height="8" fill="#1e8449"/>
  </g>

  <text x="420" y="65" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Упражнения: Уеб Сигурност</text>
  <text x="420" y="95" text-anchor="middle" fill="white" fill-opacity="0.9" font-family="system-ui, sans-serif" font-size="13">Открийте уязвимости • Защитете приложенията • Пишете сигурен код</text>

  <!-- Decorative shield with pulse -->
  <g transform="translate(700, 40)">
    <path d="M30,0 L60,12 L60,35 C60,55 45,65 30,72 C15,65 0,55 0,35 L0,12 Z" fill="white" class="ex-shield-pulse"/>
    <text x="30" y="42" text-anchor="middle" fill="white" fill-opacity="0.6" font-size="20">✓</text>
  </g>

  <!-- Progress bar with glow -->
  <g transform="translate(220, 115)">
    <rect width="360" height="6" rx="3" fill="white" fill-opacity="0.3"/>
    <rect width="220" height="6" rx="3" fill="white" class="ex-progress-glow"/>
  </g>
</svg>
