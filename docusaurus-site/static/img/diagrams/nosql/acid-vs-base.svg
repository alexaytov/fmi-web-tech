<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 750 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="acidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b59b6"/>
      <stop offset="100%" stop-color="#8e44ad"/>
    </linearGradient>
    <filter id="abShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <text x="375" y="35" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="22" font-weight="700">ACID vs BASE: Транзакционни Свойства</text>

  <!-- ACID Box -->
  <g transform="translate(30, 60)" filter="url(#abShadow)">
    <rect width="320" height="240" rx="16" fill="url(#acidGrad)"/>
    <text x="160" y="35" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="20" font-weight="700">ACID</text>
    <text x="160" y="55" text-anchor="middle" fill="white" fill-opacity="0.8" font-family="system-ui, sans-serif" font-size="12">Релационни бази данни</text>

    <rect x="20" y="70" width="280" height="155" rx="10" fill="white" fill-opacity="0.95"/>

    <text x="35" y="95" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="12"><tspan fill="#3498db" font-weight="700">A</tspan>tomicity - Всичко или нищо</text>
    <text x="35" y="120" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="12"><tspan fill="#3498db" font-weight="700">C</tspan>onsistency - Данните са валидни</text>
    <text x="35" y="145" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="12"><tspan fill="#3498db" font-weight="700">I</tspan>solation - Независими транзакции</text>
    <text x="35" y="170" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="12"><tspan fill="#3498db" font-weight="700">D</tspan>urability - Промените се запазват</text>

    <rect x="25" y="195" width="270" height="25" rx="4" fill="#3498db" fill-opacity="0.1"/>
    <text x="160" y="212" text-anchor="middle" fill="#3498db" font-family="system-ui, sans-serif" font-size="11" font-weight="600">🎯 Фокус: Силен интегритет на данните</text>
  </g>

  <!-- VS -->
  <text x="375" y="190" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="24" font-weight="700">vs</text>

  <!-- BASE Box -->
  <g transform="translate(400, 60)" filter="url(#abShadow)">
    <rect width="320" height="240" rx="16" fill="url(#baseGrad)"/>
    <text x="160" y="35" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="20" font-weight="700">BASE</text>
    <text x="160" y="55" text-anchor="middle" fill="white" fill-opacity="0.8" font-family="system-ui, sans-serif" font-size="12">NoSQL бази данни</text>

    <rect x="20" y="70" width="280" height="155" rx="10" fill="white" fill-opacity="0.95"/>

    <text x="35" y="95" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="12"><tspan fill="#9b59b6" font-weight="700">B</tspan>asically Available</text>
    <text x="35" y="112" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">Системата винаги е достъпна</text>

    <text x="35" y="138" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="12"><tspan fill="#9b59b6" font-weight="700">S</tspan>oft State</text>
    <text x="35" y="155" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">Състоянието може да се промени</text>

    <text x="35" y="181" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="12"><tspan fill="#9b59b6" font-weight="700">E</tspan>ventual Consistency</text>
    <text x="35" y="198" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">Консистентност с времето</text>

    <rect x="25" y="195" width="270" height="25" rx="4" fill="#9b59b6" fill-opacity="0.1"/>
    <text x="160" y="212" text-anchor="middle" fill="#9b59b6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">🚀 Фокус: Висока достъпност и мащаб</text>
  </g>
</svg>
