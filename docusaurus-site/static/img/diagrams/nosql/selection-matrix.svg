<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="matrixShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <text x="400" y="30" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="20" font-weight="700">NoSQL Матрица за Избор</text>

  <!-- Table header -->
  <rect x="30" y="50" width="740" height="40" rx="8" fill="#34495e"/>
  <text x="100" y="75" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Тип</text>
  <text x="230" y="75" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Силни страни</text>
  <text x="380" y="75" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Консистентност</text>
  <text x="520" y="75" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Мащабиране</text>
  <text x="680" y="75" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Приложения</text>

  <!-- Document row -->
  <rect x="30" y="95" width="740" height="55" fill="#e74c3c" fill-opacity="0.1" filter="url(#matrixShadow)"/>
  <rect x="30" y="95" width="70" height="55" rx="0" fill="#e74c3c" fill-opacity="0.3"/>
  <text x="65" y="128" text-anchor="middle" fill="#c0392b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">📄 Document</text>
  <text x="230" y="120" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">Гъвкава схема</text>
  <text x="230" y="135" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">Богати заявки</text>
  <text x="380" y="128" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">Configurable</text>
  <text x="520" y="128" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">Sharding</text>
  <text x="680" y="120" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">CMS, Каталози</text>
  <text x="680" y="135" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">MongoDB</text>

  <!-- Key-Value row -->
  <rect x="30" y="155" width="740" height="55" fill="#3498db" fill-opacity="0.1" filter="url(#matrixShadow)"/>
  <rect x="30" y="155" width="70" height="55" rx="0" fill="#3498db" fill-opacity="0.3"/>
  <text x="65" y="188" text-anchor="middle" fill="#2980b9" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🔑 Key-Value</text>
  <text x="230" y="180" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">Ултра бързо</text>
  <text x="230" y="195" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">Просто</text>
  <text x="380" y="188" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">Eventual/Config</text>
  <text x="520" y="188" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">Clustering</text>
  <text x="680" y="180" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">Кеш, Сесии</text>
  <text x="680" y="195" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">Redis</text>

  <!-- Wide-Column row -->
  <rect x="30" y="215" width="740" height="55" fill="#2ecc71" fill-opacity="0.1" filter="url(#matrixShadow)"/>
  <rect x="30" y="215" width="70" height="55" rx="0" fill="#2ecc71" fill-opacity="0.3"/>
  <text x="65" y="248" text-anchor="middle" fill="#27ae60" font-family="system-ui, sans-serif" font-size="11" font-weight="700">📊 Column</text>
  <text x="230" y="240" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">Масивен запис</text>
  <text x="230" y="255" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">Tunable</text>
  <text x="380" y="248" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">Tunable</text>
  <text x="520" y="248" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">Ring topology</text>
  <text x="680" y="240" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">IoT, Time-series</text>
  <text x="680" y="255" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">Cassandra</text>

  <!-- Graph row -->
  <rect x="30" y="275" width="740" height="55" fill="#9b59b6" fill-opacity="0.1" filter="url(#matrixShadow)"/>
  <rect x="30" y="275" width="70" height="55" rx="0" fill="#9b59b6" fill-opacity="0.3"/>
  <text x="65" y="308" text-anchor="middle" fill="#8e44ad" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🕸️ Graph</text>
  <text x="230" y="300" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">Бързи traversals</text>
  <text x="230" y="315" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">Интуитивно</text>
  <text x="380" y="308" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">ACID</text>
  <text x="520" y="308" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">Fabric</text>
  <text x="680" y="300" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">Social, Fraud</text>
  <text x="680" y="315" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">Neo4j</text>

  <!-- Multi-Model row -->
  <rect x="30" y="335" width="740" height="55" fill="#f39c12" fill-opacity="0.1" filter="url(#matrixShadow)"/>
  <rect x="30" y="335" width="70" height="55" rx="0" fill="#f39c12" fill-opacity="0.3"/>
  <text x="65" y="368" text-anchor="middle" fill="#d68910" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🔀 Multi</text>
  <text x="230" y="360" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">Унифицирани заявки</text>
  <text x="230" y="375" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">По-малко сложност</text>
  <text x="380" y="368" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">ACID</text>
  <text x="520" y="368" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">Sharding</text>
  <text x="680" y="360" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="10">Хибридни нужди</text>
  <text x="680" y="375" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">ArangoDB</text>
</svg>
