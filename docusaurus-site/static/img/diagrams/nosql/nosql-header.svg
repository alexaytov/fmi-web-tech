<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nosqlHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e44ad"/>
      <stop offset="50%" stop-color="#9b59b6"/>
      <stop offset="100%" stop-color="#3498db"/>
    </linearGradient>
    <filter id="nosqlHeaderShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="760" height="160" rx="20" fill="url(#nosqlHeaderGrad)" filter="url(#nosqlHeaderShadow)"/>

  <!-- Document icon -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="40" height="50" rx="4" fill="white" fill-opacity="0.9"/>
    <rect x="6" y="8" width="28" height="4" rx="2" fill="#8e44ad"/>
    <rect x="6" y="16" width="20" height="4" rx="2" fill="#8e44ad"/>
    <rect x="6" y="24" width="24" height="4" rx="2" fill="#8e44ad"/>
    <rect x="6" y="32" width="16" height="4" rx="2" fill="#8e44ad"/>
  </g>

  <!-- Key-Value icon -->
  <g transform="translate(180, 70)">
    <rect x="0" y="10" width="18" height="30" rx="4" fill="white" fill-opacity="0.9"/>
    <text x="9" y="30" text-anchor="middle" fill="#8e44ad" font-size="14" font-weight="bold">K</text>
    <text x="28" y="30" text-anchor="middle" fill="white" font-size="18">→</text>
    <rect x="38" y="10" width="18" height="30" rx="4" fill="white" fill-opacity="0.9"/>
    <text x="47" y="30" text-anchor="middle" fill="#8e44ad" font-size="14" font-weight="bold">V</text>
  </g>

  <!-- Column icon -->
  <g transform="translate(280, 70)">
    <rect x="0" y="0" width="12" height="50" rx="3" fill="white" fill-opacity="0.9"/>
    <rect x="16" y="10" width="12" height="40" rx="3" fill="white" fill-opacity="0.8"/>
    <rect x="32" y="5" width="12" height="45" rx="3" fill="white" fill-opacity="0.7"/>
  </g>

  <!-- Graph icon -->
  <g transform="translate(370, 70)">
    <circle cx="10" cy="10" r="8" fill="white" fill-opacity="0.9"/>
    <circle cx="40" cy="5" r="8" fill="white" fill-opacity="0.9"/>
    <circle cx="25" cy="40" r="8" fill="white" fill-opacity="0.9"/>
    <line x1="18" y1="10" x2="32" y2="5" stroke="white" stroke-width="2"/>
    <line x1="10" y1="18" x2="25" y2="32" stroke="white" stroke-width="2"/>
    <line x1="40" y1="13" x2="25" y2="32" stroke="white" stroke-width="2"/>
  </g>

  <!-- Title -->
  <text x="500" y="85" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="32" font-weight="700">NoSQL Бази Данни</text>
  <text x="500" y="120" text-anchor="middle" fill="white" fill-opacity="0.9" font-family="system-ui, sans-serif" font-size="18">Document • Key-Value • Column • Graph</text>
</svg>
