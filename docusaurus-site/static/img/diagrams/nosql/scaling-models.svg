<svg viewBox="0 0 750 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vertGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="horizGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <filter id="scaleShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <text x="375" y="35" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Вертикално vs Хоризонтално Мащабиране</text>

  <!-- Vertical Scaling -->
  <g transform="translate(50, 70)">
    <text x="125" y="20" text-anchor="middle" fill="#e74c3c" font-family="system-ui, sans-serif" font-size="16" font-weight="700">⬆️ Вертикално (Scale-Up)</text>

    <!-- Small server -->
    <rect x="75" y="200" width="100" height="60" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <text x="125" y="235" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="11">2 CPU, 4GB RAM</text>

    <!-- Arrow up -->
    <path d="M125,180 L125,120" stroke="url(#vertGrad)" stroke-width="4" marker-end="url(#arrowVert)"/>
    <polygon points="125,95 115,115 135,115" fill="#e74c3c"/>

    <!-- Big server -->
    <rect x="55" y="35" width="140" height="80" rx="10" fill="url(#vertGrad)" filter="url(#scaleShadow)"/>
    <text x="125" y="70" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600">💪 Мощен сървър</text>
    <text x="125" y="95" text-anchor="middle" fill="white" fill-opacity="0.9" font-family="system-ui, sans-serif" font-size="11">64 CPU, 512GB RAM</text>

    <!-- Cons -->
    <text x="125" y="285" text-anchor="middle" fill="#e74c3c" font-family="system-ui, sans-serif" font-size="12" font-weight="600">❌ Има физически лимит</text>
    <text x="125" y="305" text-anchor="middle" fill="#e74c3c" font-family="system-ui, sans-serif" font-size="12" font-weight="600">❌ Скъпо при голям мащаб</text>
  </g>

  <!-- VS divider -->
  <line x1="375" y1="90" x2="375" y2="300" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="375" y="195" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="18" font-weight="700">vs</text>

  <!-- Horizontal Scaling -->
  <g transform="translate(400, 70)">
    <text x="150" y="20" text-anchor="middle" fill="#2ecc71" font-family="system-ui, sans-serif" font-size="16" font-weight="700">↔️ Хоризонтално (Scale-Out)</text>

    <!-- Initial server -->
    <rect x="20" y="200" width="70" height="50" rx="6" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <text x="55" y="230" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">Node 1</text>

    <!-- Arrow right -->
    <path d="M105,225 L160,225" stroke="url(#horizGrad)" stroke-width="4"/>
    <polygon points="185,225 165,215 165,235" fill="#2ecc71"/>

    <!-- Multiple servers cluster -->
    <g transform="translate(180, 35)">
      <rect x="0" y="0" width="120" height="100" rx="10" fill="#2ecc71" fill-opacity="0.1" stroke="#2ecc71" stroke-width="2" stroke-dasharray="5,5"/>
      <text x="60" y="-8" text-anchor="middle" fill="#27ae60" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Клъстер</text>

      <rect x="10" y="10" width="45" height="35" rx="5" fill="url(#horizGrad)" filter="url(#scaleShadow)"/>
      <text x="32" y="32" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="9">Node 1</text>

      <rect x="65" y="10" width="45" height="35" rx="5" fill="url(#horizGrad)" filter="url(#scaleShadow)"/>
      <text x="87" y="32" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="9">Node 2</text>

      <rect x="10" y="55" width="45" height="35" rx="5" fill="url(#horizGrad)" filter="url(#scaleShadow)"/>
      <text x="32" y="77" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="9">Node 3</text>

      <rect x="65" y="55" width="45" height="35" rx="5" fill="url(#horizGrad)" filter="url(#scaleShadow)"/>
      <text x="87" y="77" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="9">Node N</text>
    </g>

    <!-- Pros -->
    <text x="150" y="285" text-anchor="middle" fill="#2ecc71" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Почти неограничено</text>
    <text x="150" y="305" text-anchor="middle" fill="#2ecc71" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ По-евтино (commodity HW)</text>
  </g>
</svg>
