<svg viewBox="0 0 750 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="strongGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#1e8449"/>
    </linearGradient>
    <linearGradient id="eventGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#d68910"/>
    </linearGradient>
    <linearGradient id="tuneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b59b6"/>
      <stop offset="100%" stop-color="#7d3c98"/>
    </linearGradient>
    <filter id="consShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <text x="375" y="30" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Модели на Консистентност в NoSQL</text>

  <!-- Strong Consistency -->
  <g transform="translate(30, 55)">
    <rect width="220" height="200" rx="14" fill="url(#strongGrad)" filter="url(#consShadow)"/>
    <text x="110" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="16" font-weight="700">🔒 Strong</text>
    <text x="110" y="50" text-anchor="middle" fill="white" fill-opacity="0.9" font-family="system-ui, sans-serif" font-size="12">Силна консистентност</text>

    <rect x="15" y="65" width="190" height="120" rx="10" fill="white" fill-opacity="0.95"/>

    <text x="110" y="88" text-anchor="middle" fill="#27ae60" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Всички четат последния запис</text>

    <!-- Timeline visualization -->
    <line x1="30" y1="110" x2="190" y2="110" stroke="#bdc3c7" stroke-width="2"/>
    <circle cx="50" cy="110" r="8" fill="#27ae60"/>
    <text x="50" y="130" text-anchor="middle" fill="#7f8c8d" font-size="9">Write</text>
    <circle cx="100" cy="110" r="8" fill="#27ae60"/>
    <text x="100" y="130" text-anchor="middle" fill="#7f8c8d" font-size="9">Sync</text>
    <circle cx="170" cy="110" r="8" fill="#27ae60"/>
    <text x="170" y="130" text-anchor="middle" fill="#7f8c8d" font-size="9">Read ✓</text>

    <text x="110" y="160" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">MongoDB (primary)</text>
    <text x="110" y="175" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">Банкови транзакции</text>
  </g>

  <!-- Eventual Consistency -->
  <g transform="translate(265, 55)">
    <rect width="220" height="200" rx="14" fill="url(#eventGrad)" filter="url(#consShadow)"/>
    <text x="110" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="16" font-weight="700">⏳ Eventual</text>
    <text x="110" y="50" text-anchor="middle" fill="white" fill-opacity="0.9" font-family="system-ui, sans-serif" font-size="12">Евентуална консистентност</text>

    <rect x="15" y="65" width="190" height="120" rx="10" fill="white" fill-opacity="0.95"/>

    <text x="110" y="88" text-anchor="middle" fill="#f39c12" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Данните синхронизират с времето</text>

    <!-- Timeline visualization -->
    <line x1="30" y1="110" x2="190" y2="110" stroke="#bdc3c7" stroke-width="2"/>
    <circle cx="50" cy="110" r="8" fill="#f39c12"/>
    <text x="50" y="130" text-anchor="middle" fill="#7f8c8d" font-size="9">Write</text>
    <circle cx="100" cy="110" r="8" fill="#f39c12" fill-opacity="0.5"/>
    <text x="100" y="130" text-anchor="middle" fill="#7f8c8d" font-size="9">Read ?</text>
    <circle cx="170" cy="110" r="8" fill="#f39c12"/>
    <text x="170" y="130" text-anchor="middle" fill="#7f8c8d" font-size="9">Read ✓</text>

    <text x="110" y="160" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">Cassandra, DynamoDB</text>
    <text x="110" y="175" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">Social media feeds</text>
  </g>

  <!-- Tunable Consistency -->
  <g transform="translate(500, 55)">
    <rect width="220" height="200" rx="14" fill="url(#tuneGrad)" filter="url(#consShadow)"/>
    <text x="110" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="16" font-weight="700">🎛️ Tunable</text>
    <text x="110" y="50" text-anchor="middle" fill="white" fill-opacity="0.9" font-family="system-ui, sans-serif" font-size="12">Настройваема консистентност</text>

    <rect x="15" y="65" width="190" height="120" rx="10" fill="white" fill-opacity="0.95"/>

    <text x="110" y="88" text-anchor="middle" fill="#9b59b6" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Избирате ниво per-operation</text>

    <!-- Slider visualization -->
    <rect x="30" y="105" width="160" height="10" rx="5" fill="#ecf0f1"/>
    <rect x="30" y="105" width="100" height="10" rx="5" fill="#9b59b6"/>
    <circle cx="130" cy="110" r="12" fill="#9b59b6" stroke="white" stroke-width="2"/>

    <text x="50" y="140" fill="#7f8c8d" font-size="9">ONE</text>
    <text x="95" y="140" fill="#7f8c8d" font-size="9">QUORUM</text>
    <text x="160" y="140" fill="#7f8c8d" font-size="9">ALL</text>

    <text x="110" y="160" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">Cassandra, ScyllaDB</text>
    <text x="110" y="175" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">Гъвкави workloads</text>
  </g>
</svg>
