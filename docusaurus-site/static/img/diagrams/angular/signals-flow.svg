<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 750 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sigSignalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b59b6"/>
      <stop offset="100%" stop-color="#8e44ad"/>
    </linearGradient>
    <linearGradient id="sigComputedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
    <linearGradient id="sigTemplateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <linearGradient id="sigEffectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <filter id="sigShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <text x="375" y="30" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Angular Signals: Реактивно Състояние</text>

  <!-- Writable Signal -->
  <g transform="translate(50, 70)" filter="url(#sigShadow)">
    <rect width="180" height="120" rx="12" fill="url(#sigSignalGrad)"/>
    <text x="90" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">✏️ Writable Signal</text>
    <rect x="15" y="45" width="150" height="60" rx="8" fill="white" fill-opacity="0.95"/>
    <text x="90" y="65" text-anchor="middle" fill="#8e44ad" font-family="monospace" font-size="11">count = signal(0)</text>
    <text x="90" y="82" text-anchor="middle" fill="#7f8c8d" font-family="monospace" font-size="10">count.set(5)</text>
    <text x="90" y="96" text-anchor="middle" fill="#7f8c8d" font-family="monospace" font-size="10">count.update(v =&gt; v+1)</text>
  </g>

  <!-- Arrow to Computed -->
  <line x1="240" y1="130" x2="280" y2="130" stroke="#7f8c8d" stroke-width="2"/>
  <polygon points="290,130 280,125 280,135" fill="#7f8c8d"/>

  <!-- Computed Signal -->
  <g transform="translate(290, 70)" filter="url(#sigShadow)">
    <rect width="180" height="120" rx="12" fill="url(#sigComputedGrad)"/>
    <text x="90" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">📊 Computed Signal</text>
    <rect x="15" y="45" width="150" height="60" rx="8" fill="white" fill-opacity="0.95"/>
    <text x="90" y="68" text-anchor="middle" fill="#2980b9" font-family="monospace" font-size="10">doubleCount = computed(</text>
    <text x="90" y="82" text-anchor="middle" fill="#2980b9" font-family="monospace" font-size="10">  () =&gt; count() * 2</text>
    <text x="90" y="96" text-anchor="middle" fill="#2980b9" font-family="monospace" font-size="10">)</text>
  </g>

  <!-- Arrows to Template -->
  <path d="M140,200 L140,240 L375,240 L375,260" stroke="#7f8c8d" stroke-width="2" fill="none"/>
  <polygon points="375,270 370,260 380,260" fill="#7f8c8d"/>
  <path d="M380,200 L380,235" stroke="#7f8c8d" stroke-width="2" fill="none"/>

  <!-- Template -->
  <g transform="translate(245, 270)" filter="url(#sigShadow)">
    <rect width="260" height="70" rx="12" fill="url(#sigTemplateGrad)"/>
    <text x="130" y="25" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">🖥️ Template</text>
    <rect x="15" y="35" width="230" height="25" rx="6" fill="white" fill-opacity="0.95"/>
    <text x="130" y="52" text-anchor="middle" fill="#27ae60" font-family="monospace" font-size="10">{{ count() }} · {{ doubleCount() }}</text>
  </g>

  <!-- Effect box -->
  <g transform="translate(520, 70)" filter="url(#sigShadow)">
    <rect width="180" height="120" rx="12" fill="url(#sigEffectGrad)"/>
    <text x="90" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">⚡ effect()</text>
    <rect x="15" y="45" width="150" height="60" rx="8" fill="white" fill-opacity="0.95"/>
    <text x="90" y="65" text-anchor="middle" fill="#c0392b" font-family="monospace" font-size="10">effect(() =&gt; {</text>
    <text x="90" y="80" text-anchor="middle" fill="#c0392b" font-family="monospace" font-size="10">  console.log(count())</text>
    <text x="90" y="95" text-anchor="middle" fill="#c0392b" font-family="monospace" font-size="10">})</text>
  </g>

  <!-- Arrow from Writable to Effect (dashed) -->
  <path d="M230,100 L250,100 L250,50 L510,50 L510,80" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  <polygon points="510,90 505,80 515,80" fill="#7f8c8d"/>

  <!-- Key points -->
  <g transform="translate(520, 220)">
    <rect width="200" height="100" rx="10" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Ключови предимства:</text>
    <text x="15" y="45" fill="#2ecc71" font-family="system-ui, sans-serif" font-size="11">✓ Fine-grained reactivity</text>
    <text x="15" y="62" fill="#2ecc71" font-family="system-ui, sans-serif" font-size="11">✓ Автоматичен tracking</text>
    <text x="15" y="79" fill="#2ecc71" font-family="system-ui, sans-serif" font-size="11">✓ Без Zone.js overhead</text>
    <text x="15" y="96" fill="#2ecc71" font-family="system-ui, sans-serif" font-size="11">✓ Performant updates</text>
  </g>
</svg>
