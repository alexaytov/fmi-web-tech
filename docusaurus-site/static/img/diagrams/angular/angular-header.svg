<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="angHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dd0031"/>
      <stop offset="50%" stop-color="#c3002f"/>
      <stop offset="100%" stop-color="#dd0031"/>
    </linearGradient>
    <filter id="angHeaderShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="760" height="160" rx="20" fill="url(#angHeaderGrad)" filter="url(#angHeaderShadow)"/>

  <!-- Angular Shield Logo -->
  <g transform="translate(80, 50)">
    <polygon points="50,0 95,18 88,75 50,95 12,75 5,18" fill="white" fill-opacity="0.95"/>
    <polygon points="50,8 85,23 79,70 50,87 21,70 15,23" fill="#dd0031"/>
    <polygon points="50,8 50,87 79,70 85,23" fill="#c3002f"/>
    <text x="50" y="55" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="28" font-weight="700">A</text>
  </g>

  <!-- Component icon -->
  <g transform="translate(200, 70)">
    <rect x="0" y="0" width="45" height="45" rx="6" fill="white" fill-opacity="0.9"/>
    <rect x="5" y="5" width="35" height="12" rx="3" fill="#dd0031"/>
    <rect x="5" y="22" width="25" height="18" rx="3" fill="#dd0031" fill-opacity="0.5"/>
    <text x="22" y="65" text-anchor="middle" fill="white" fill-opacity="0.9" font-family="system-ui, sans-serif" font-size="10">Component</text>
  </g>

  <!-- Signal icon -->
  <g transform="translate(280, 70)">
    <circle cx="22" cy="22" r="22" fill="white" fill-opacity="0.9"/>
    <path d="M12,22 Q17,12 22,22 T32,22" stroke="#dd0031" stroke-width="3" fill="none"/>
    <circle cx="22" cy="22" r="4" fill="#dd0031"/>
    <text x="22" y="65" text-anchor="middle" fill="white" fill-opacity="0.9" font-family="system-ui, sans-serif" font-size="10">Signals</text>
  </g>

  <!-- Router icon -->
  <g transform="translate(360, 70)">
    <rect x="0" y="0" width="45" height="45" rx="6" fill="white" fill-opacity="0.9"/>
    <path d="M10,22 L22,10 L34,22 M22,10 L22,35" stroke="#dd0031" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="22" y="65" text-anchor="middle" fill="white" fill-opacity="0.9" font-family="system-ui, sans-serif" font-size="10">Routing</text>
  </g>

  <!-- Title -->
  <text x="580" y="85" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="32" font-weight="700">Angular</text>
  <text x="580" y="120" text-anchor="middle" fill="white" fill-opacity="0.9" font-family="system-ui, sans-serif" font-size="18">Fundamentals for 2026</text>
</svg>
