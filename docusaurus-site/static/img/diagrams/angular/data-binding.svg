<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 750 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dbPropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
    <linearGradient id="dbEventGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="dbTwoWayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b59b6"/>
      <stop offset="100%" stop-color="#8e44ad"/>
    </linearGradient>
    <filter id="dbShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <text x="375" y="30" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Data Binding в Angular</text>

  <!-- Property Binding -->
  <g transform="translate(30, 60)" filter="url(#dbShadow)">
    <rect width="210" height="200" rx="14" fill="url(#dbPropGrad)"/>
    <text x="105" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="15" font-weight="600">[Property] Binding</text>
    <text x="105" y="50" text-anchor="middle" fill="white" fill-opacity="0.8" font-family="system-ui, sans-serif" font-size="11">Component → Template</text>

    <rect x="15" y="65" width="180" height="120" rx="10" fill="white" fill-opacity="0.95"/>

    <!-- Arrow showing direction -->
    <g transform="translate(25, 80)">
      <rect width="60" height="30" rx="4" fill="#3498db" fill-opacity="0.2"/>
      <text x="30" y="20" text-anchor="middle" fill="#2980b9" font-size="10" font-weight="600">Component</text>
    </g>
    <line x1="95" y1="95" x2="125" y2="95" stroke="#3498db" stroke-width="3"/>
    <polygon points="135,95 125,90 125,100" fill="#3498db"/>
    <g transform="translate(140, 80)">
      <rect width="45" height="30" rx="4" fill="#3498db" fill-opacity="0.2"/>
      <text x="22" y="20" text-anchor="middle" fill="#2980b9" font-size="10" font-weight="600">DOM</text>
    </g>

    <text x="105" y="135" text-anchor="middle" fill="#2c3e50" font-family="monospace" font-size="11">[src]="imageUrl"</text>
    <text x="105" y="152" text-anchor="middle" fill="#2c3e50" font-family="monospace" font-size="11">[disabled]="isDisabled"</text>
    <text x="105" y="169" text-anchor="middle" fill="#2c3e50" font-family="monospace" font-size="11">[class.active]="isActive"</text>
  </g>

  <!-- Event Binding -->
  <g transform="translate(270, 60)" filter="url(#dbShadow)">
    <rect width="210" height="200" rx="14" fill="url(#dbEventGrad)"/>
    <text x="105" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="15" font-weight="600">(Event) Binding</text>
    <text x="105" y="50" text-anchor="middle" fill="white" fill-opacity="0.8" font-family="system-ui, sans-serif" font-size="11">Template → Component</text>

    <rect x="15" y="65" width="180" height="120" rx="10" fill="white" fill-opacity="0.95"/>

    <!-- Arrow showing direction -->
    <g transform="translate(25, 80)">
      <rect width="50" height="30" rx="4" fill="#e74c3c" fill-opacity="0.2"/>
      <text x="25" y="20" text-anchor="middle" fill="#c0392b" font-size="10" font-weight="600">DOM</text>
    </g>
    <line x1="85" y1="95" x2="120" y2="95" stroke="#e74c3c" stroke-width="3"/>
    <polygon points="130,95 120,90 120,100" fill="#e74c3c"/>
    <g transform="translate(135, 80)">
      <rect width="55" height="30" rx="4" fill="#e74c3c" fill-opacity="0.2"/>
      <text x="27" y="20" text-anchor="middle" fill="#c0392b" font-size="10" font-weight="600">Component</text>
    </g>

    <text x="105" y="135" text-anchor="middle" fill="#2c3e50" font-family="monospace" font-size="11">(click)="onClick()"</text>
    <text x="105" y="152" text-anchor="middle" fill="#2c3e50" font-family="monospace" font-size="10">(input)="onInput($event)"</text>
    <text x="105" y="169" text-anchor="middle" fill="#2c3e50" font-family="monospace" font-size="11">(submit)="onSubmit()"</text>
  </g>

  <!-- Two-Way Binding -->
  <g transform="translate(510, 60)" filter="url(#dbShadow)">
    <rect width="210" height="200" rx="14" fill="url(#dbTwoWayGrad)"/>
    <text x="105" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="15" font-weight="600">[(Two-Way)] Binding</text>
    <text x="105" y="50" text-anchor="middle" fill="white" fill-opacity="0.8" font-family="system-ui, sans-serif" font-size="11">Component ↔ Template</text>

    <rect x="15" y="65" width="180" height="120" rx="10" fill="white" fill-opacity="0.95"/>

    <!-- Bidirectional arrows -->
    <g transform="translate(25, 80)">
      <rect width="60" height="30" rx="4" fill="#9b59b6" fill-opacity="0.2"/>
      <text x="30" y="20" text-anchor="middle" fill="#8e44ad" font-size="10" font-weight="600">Component</text>
    </g>
    <line x1="95" y1="88" x2="120" y2="88" stroke="#9b59b6" stroke-width="2"/>
    <line x1="120" y1="102" x2="95" y2="102" stroke="#9b59b6" stroke-width="2"/>
    <polygon points="125,88 118,84 118,92" fill="#9b59b6"/>
    <polygon points="90,102 97,98 97,106" fill="#9b59b6"/>
    <g transform="translate(130, 80)">
      <rect width="55" height="30" rx="4" fill="#9b59b6" fill-opacity="0.2"/>
      <text x="27" y="20" text-anchor="middle" fill="#8e44ad" font-size="10" font-weight="600">Template</text>
    </g>

    <text x="105" y="135" text-anchor="middle" fill="#2c3e50" font-family="monospace" font-size="11">[(ngModel)]="name"</text>
    <text x="105" y="152" text-anchor="middle" fill="#2c3e50" font-family="monospace" font-size="11">[(count)]="myCount"</text>
    <text x="105" y="169" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="10">"Banana in a box" 🍌📦</text>
  </g>
</svg>
