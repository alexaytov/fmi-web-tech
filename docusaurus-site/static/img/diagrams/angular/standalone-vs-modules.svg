<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 750 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="smOldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95a5a6"/>
      <stop offset="100%" stop-color="#7f8c8d"/>
    </linearGradient>
    <linearGradient id="smNewGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dd0031"/>
      <stop offset="100%" stop-color="#c3002f"/>
    </linearGradient>
    <filter id="smShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <text x="375" y="30" text-anchor="middle" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="22" font-weight="700">NgModules vs Standalone Components</text>

  <!-- Old NgModules approach -->
  <g transform="translate(30, 55)" filter="url(#smShadow)">
    <rect width="320" height="240" rx="14" fill="url(#smOldGrad)"/>
    <text x="160" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="16" font-weight="600">❌ NgModules (Стар подход)</text>

    <rect x="20" y="50" width="280" height="170" rx="10" fill="white" fill-opacity="0.95"/>

    <!-- Module box -->
    <rect x="35" y="60" width="250" height="80" rx="6" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <text x="160" y="80" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AppModule</text>

    <!-- Components inside module -->
    <rect x="50" y="95" width="65" height="35" rx="4" fill="#95a5a6"/>
    <text x="82" y="117" text-anchor="middle" fill="white" font-size="10">Comp A</text>

    <rect x="125" y="95" width="65" height="35" rx="4" fill="#95a5a6"/>
    <text x="157" y="117" text-anchor="middle" fill="white" font-size="10">Comp B</text>

    <rect x="200" y="95" width="65" height="35" rx="4" fill="#95a5a6"/>
    <text x="232" y="117" text-anchor="middle" fill="white" font-size="10">Comp C</text>

    <text x="160" y="165" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="11">declarations: [A, B, C]</text>
    <text x="160" y="180" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="11">imports: [CommonModule]</text>
    <text x="160" y="195" text-anchor="middle" fill="#7f8c8d" font-family="system-ui, sans-serif" font-size="11">exports: [...]</text>
    <text x="160" y="210" text-anchor="middle" fill="#e74c3c" font-family="system-ui, sans-serif" font-size="10">⚠️ Много boilerplate код</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(355, 175)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#2ecc71" stroke-width="4"/>
    <polygon points="40,0 30,-8 30,8" fill="#2ecc71"/>
  </g>

  <!-- New Standalone approach -->
  <g transform="translate(400, 55)" filter="url(#smShadow)">
    <rect width="320" height="240" rx="14" fill="url(#smNewGrad)"/>
    <text x="160" y="30" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="16" font-weight="600">✓ Standalone (Angular 17+)</text>

    <rect x="20" y="50" width="280" height="170" rx="10" fill="white" fill-opacity="0.95"/>

    <!-- Independent components -->
    <rect x="35" y="65" width="110" height="70" rx="6" fill="#dd0031" fill-opacity="0.1" stroke="#dd0031" stroke-width="2"/>
    <text x="90" y="85" text-anchor="middle" fill="#dd0031" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Component A</text>
    <text x="90" y="100" text-anchor="middle" fill="#7f8c8d" font-size="9">standalone: true</text>
    <text x="90" y="115" text-anchor="middle" fill="#7f8c8d" font-size="9">imports: [B]</text>
    <text x="90" y="128" text-anchor="middle" fill="#2ecc71" font-size="9">✓ Self-contained</text>

    <rect x="155" y="65" width="110" height="70" rx="6" fill="#dd0031" fill-opacity="0.1" stroke="#dd0031" stroke-width="2"/>
    <text x="210" y="85" text-anchor="middle" fill="#dd0031" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Component B</text>
    <text x="210" y="100" text-anchor="middle" fill="#7f8c8d" font-size="9">standalone: true</text>
    <text x="210" y="115" text-anchor="middle" fill="#7f8c8d" font-size="9">imports: []</text>
    <text x="210" y="128" text-anchor="middle" fill="#2ecc71" font-size="9">✓ Tree-shakeable</text>

    <text x="160" y="165" text-anchor="middle" fill="#2ecc71" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Директен import</text>
    <text x="160" y="182" text-anchor="middle" fill="#2ecc71" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ По-малък bundle</text>
    <text x="160" y="199" text-anchor="middle" fill="#2ecc71" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Лесен lazy loading</text>
    <text x="160" y="216" text-anchor="middle" fill="#2ecc71" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Без boilerplate</text>
  </g>
</svg>
