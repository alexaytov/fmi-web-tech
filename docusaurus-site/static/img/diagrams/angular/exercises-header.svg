<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="angExHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#2ecc71"/>
    </linearGradient>
    <filter id="angExHeaderShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="760" height="140" rx="16" fill="url(#angExHeaderGrad)" filter="url(#angExHeaderShadow)"/>

  <!-- Code practice icon -->
  <g transform="translate(100, 55)">
    <rect x="0" y="0" width="55" height="65" rx="6" fill="white" fill-opacity="0.95"/>
    <rect x="8" y="8" width="30" height="4" rx="2" fill="#27ae60"/>
    <rect x="8" y="16" width="38" height="4" rx="2" fill="#27ae60" fill-opacity="0.6"/>
    <rect x="8" y="24" width="25" height="4" rx="2" fill="#27ae60" fill-opacity="0.6"/>
    <rect x="8" y="36" width="32" height="4" rx="2" fill="#dd0031"/>
    <rect x="8" y="44" width="38" height="4" rx="2" fill="#dd0031" fill-opacity="0.6"/>
    <rect x="8" y="52" width="20" height="4" rx="2" fill="#dd0031" fill-opacity="0.6"/>
  </g>

  <!-- Angular mini logo -->
  <g transform="translate(180, 65)">
    <polygon points="25,0 47,9 44,37 25,47 6,37 3,9" fill="white" fill-opacity="0.9"/>
    <polygon points="25,4 42,11 40,34 25,43 10,34 8,11" fill="#dd0031"/>
    <text x="25" y="28" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="700">A</text>
  </g>

  <text x="480" y="80" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Упражнения: Angular</text>
  <text x="480" y="115" text-anchor="middle" fill="white" fill-opacity="0.9" font-family="system-ui, sans-serif" font-size="16">20 задачи • Components • Signals • Routing</text>
</svg>
