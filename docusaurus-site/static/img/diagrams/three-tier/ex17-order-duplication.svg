<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="problemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff416c"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>
    <linearGradient id="solution1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <linearGradient id="solution2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">&#x1F41B; Order Duplication Bug Analysis</text>

  <rect x="20" y="45" width="660" height="90" rx="10" fill="#fff5f5" stroke="#ff416c" stroke-width="2"/>
  <text x="350" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#ff416c">&#x274C; THE PROBLEM: Race Condition</text>

  <rect x="40" y="85" width="120" height="35" rx="4" fill="#4facfe"/>
  <text x="100" y="107" text-anchor="middle" font-size="10" fill="white">App sends INSERT</text>

  <path d="M160 102 L200 102" stroke="#ff416c" stroke-width="2"/>

  <rect x="200" y="85" width="120" height="35" rx="4" fill="#fa709a"/>
  <text x="260" y="107" text-anchor="middle" font-size="10" fill="white">DB processing...</text>

  <path d="M320 102 L360 102" stroke="#ff416c" stroke-width="2"/>

  <rect x="360" y="85" width="100" height="35" rx="4" fill="url(#problemGrad)"/>
  <text x="410" y="107" text-anchor="middle" font-size="10" fill="white">TIMEOUT!</text>

  <path d="M460 102 L500 102" stroke="#ff416c" stroke-width="2"/>

  <rect x="500" y="85" width="160" height="35" rx="4" fill="url(#problemGrad)"/>
  <text x="580" y="107" text-anchor="middle" font-size="10" fill="white">App retries = DUPLICATE</text>

  <rect x="20" y="155" width="320" height="80" rx="10" fill="#f0fff4" stroke="#38ef7d" stroke-width="2"/>
  <text x="180" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#11998e">&#x2705; Solution 1: Data Tier</text>
  <text x="180" y="205" text-anchor="middle" font-size="10" fill="#333">UNIQUE CONSTRAINT on order_id</text>
  <text x="180" y="225" text-anchor="middle" font-size="9" fill="#666">Duplicate insert fails harmlessly</text>

  <rect x="360" y="155" width="320" height="80" rx="10" fill="#f3e5f5" stroke="#667eea" stroke-width="2"/>
  <text x="520" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#667eea">&#x2705; Solution 2: Application Tier</text>
  <text x="520" y="205" text-anchor="middle" font-size="10" fill="#333">Idempotency Key + Cache Check</text>
  <text x="520" y="225" text-anchor="middle" font-size="9" fill="#666">Reject duplicate requests early</text>

  <rect x="100" y="255" width="500" height="80" rx="10" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="350" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">&#x1F6E1;&#xFE0F; RECOMMENDED: Defense in Depth</text>
  <text x="350" y="305" text-anchor="middle" font-size="10" fill="#333">Combine BOTH solutions:</text>
  <text x="350" y="325" text-anchor="middle" font-size="9" fill="#666">Idempotency cache (fast) + DB constraint (guaranteed)</text>
</svg>
