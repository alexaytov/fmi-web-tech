<svg viewBox="0 0 750 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="foodHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#f7931e"/>
    </linearGradient>
    <linearGradient id="customerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="restaurantGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="driverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="750" height="50" fill="url(#foodHeader)"/>
  <text x="375" y="32" text-anchor="middle" font-size="18" fill="white" font-weight="bold">&#x1F355; Food Delivery System Architecture</text>

  <text x="130" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#4facfe">&#x1F4F1; Customer App</text>
  <rect x="30" y="90" width="200" height="100" rx="8" fill="url(#customerGrad)" opacity="0.2" stroke="#4facfe"/>
  <text x="130" y="115" text-anchor="middle" font-size="10" fill="#333">- Browse Restaurants</text>
  <text x="130" y="135" text-anchor="middle" font-size="10" fill="#333">- View Menus &amp; Cart</text>
  <text x="130" y="155" text-anchor="middle" font-size="10" fill="#333">- Checkout &amp; Pay</text>
  <text x="130" y="175" text-anchor="middle" font-size="10" fill="#333">- Track Order Live</text>

  <text x="375" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#43e97b">&#x1F373; Restaurant Dashboard</text>
  <rect x="275" y="90" width="200" height="100" rx="8" fill="url(#restaurantGrad)" opacity="0.2" stroke="#43e97b"/>
  <text x="375" y="115" text-anchor="middle" font-size="10" fill="#333">- Order Management</text>
  <text x="375" y="135" text-anchor="middle" font-size="10" fill="#333">- Menu Editor</text>
  <text x="375" y="155" text-anchor="middle" font-size="10" fill="#333">- Availability Toggle</text>
  <text x="375" y="175" text-anchor="middle" font-size="10" fill="#333">- Analytics</text>

  <text x="620" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#fa709a">&#x1F697; Driver App</text>
  <rect x="520" y="90" width="200" height="100" rx="8" fill="url(#driverGrad)" opacity="0.2" stroke="#fa709a"/>
  <text x="620" y="115" text-anchor="middle" font-size="10" fill="#333">- Available Orders</text>
  <text x="620" y="135" text-anchor="middle" font-size="10" fill="#333">- Navigation</text>
  <text x="620" y="155" text-anchor="middle" font-size="10" fill="#333">- Delivery Confirm</text>
  <text x="620" y="175" text-anchor="middle" font-size="10" fill="#333">- Earnings</text>

  <path d="M130 190 L130 220 L375 220" stroke="#667eea" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M375 190 L375 220" stroke="#667eea" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M620 190 L620 220 L375 220" stroke="#667eea" stroke-width="2" stroke-dasharray="4,4"/>

  <rect x="150" y="230" width="450" height="80" rx="10" fill="#e8eaf6" stroke="#3f51b5"/>
  <text x="375" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#3f51b5">&#x2699;&#xFE0F; Application Tier - Business Logic</text>
  <text x="200" y="280" font-size="9" fill="#333">- Order Processing</text>
  <text x="200" y="295" font-size="9" fill="#333">- Driver Matching</text>
  <text x="350" y="280" font-size="9" fill="#333">- Payment Processing</text>
  <text x="350" y="295" font-size="9" fill="#333">- Real-time Tracking</text>
  <text x="500" y="280" font-size="9" fill="#333">- Notifications</text>
  <text x="500" y="295" font-size="9" fill="#333">- Pricing Engine</text>

  <path d="M375 310 L375 340" stroke="#667eea" stroke-width="2" stroke-dasharray="4,4"/>

  <rect x="50" y="340" width="650" height="90" rx="10" fill="#fce4ec" stroke="#e91e63"/>
  <text x="375" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2185b">&#x1F5C4;&#xFE0F; Data Tier - PostgreSQL + Redis</text>

  <rect x="70" y="380" width="90" height="35" rx="4" fill="white" stroke="#e91e63"/>
  <text x="115" y="402" text-anchor="middle" font-size="9" fill="#333">users</text>

  <rect x="170" y="380" width="90" height="35" rx="4" fill="white" stroke="#e91e63"/>
  <text x="215" y="402" text-anchor="middle" font-size="9" fill="#333">restaurants</text>

  <rect x="270" y="380" width="90" height="35" rx="4" fill="white" stroke="#e91e63"/>
  <text x="315" y="402" text-anchor="middle" font-size="9" fill="#333">menu_items</text>

  <rect x="370" y="380" width="90" height="35" rx="4" fill="white" stroke="#e91e63"/>
  <text x="415" y="402" text-anchor="middle" font-size="9" fill="#333">orders</text>

  <rect x="470" y="380" width="90" height="35" rx="4" fill="white" stroke="#e91e63"/>
  <text x="515" y="402" text-anchor="middle" font-size="9" fill="#333">payments</text>

  <rect x="570" y="380" width="110" height="35" rx="4" fill="white" stroke="#e91e63"/>
  <text x="625" y="402" text-anchor="middle" font-size="9" fill="#333">driver_locations</text>
</svg>
