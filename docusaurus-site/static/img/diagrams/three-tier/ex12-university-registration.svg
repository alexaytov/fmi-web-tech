<svg viewBox="0 0 750 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="uniHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a237e"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </linearGradient>
    <linearGradient id="presentLayer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="appLayer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="dataLayer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="750" height="50" rx="0" fill="url(#uniHeader)"/>
  <text x="375" y="32" text-anchor="middle" font-size="18" fill="white" font-weight="bold">&#x1F393; University Course Registration System</text>

  <rect x="20" y="70" width="710" height="120" rx="10" fill="url(#presentLayer)" opacity="0.15"/>
  <rect x="20" y="70" width="710" height="30" rx="10" ry="0" fill="url(#presentLayer)"/>
  <text x="375" y="90" text-anchor="middle" font-size="13" fill="white" font-weight="bold">&#x1F5A5;&#xFE0F; PRESENTATION TIER</text>

  <rect x="40" y="110" width="150" height="60" rx="6" fill="white" stroke="#4facfe"/>
  <text x="115" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Student Portal</text>
  <text x="115" y="155" text-anchor="middle" font-size="9" fill="#666">React SPA</text>

  <rect x="210" y="110" width="150" height="60" rx="6" fill="white" stroke="#4facfe"/>
  <text x="285" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Course Catalog</text>
  <text x="285" y="155" text-anchor="middle" font-size="9" fill="#666">Search &amp; Filter</text>

  <rect x="380" y="110" width="150" height="60" rx="6" fill="white" stroke="#4facfe"/>
  <text x="455" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Schedule View</text>
  <text x="455" y="155" text-anchor="middle" font-size="9" fill="#666">Calendar UI</text>

  <rect x="550" y="110" width="160" height="60" rx="6" fill="white" stroke="#4facfe"/>
  <text x="630" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Registration Form</text>
  <text x="630" y="155" text-anchor="middle" font-size="9" fill="#666">Enrollment UI</text>

  <rect x="20" y="210" width="710" height="130" rx="10" fill="url(#appLayer)" opacity="0.15"/>
  <rect x="20" y="210" width="710" height="30" rx="10" ry="0" fill="url(#appLayer)"/>
  <text x="375" y="230" text-anchor="middle" font-size="13" fill="white" font-weight="bold">&#x2699;&#xFE0F; APPLICATION TIER - Business Rules</text>

  <rect x="40" y="250" width="210" height="70" rx="6" fill="white" stroke="#43e97b"/>
  <text x="145" y="275" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">&#x2713; Prerequisites Check</text>
  <text x="145" y="295" text-anchor="middle" font-size="9" fill="#666">Grade C or better required</text>

  <rect x="270" y="250" width="210" height="70" rx="6" fill="white" stroke="#43e97b"/>
  <text x="375" y="275" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">&#x2713; Capacity Management</text>
  <text x="375" y="295" text-anchor="middle" font-size="9" fill="#666">Max 30 students, waitlist</text>

  <rect x="500" y="250" width="210" height="70" rx="6" fill="white" stroke="#43e97b"/>
  <text x="605" y="275" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">&#x2713; Schedule Conflicts</text>
  <text x="605" y="295" text-anchor="middle" font-size="9" fill="#666">No overlapping times</text>

  <rect x="20" y="360" width="710" height="120" rx="10" fill="url(#dataLayer)" opacity="0.15"/>
  <rect x="20" y="360" width="710" height="30" rx="10" ry="0" fill="url(#dataLayer)"/>
  <text x="375" y="380" text-anchor="middle" font-size="13" fill="white" font-weight="bold">&#x1F5C4;&#xFE0F; DATA TIER - PostgreSQL</text>

  <rect x="40" y="400" width="100" height="60" rx="6" fill="white" stroke="#fa709a"/>
  <text x="90" y="425" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">students</text>
  <text x="90" y="445" text-anchor="middle" font-size="8" fill="#666">id, name, major</text>

  <rect x="160" y="400" width="100" height="60" rx="6" fill="white" stroke="#fa709a"/>
  <text x="210" y="425" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">courses</text>
  <text x="210" y="445" text-anchor="middle" font-size="8" fill="#666">id, name, credits</text>

  <rect x="280" y="400" width="100" height="60" rx="6" fill="white" stroke="#fa709a"/>
  <text x="330" y="425" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">sections</text>
  <text x="330" y="445" text-anchor="middle" font-size="8" fill="#666">id, schedule, max</text>

  <rect x="400" y="400" width="100" height="60" rx="6" fill="white" stroke="#fa709a"/>
  <text x="450" y="425" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">enrollments</text>
  <text x="450" y="445" text-anchor="middle" font-size="8" fill="#666">student, section</text>

  <rect x="520" y="400" width="100" height="60" rx="6" fill="white" stroke="#fa709a"/>
  <text x="570" y="425" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">prerequisites</text>
  <text x="570" y="445" text-anchor="middle" font-size="8" fill="#666">course, required</text>

  <rect x="640" y="400" width="80" height="60" rx="6" fill="white" stroke="#fa709a"/>
  <text x="680" y="425" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">grades</text>
  <text x="680" y="445" text-anchor="middle" font-size="8" fill="#666">student, grade</text>
</svg>
