<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="portGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
    <linearGradient id="mysqlAdapterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00758f"/>
      <stop offset="100%" stop-color="#f29111"/>
    </linearGradient>
    <linearGradient id="mongoAdapterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4db33d"/>
      <stop offset="100%" stop-color="#3fa037"/>
    </linearGradient>
  </defs>

  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">&#x1F50C; Ports &amp; Adapters Architecture</text>

  <circle cx="350" cy="160" r="70" fill="url(#coreGrad)"/>
  <text x="350" y="150" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Business</text>
  <text x="350" y="170" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Logic</text>

  <circle cx="350" cy="160" r="110" fill="none" stroke="url(#portGrad)" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="350" y="65" text-anchor="middle" font-size="10" fill="#f5576c" font-weight="bold">PORT (Interface)</text>
  <text x="350" y="80" text-anchor="middle" font-size="9" fill="#666">UserRepository</text>

  <rect x="80" y="130" width="120" height="60" rx="8" fill="url(#mysqlAdapterGrad)"/>
  <text x="140" y="155" text-anchor="middle" font-size="11" fill="white" font-weight="bold">&#x1F42C; MySQL</text>
  <text x="140" y="175" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">Adapter</text>

  <path d="M200 160 L240 160" stroke="#f5576c" stroke-width="2"/>
  <text x="220" y="150" text-anchor="middle" font-size="8" fill="#f5576c">implements</text>

  <rect x="500" y="130" width="120" height="60" rx="8" fill="url(#mongoAdapterGrad)"/>
  <text x="560" y="155" text-anchor="middle" font-size="11" fill="white" font-weight="bold">&#x1F343; MongoDB</text>
  <text x="560" y="175" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">Adapter</text>

  <path d="M460 160 L500 160" stroke="#f5576c" stroke-width="2"/>
  <text x="480" y="150" text-anchor="middle" font-size="8" fill="#f5576c">implements</text>

  <rect x="150" y="260" width="400" height="50" rx="8" fill="#e8f5e9" stroke="#4caf50"/>
  <text x="350" y="280" text-anchor="middle" font-size="11" fill="#2e7d32" font-weight="bold">&#x2705; Switch databases by changing adapter injection</text>
  <text x="350" y="298" text-anchor="middle" font-size="9" fill="#388e3c">Business logic remains UNCHANGED</text>
</svg>
