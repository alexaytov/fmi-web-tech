<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="validGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#56ab2f"/>
      <stop offset="100%" stop-color="#a8e063"/>
    </linearGradient>
    <linearGradient id="flawedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff416c"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>
    <linearGradient id="recommendGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">&#x1F3AF; Architecture Decision Analysis</text>

  <rect x="20" y="55" width="320" height="130" rx="10" fill="#f0fff4" stroke="#56ab2f" stroke-width="2"/>
  <rect x="20" y="55" width="320" height="35" rx="10" ry="0" fill="url(#validGrad)"/>
  <text x="180" y="78" text-anchor="middle" font-size="13" fill="white" font-weight="bold">&#x2705; When Argument is VALID</text>

  <text x="40" y="110" font-size="11" fill="#333">- MVP/Prototype stage</text>
  <text x="40" y="130" font-size="11" fill="#333">- Small team (2-5 developers)</text>
  <text x="40" y="150" font-size="11" fill="#333">- Uncertain requirements</text>
  <text x="40" y="170" font-size="11" fill="#333">- Limited budget/time pressure</text>

  <rect x="360" y="55" width="320" height="130" rx="10" fill="#fff5f5" stroke="#ff416c" stroke-width="2"/>
  <rect x="360" y="55" width="320" height="35" rx="10" ry="0" fill="url(#flawedGrad)"/>
  <text x="520" y="78" text-anchor="middle" font-size="13" fill="white" font-weight="bold">&#x274C; When Argument is FLAWED</text>

  <text x="380" y="110" font-size="11" fill="#333">- Survivorship bias (many failed!)</text>
  <text x="380" y="130" font-size="11" fill="#333">- Different era (2007 vs 2025)</text>
  <text x="380" y="150" font-size="11" fill="#333">- Social media can go viral overnight</text>
  <text x="380" y="170" font-size="11" fill="#333">- Netflix spent years refactoring</text>

  <rect x="100" y="200" width="500" height="130" rx="10" fill="#f3e5f5" stroke="#667eea" stroke-width="2"/>
  <rect x="100" y="200" width="500" height="35" rx="10" ry="0" fill="url(#recommendGrad)"/>
  <text x="350" y="223" text-anchor="middle" font-size="13" fill="white" font-weight="bold">&#x1F4A1; RECOMMENDATION: Modular Monolith</text>

  <rect x="130" y="250" width="200" height="60" rx="8" fill="white" stroke="#667eea"/>
  <text x="230" y="275" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Start Simple</text>
  <text x="230" y="295" text-anchor="middle" font-size="9" fill="#666">Single codebase with modules</text>

  <path d="M330 280 L370 280" stroke="#667eea" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="350" y="275" text-anchor="middle" font-size="16" fill="#667eea">&#x2192;</text>

  <rect x="370" y="250" width="200" height="60" rx="8" fill="white" stroke="#667eea"/>
  <text x="470" y="275" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Scale When Needed</text>
  <text x="470" y="295" text-anchor="middle" font-size="9" fill="#666">Extract services as you grow</text>
</svg>
