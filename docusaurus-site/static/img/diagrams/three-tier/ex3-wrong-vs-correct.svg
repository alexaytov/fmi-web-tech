<svg viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wrongPath" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff416c"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>
    <linearGradient id="rightPath" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
  </defs>

  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">&#x274C; WRONG vs &#x2705; CORRECT Approach</text>

  <rect x="20" y="50" width="260" height="200" rx="12" fill="#fff5f5" stroke="#ff416c" stroke-width="2"/>
  <text x="150" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#ff416c">&#x274C; Direct Access (WRONG)</text>

  <rect x="50" y="95" width="200" height="35" rx="6" fill="#4facfe"/>
  <text x="150" y="118" text-anchor="middle" font-size="12" fill="white">Presentation</text>

  <path d="M150 130 L150 180" stroke="url(#wrongPath)" stroke-width="3"/>
  <text x="180" y="160" font-size="10" fill="#ff416c">Direct!</text>

  <rect x="50" y="180" width="200" height="35" rx="6" fill="#fa709a"/>
  <text x="150" y="203" text-anchor="middle" font-size="12" fill="white">Database</text>

  <rect x="320" y="50" width="260" height="200" rx="12" fill="#f0fff4" stroke="#38ef7d" stroke-width="2"/>
  <text x="450" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#11998e">&#x2705; Through Tiers (CORRECT)</text>

  <rect x="350" y="90" width="200" height="30" rx="6" fill="#4facfe"/>
  <text x="450" y="110" text-anchor="middle" font-size="11" fill="white">Presentation</text>

  <path d="M450 120 L450 140" stroke="url(#rightPath)" stroke-width="2"/>

  <rect x="350" y="140" width="200" height="30" rx="6" fill="#43e97b"/>
  <text x="450" y="160" text-anchor="middle" font-size="11" fill="white">Application</text>

  <path d="M450 170 L450 190" stroke="url(#rightPath)" stroke-width="2"/>

  <rect x="350" y="190" width="200" height="30" rx="6" fill="#fa709a"/>
  <text x="450" y="210" text-anchor="middle" font-size="11" fill="white">Database</text>
</svg>
