<svg viewBox="0 0 750 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="monoCompGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="threeCompGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="threeCompGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="threeCompGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>
    <linearGradient id="microGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
    <linearGradient id="microGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="microGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
  </defs>

  <text x="375" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">&#x1F6D2; "Add to Cart" - Architecture Comparison</text>

  <text x="125" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#667eea">A) Monolithic</text>
  <rect x="30" y="70" width="190" height="150" rx="10" fill="url(#monoCompGrad)"/>
  <text x="125" y="105" text-anchor="middle" font-size="11" fill="white">All-in-One</text>
  <rect x="50" y="115" width="150" height="25" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="125" y="133" text-anchor="middle" font-size="9" fill="white">UI + Logic + Data</text>
  <rect x="50" y="150" width="150" height="55" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="125" y="170" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">Single Deployment</text>
  <text x="125" y="190" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">Scale Everything</text>

  <text x="375" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#43e97b">B) Three-Tier</text>
  <rect x="280" y="70" width="190" height="150" rx="10" fill="#f5f5f5" stroke="#43e97b" stroke-width="2"/>
  <rect x="295" y="85" width="160" height="35" rx="4" fill="url(#threeCompGrad1)"/>
  <text x="375" y="107" text-anchor="middle" font-size="9" fill="white">React Frontend</text>
  <rect x="295" y="125" width="160" height="35" rx="4" fill="url(#threeCompGrad2)"/>
  <text x="375" y="147" text-anchor="middle" font-size="9" fill="white">Express API</text>
  <rect x="295" y="165" width="160" height="35" rx="4" fill="url(#threeCompGrad3)"/>
  <text x="375" y="187" text-anchor="middle" font-size="9" fill="white">PostgreSQL</text>

  <text x="625" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#f5576c">C) Microservices</text>
  <rect x="530" y="70" width="190" height="150" rx="10" fill="#fce4ec" stroke="#f5576c" stroke-width="2"/>
  <rect x="545" y="85" width="70" height="50" rx="4" fill="url(#microGrad1)"/>
  <text x="580" y="105" text-anchor="middle" font-size="8" fill="white">Cart</text>
  <text x="580" y="120" text-anchor="middle" font-size="8" fill="white">Service</text>
  <rect x="625" y="85" width="70" height="50" rx="4" fill="url(#microGrad2)"/>
  <text x="660" y="105" text-anchor="middle" font-size="8" fill="white">Product</text>
  <text x="660" y="120" text-anchor="middle" font-size="8" fill="white">Service</text>
  <rect x="545" y="145" width="70" height="50" rx="4" fill="url(#microGrad3)"/>
  <text x="580" y="165" text-anchor="middle" font-size="8" fill="white">User</text>
  <text x="580" y="180" text-anchor="middle" font-size="8" fill="white">Service</text>
  <rect x="625" y="145" width="70" height="50" rx="4" fill="#ffeb3b"/>
  <text x="660" y="165" text-anchor="middle" font-size="8" fill="#333">Event</text>
  <text x="660" y="180" text-anchor="middle" font-size="8" fill="#333">Bus</text>

  <rect x="30" y="240" width="190" height="140" rx="8" fill="#e8f5e9"/>
  <text x="125" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">Best For:</text>
  <text x="125" y="290" text-anchor="middle" font-size="10" fill="#333">- MVP / Prototypes</text>
  <text x="125" y="310" text-anchor="middle" font-size="10" fill="#333">- Small Teams (1-5)</text>
  <text x="125" y="330" text-anchor="middle" font-size="10" fill="#333">- Fast Time-to-Market</text>
  <text x="125" y="360" text-anchor="middle" font-size="9" fill="#666">&#x26A0;&#xFE0F; Hard to scale later</text>

  <rect x="280" y="240" width="190" height="140" rx="8" fill="#e3f2fd"/>
  <text x="375" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">Best For:</text>
  <text x="375" y="290" text-anchor="middle" font-size="10" fill="#333">- Growing Startups</text>
  <text x="375" y="310" text-anchor="middle" font-size="10" fill="#333">- Medium Teams (5-15)</text>
  <text x="375" y="330" text-anchor="middle" font-size="10" fill="#333">- Balanced Approach</text>
  <text x="375" y="360" text-anchor="middle" font-size="9" fill="#666">&#x2705; Recommended default</text>

  <rect x="530" y="240" width="190" height="140" rx="8" fill="#fce4ec"/>
  <text x="625" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2185b">Best For:</text>
  <text x="625" y="290" text-anchor="middle" font-size="10" fill="#333">- Large Scale Systems</text>
  <text x="625" y="310" text-anchor="middle" font-size="10" fill="#333">- Big Teams (15+)</text>
  <text x="625" y="330" text-anchor="middle" font-size="10" fill="#333">- Independent Scaling</text>
  <text x="625" y="360" text-anchor="middle" font-size="9" fill="#666">&#x26A0;&#xFE0F; Operational complexity</text>
</svg>
