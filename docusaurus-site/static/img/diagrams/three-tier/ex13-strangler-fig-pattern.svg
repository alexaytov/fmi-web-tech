  <text x="410" y="310" font-size="10" fill="#333">- API Gateway routes traffic</text>
  <text x="410" y="330" font-size="10" fill="#333">- Database sync jobs running</text>
  <text x="410" y="350" font-size="10" fill="#333">- Health checks before cutover</text>
  <text x="410" y="370" font-size="10" fill="#333">- Gradual traffic shift (canary)</text>
