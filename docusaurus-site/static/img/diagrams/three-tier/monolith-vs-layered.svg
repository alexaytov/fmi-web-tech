<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">
  <defs>
    <linearGradient id="monoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#95a5a6"/>
      <stop offset="100%" stop-color="#7f8c8d"/>
    </linearGradient>
    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
    <linearGradient id="logicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
    <linearGradient id="dataGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#1e8449"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9b59b6"/>
      <stop offset="100%" stop-color="#8e44ad"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Titles -->
  <text x="115" y="35" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">МОНОЛИТ</text>
  <text x="530" y="35" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">ТРИСЛОЙНА АРХИТЕКТУРА</text>

  <!-- Monolith Block -->
  <g filter="url(#shadow2)">
    <rect x="30" y="55" width="170" height="220" rx="12" fill="url(#monoGrad)"/>
    <rect x="45" y="70" width="140" height="50" rx="6" fill="#3498db" fill-opacity="0.7"/>
    <text x="115" y="100" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">UI Code</text>
    <rect x="45" y="130" width="140" height="50" rx="6" fill="#e67e22" fill-opacity="0.7"/>
    <text x="115" y="160" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Business Logic</text>
    <rect x="45" y="190" width="140" height="50" rx="6" fill="#27ae60" fill-opacity="0.7"/>
    <text x="115" y="220" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Data Access</text>
    <!-- Crossing lines showing tight coupling -->
    <line x1="50" y1="95" x2="180" y2="155" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="3"/>
    <line x1="180" y1="95" x2="50" y2="155" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="3"/>
    <line x1="50" y1="155" x2="180" y2="215" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="3"/>
    <line x1="180" y1="155" x2="50" y2="215" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="3"/>
  </g>

  <!-- Transform Arrow -->
  <g>
    <path d="M 230 165 L 300 165" stroke="url(#arrowGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <polygon points="305,165 290,155 290,175" fill="#8e44ad"/>
    <text x="265" y="145" fill="#9b59b6" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Refactor</text>
  </g>

  <!-- Three-Tier Layers -->
  <g filter="url(#shadow2)">
    <rect x="350" y="55" width="180" height="60" rx="10" fill="url(#uiGrad)"/>
    <text x="440" y="82" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Presentation</text>
    <text x="440" y="100" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">HTML, CSS, JS</text>
  </g>

  <line x1="440" y1="117" x2="440" y2="135" stroke="#7f8c8d" stroke-width="2"/>

  <g filter="url(#shadow2)">
    <rect x="350" y="140" width="180" height="60" rx="10" fill="url(#logicGrad)"/>
    <text x="440" y="167" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Application</text>
    <text x="440" y="185" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Business Logic</text>
  </g>

  <line x1="440" y1="202" x2="440" y2="220" stroke="#7f8c8d" stroke-width="2"/>

  <g filter="url(#shadow2)">
    <rect x="350" y="225" width="180" height="60" rx="10" fill="url(#dataGrad2)"/>
    <text x="440" y="252" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Data</text>
    <text x="440" y="270" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Database</text>
  </g>

  <!-- Checkmarks -->
  <text x="560" y="90" fill="#27ae60" font-family="system-ui, sans-serif" font-size="20">✓</text>
  <text x="560" y="175" fill="#27ae60" font-family="system-ui, sans-serif" font-size="20">✓</text>
  <text x="560" y="260" fill="#27ae60" font-family="system-ui, sans-serif" font-size="20">✓</text>

  <!-- Labels -->
  <text x="115" y="295" fill="#c0392b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Тясно свързан</text>
  <text x="530" y="310" fill="#27ae60" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Независими слоеве</text>
</svg>
