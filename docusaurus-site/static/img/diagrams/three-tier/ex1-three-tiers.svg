<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="presentationGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="applicationGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="50" y="20" width="500" height="80" rx="12" fill="url(#presentationGrad)" filter="url(#shadow)"/>
  <text x="100" y="55" fill="white" font-size="20" font-weight="bold">&#x1F5A5;&#xFE0F; Presentation Tier</text>
  <text x="100" y="80" fill="rgba(255,255,255,0.9)" font-size="12">User Interface - React, Vue, Angular</text>

  <path d="M300 100 L300 130" stroke="#667eea" stroke-width="3" stroke-dasharray="5,5"/>
  <polygon points="295,125 300,135 305,125" fill="#667eea"/>

  <rect x="50" y="130" width="500" height="80" rx="12" fill="url(#applicationGrad)" filter="url(#shadow)"/>
  <text x="100" y="165" fill="white" font-size="20" font-weight="bold">&#x2699;&#xFE0F; Application Tier</text>
  <text x="100" y="190" fill="rgba(255,255,255,0.9)" font-size="12">Business Logic - Node.js, Spring, Django</text>

  <path d="M300 210 L300 240" stroke="#667eea" stroke-width="3" stroke-dasharray="5,5"/>
  <polygon points="295,235 300,245 305,235" fill="#667eea"/>

  <rect x="50" y="240" width="500" height="80" rx="12" fill="url(#dataGrad)" filter="url(#shadow)"/>
  <text x="100" y="275" fill="white" font-size="20" font-weight="bold">&#x1F5C4;&#xFE0F; Data Tier</text>
  <text x="100" y="300" fill="rgba(255,255,255,0.9)" font-size="12">Storage - PostgreSQL, MongoDB, Redis</text>
</svg>
