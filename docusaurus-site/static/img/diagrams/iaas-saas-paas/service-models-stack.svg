<svg viewBox="0 0 750 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Service Models Stack -->
  <rect x="50" y="20" width="200" height="50" rx="8" fill="#22c55e" />
  <text x="150" y="50" text-anchor="middle" fill="white" font-size="16" font-weight="bold">SaaS</text>
  <text x="150" y="62" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Ready-to-use Apps</text>

  <rect x="50" y="75" width="200" height="50" rx="8" fill="#3b82f6" />
  <text x="150" y="105" text-anchor="middle" fill="white" font-size="16" font-weight="bold">PaaS</text>
  <text x="150" y="117" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Development Platform</text>

  <rect x="50" y="130" width="200" height="50" rx="8" fill="#8b5cf6" />
  <text x="150" y="160" text-anchor="middle" fill="white" font-size="16" font-weight="bold">IaaS</text>
  <text x="150" y="172" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Virtual Infrastructure</text>

  <!-- Arrows and Labels -->
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22c55e" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3b82f6" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b5cf6" />
    </marker>
  </defs>

  <path d="M 270 45 L 310 45" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)" />
  <path d="M 270 100 L 310 100" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)" />
  <path d="M 270 155 L 310 155" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)" />

  <!-- Examples -->
  <rect x="320" y="20" width="200" height="50" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
  <text x="420" y="40" text-anchor="middle" fill="#166534" font-size="11" font-weight="bold">Gmail, Office 365</text>
  <text x="420" y="55" text-anchor="middle" fill="#166534" font-size="10">Salesforce CRM</text>

  <rect x="320" y="75" width="200" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
  <text x="420" y="95" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="bold">App Engine, Beanstalk</text>
  <text x="420" y="110" text-anchor="middle" fill="#1e40af" font-size="10">Azure App Service</text>

  <rect x="320" y="130" width="200" height="50" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" />
  <text x="420" y="150" text-anchor="middle" fill="#5b21b6" font-size="11" font-weight="bold">EC2, Azure VMs</text>
  <text x="420" y="165" text-anchor="middle" fill="#5b21b6" font-size="10">GCP Compute Engine</text>

  <!-- Abstraction Scale -->
  <rect x="560" y="20" width="160" height="160" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  <text x="640" y="45" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="bold">Ниво на Абстракция</text>

  <rect x="580" y="60" width="120" height="20" rx="4" fill="#22c55e" opacity="0.8" />
  <text x="640" y="74" text-anchor="middle" fill="white" font-size="10">Най-високо ↑</text>

  <rect x="580" y="90" width="90" height="20" rx="4" fill="#3b82f6" opacity="0.8" />
  <text x="625" y="104" text-anchor="middle" fill="white" font-size="10">Средно</text>

  <rect x="580" y="120" width="60" height="20" rx="4" fill="#8b5cf6" opacity="0.8" />
  <text x="610" y="134" text-anchor="middle" fill="white" font-size="10">Ниско</text>

  <text x="640" y="160" text-anchor="middle" fill="#64748b" font-size="9">Повече контрол ↓</text>
</svg>
