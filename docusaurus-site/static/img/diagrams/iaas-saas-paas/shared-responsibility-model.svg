<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="bold">Shared Responsibility Model - IaaS</text>

  <!-- Stack Layers -->
  <rect x="50" y="50" width="180" height="30" rx="4" fill="#ef4444" />
  <text x="140" y="70" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Layer 7: Data</text>

  <rect x="50" y="85" width="180" height="30" rx="4" fill="#f97316" />
  <text x="140" y="105" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Layer 6: Applications</text>

  <rect x="50" y="120" width="180" height="30" rx="4" fill="#eab308" />
  <text x="140" y="140" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Layer 5: Runtime</text>

  <rect x="50" y="155" width="180" height="30" rx="4" fill="#84cc16" />
  <text x="140" y="175" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Layer 4: Middleware</text>

  <rect x="50" y="190" width="180" height="30" rx="4" fill="#22c55e" />
  <text x="140" y="210" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Layer 3: OS</text>

  <rect x="50" y="225" width="180" height="30" rx="4" fill="#3b82f6" />
  <text x="140" y="245" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Layer 2: Virtualization</text>

  <rect x="50" y="260" width="180" height="30" rx="4" fill="#8b5cf6" />
  <text x="140" y="280" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Layer 1: Physical</text>

  <!-- Responsibility Division Line -->
  <line x1="250" y1="218" x2="400" y2="218" stroke="#dc2626" stroke-width="3" stroke-dasharray="8,4" />
  <text x="325" y="235" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">← IaaS Division Line</text>

  <!-- Customer vs Provider Labels -->
  <rect x="260" y="50" width="130" height="155" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" />
  <text x="325" y="75" text-anchor="middle" fill="#dc2626" font-size="13" font-weight="bold">👤 Customer</text>
  <text x="325" y="95" text-anchor="middle" fill="#7f1d1d" font-size="10">Manages:</text>
  <text x="325" y="115" text-anchor="middle" fill="#7f1d1d" font-size="10">• OS &amp; Patching</text>
  <text x="325" y="130" text-anchor="middle" fill="#7f1d1d" font-size="10">• Middleware</text>
  <text x="325" y="145" text-anchor="middle" fill="#7f1d1d" font-size="10">• Runtime</text>
  <text x="325" y="160" text-anchor="middle" fill="#7f1d1d" font-size="10">• Applications</text>
  <text x="325" y="175" text-anchor="middle" fill="#7f1d1d" font-size="10">• Data &amp; Security</text>
  <text x="325" y="195" text-anchor="middle" fill="#7f1d1d" font-size="9" font-style="italic">Layers 3-7</text>

  <rect x="260" y="220" width="130" height="90" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
  <text x="325" y="245" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">☁️ Provider</text>
  <text x="325" y="265" text-anchor="middle" fill="#1e3a8a" font-size="10">Manages:</text>
  <text x="325" y="280" text-anchor="middle" fill="#1e3a8a" font-size="10">• Physical &amp; Network</text>
  <text x="325" y="295" text-anchor="middle" fill="#1e3a8a" font-size="10">• Virtualization</text>

  <!-- Comparison Table Header -->
  <rect x="420" y="50" width="250" height="260" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  <text x="545" y="75" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="bold">Отговорност по Модели</text>

  <!-- IaaS Column -->
  <rect x="435" y="90" width="70" height="25" rx="4" fill="#8b5cf6" />
  <text x="470" y="107" text-anchor="middle" fill="white" font-size="10" font-weight="bold">IaaS</text>
  <rect x="435" y="120" width="70" height="20" rx="2" fill="#fca5a5" />
  <rect x="435" y="142" width="70" height="20" rx="2" fill="#fca5a5" />
  <rect x="435" y="164" width="70" height="20" rx="2" fill="#fca5a5" />
  <rect x="435" y="186" width="70" height="20" rx="2" fill="#fca5a5" />
  <rect x="435" y="208" width="70" height="20" rx="2" fill="#fca5a5" />
  <rect x="435" y="230" width="70" height="20" rx="2" fill="#93c5fd" />
  <rect x="435" y="252" width="70" height="20" rx="2" fill="#93c5fd" />

  <!-- PaaS Column -->
  <rect x="510" y="90" width="70" height="25" rx="4" fill="#3b82f6" />
  <text x="545" y="107" text-anchor="middle" fill="white" font-size="10" font-weight="bold">PaaS</text>
  <rect x="510" y="120" width="70" height="20" rx="2" fill="#fca5a5" />
  <rect x="510" y="142" width="70" height="20" rx="2" fill="#fca5a5" />
  <rect x="510" y="164" width="70" height="20" rx="2" fill="#93c5fd" />
  <rect x="510" y="186" width="70" height="20" rx="2" fill="#93c5fd" />
  <rect x="510" y="208" width="70" height="20" rx="2" fill="#93c5fd" />
  <rect x="510" y="230" width="70" height="20" rx="2" fill="#93c5fd" />
  <rect x="510" y="252" width="70" height="20" rx="2" fill="#93c5fd" />

  <!-- SaaS Column -->
  <rect x="585" y="90" width="70" height="25" rx="4" fill="#22c55e" />
  <text x="620" y="107" text-anchor="middle" fill="white" font-size="10" font-weight="bold">SaaS</text>
  <rect x="585" y="120" width="70" height="20" rx="2" fill="#fca5a5" opacity="0.5" />
  <rect x="585" y="142" width="70" height="20" rx="2" fill="#93c5fd" />
  <rect x="585" y="164" width="70" height="20" rx="2" fill="#93c5fd" />
  <rect x="585" y="186" width="70" height="20" rx="2" fill="#93c5fd" />
  <rect x="585" y="208" width="70" height="20" rx="2" fill="#93c5fd" />
  <rect x="585" y="230" width="70" height="20" rx="2" fill="#93c5fd" />
  <rect x="585" y="252" width="70" height="20" rx="2" fill="#93c5fd" />

  <!-- Legend -->
  <rect x="435" y="280" width="15" height="12" rx="2" fill="#fca5a5" />
  <text x="455" y="290" fill="#64748b" font-size="9">Customer</text>
  <rect x="520" y="280" width="15" height="12" rx="2" fill="#93c5fd" />
  <text x="540" y="290" fill="#64748b" font-size="9">Provider</text>
</svg>
