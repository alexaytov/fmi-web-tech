<svg viewBox="0 0 750 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="375" y="25" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">🔮 Cloud Computing Evolution: Future Trends</text>

  <!-- Traditional Spectrum -->
  <rect x="50" y="45" width="650" height="50" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2" />
  <text x="375" y="65" text-anchor="middle" fill="#64748b" font-size="10">Traditional Service Model Spectrum</text>

  <rect x="80" y="70" width="80" height="20" rx="4" fill="#8b5cf6" />
  <text x="120" y="84" text-anchor="middle" fill="white" font-size="9" font-weight="bold">IaaS</text>

  <line x1="170" y1="80" x2="270" y2="80" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" />

  <rect x="280" y="70" width="80" height="20" rx="4" fill="#3b82f6" />
  <text x="320" y="84" text-anchor="middle" fill="white" font-size="9" font-weight="bold">PaaS</text>

  <line x1="370" y1="80" x2="470" y2="80" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" />

  <rect x="480" y="70" width="80" height="20" rx="4" fill="#22c55e" />
  <text x="520" y="84" text-anchor="middle" fill="white" font-size="9" font-weight="bold">SaaS</text>

  <line x1="570" y1="80" x2="670" y2="80" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Emerging Trends -->
  <rect x="50" y="110" width="650" height="80" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2" />
  <text x="375" y="130" text-anchor="middle" fill="#7c3aed" font-size="10" font-weight="bold">🚀 Emerging: Blurred Boundaries</text>

  <!-- CaaS -->
  <rect x="80" y="145" width="100" height="35" rx="6" fill="#a78bfa" />
  <text x="130" y="162" text-anchor="middle" fill="white" font-size="9" font-weight="bold">CaaS</text>
  <text x="130" y="174" text-anchor="middle" fill="white" font-size="7">Containers</text>

  <!-- FaaS -->
  <rect x="200" y="145" width="100" height="35" rx="6" fill="#818cf8" />
  <text x="250" y="162" text-anchor="middle" fill="white" font-size="9" font-weight="bold">FaaS</text>
  <text x="250" y="174" text-anchor="middle" fill="white" font-size="7">Serverless</text>

  <!-- AI/ML as a Service -->
  <rect x="320" y="145" width="100" height="35" rx="6" fill="#6366f1" />
  <text x="370" y="162" text-anchor="middle" fill="white" font-size="9" font-weight="bold">AI/ML aaS</text>
  <text x="370" y="174" text-anchor="middle" fill="white" font-size="7">ML Platforms</text>

  <!-- Edge -->
  <rect x="440" y="145" width="100" height="35" rx="6" fill="#4f46e5" />
  <text x="490" y="162" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Edge</text>
  <text x="490" y="174" text-anchor="middle" fill="white" font-size="7">Computing</text>

  <!-- Multi-Cloud -->
  <rect x="560" y="145" width="100" height="35" rx="6" fill="#4338ca" />
  <text x="610" y="162" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Multi-Cloud</text>
  <text x="610" y="174" text-anchor="middle" fill="white" font-size="7">Hybrid</text>
</svg>
