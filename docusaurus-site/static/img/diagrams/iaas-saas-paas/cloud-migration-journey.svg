<svg viewBox="0 0 750 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="375" y="20" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">🚀 Cloud Migration Journey: On-Prem → Cloud</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b" />
    </marker>
  </defs>

  <!-- On-Premises -->
  <rect x="30" y="45" width="130" height="110" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="2" />
  <text x="95" y="70" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="bold">🏢 On-Premises</text>
  <rect x="45" y="80" width="100" height="20" rx="3" fill="#ef4444" />
  <text x="95" y="94" text-anchor="middle" fill="white" font-size="8">Web Frontend</text>
  <rect x="45" y="105" width="100" height="20" rx="3" fill="#ef4444" />
  <text x="95" y="119" text-anchor="middle" fill="white" font-size="8">Transaction Engine</text>
  <rect x="45" y="130" width="100" height="20" rx="3" fill="#ef4444" />
  <text x="95" y="144" text-anchor="middle" fill="white" font-size="8">PostgreSQL DB</text>

  <!-- Phase Arrows -->
  <path d="M 170 100 L 200 100" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)" />

  <!-- Phase 1: Frontend -->
  <rect x="210" y="45" width="120" height="110" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
  <text x="270" y="68" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="bold">Phase 1</text>
  <text x="270" y="82" text-anchor="middle" fill="#1e40af" font-size="8">(Months 1-4)</text>
  <rect x="225" y="92" width="90" height="18" rx="3" fill="#3b82f6" />
  <text x="270" y="104" text-anchor="middle" fill="white" font-size="8">✓ Frontend → PaaS</text>
  <rect x="225" y="115" width="90" height="18" rx="3" fill="#94a3b8" opacity="0.5" />
  <text x="270" y="127" text-anchor="middle" fill="#475569" font-size="7">Engine (on-prem)</text>
  <rect x="225" y="138" width="90" height="18" rx="3" fill="#94a3b8" opacity="0.5" />
  <text x="270" y="150" text-anchor="middle" fill="#475569" font-size="7">DB (on-prem)</text>

  <path d="M 340 100 L 370 100" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)" />

  <!-- Phase 2: Database -->
  <rect x="380" y="45" width="120" height="110" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2" />
  <text x="440" y="68" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">Phase 2</text>
  <text x="440" y="82" text-anchor="middle" fill="#166534" font-size="8">(Months 4-8)</text>
  <rect x="395" y="92" width="90" height="18" rx="3" fill="#3b82f6" />
  <text x="440" y="104" text-anchor="middle" fill="white" font-size="8">✓ Frontend</text>
  <rect x="395" y="115" width="90" height="18" rx="3" fill="#94a3b8" opacity="0.5" />
  <text x="440" y="127" text-anchor="middle" fill="#475569" font-size="7">Engine (on-prem)</text>
  <rect x="395" y="138" width="90" height="18" rx="3" fill="#22c55e" />
  <text x="440" y="150" text-anchor="middle" fill="white" font-size="8">✓ DB → PaaS</text>

  <path d="M 510 100 L 540 100" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)" />

  <!-- Phase 3: Complete -->
  <rect x="550" y="45" width="150" height="110" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
  <text x="625" y="68" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">Phase 3-4</text>
  <text x="625" y="82" text-anchor="middle" fill="#166534" font-size="8">(Months 8-18)</text>
  <rect x="565" y="92" width="120" height="18" rx="3" fill="#22c55e" />
  <text x="625" y="104" text-anchor="middle" fill="white" font-size="8">✓ All in Cloud!</text>
  <rect x="565" y="115" width="120" height="18" rx="3" fill="#8b5cf6" />
  <text x="625" y="127" text-anchor="middle" fill="white" font-size="8">Engine → IaaS</text>
  <text x="625" y="148" text-anchor="middle" fill="#166534" font-size="8">🎉 Migration Complete</text>
</svg>
