<svg viewBox="0 0 750 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="375" y="25" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="bold">🏢 The Big Three Cloud Providers</text>

  <!-- AWS -->
  <rect x="30" y="50" width="210" height="120" rx="12" fill="#ff9900" opacity="0.1" stroke="#ff9900" stroke-width="2" />
  <rect x="50" y="65" width="50" height="30" rx="6" fill="#ff9900" />
  <text x="75" y="85" text-anchor="middle" fill="white" font-size="12" font-weight="bold">AWS</text>
  <text x="135" y="90" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="bold">Amazon Web Services</text>
  <text x="135" y="110" text-anchor="middle" fill="#64748b" font-size="10">~37% Market Share</text>
  <text x="135" y="130" text-anchor="middle" fill="#64748b" font-size="9">EC2 • Lambda • S3</text>
  <text x="135" y="145" text-anchor="middle" fill="#64748b" font-size="9">RDS • Elastic Beanstalk</text>
  <circle cx="205" cy="65" r="15" fill="#22c55e" />
  <text x="205" y="70" text-anchor="middle" fill="white" font-size="11" font-weight="bold">#1</text>

  <!-- Azure -->
  <rect x="270" y="50" width="210" height="120" rx="12" fill="#0078d4" opacity="0.1" stroke="#0078d4" stroke-width="2" />
  <rect x="290" y="65" width="50" height="30" rx="6" fill="#0078d4" />
  <text x="315" y="85" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Azure</text>
  <text x="375" y="90" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="bold">Microsoft Azure</text>
  <text x="375" y="110" text-anchor="middle" fill="#64748b" font-size="10">~23% Market Share</text>
  <text x="375" y="130" text-anchor="middle" fill="#64748b" font-size="9">VMs • Functions • Blob</text>
  <text x="375" y="145" text-anchor="middle" fill="#64748b" font-size="9">SQL • App Service</text>
  <circle cx="445" cy="65" r="15" fill="#3b82f6" />
  <text x="445" y="70" text-anchor="middle" fill="white" font-size="11" font-weight="bold">#2</text>

  <!-- GCP -->
  <rect x="510" y="50" width="210" height="120" rx="12" fill="#4285f4" opacity="0.1" stroke="#4285f4" stroke-width="2" />
  <rect x="530" y="65" width="50" height="30" rx="6" fill="#4285f4" />
  <text x="555" y="85" text-anchor="middle" fill="white" font-size="11" font-weight="bold">GCP</text>
  <text x="615" y="90" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="bold">Google Cloud</text>
  <text x="615" y="110" text-anchor="middle" fill="#64748b" font-size="10">~10% Market Share</text>
  <text x="615" y="130" text-anchor="middle" fill="#64748b" font-size="9">Compute • Cloud Functions</text>
  <text x="615" y="145" text-anchor="middle" fill="#64748b" font-size="9">Cloud SQL • App Engine</text>
  <circle cx="685" cy="65" r="15" fill="#f59e0b" />
  <text x="685" y="70" text-anchor="middle" fill="white" font-size="11" font-weight="bold">#3</text>
</svg>
