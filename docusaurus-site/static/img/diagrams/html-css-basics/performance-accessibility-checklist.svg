<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
  <text x="300" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Performance &amp; Accessibility Checklist</text>

  <rect x="30" y="45" width="260" height="250" rx="8" fill="#e8f5e9" stroke="#4caf50"/>
  <text x="160" y="70" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="bold">Performance</text>
  <text x="45" y="95" font-size="9" fill="#333">1. Optimize images (WebP, srcset)</text>
  <text x="45" y="115" font-size="9" fill="#333">2. Add loading="lazy" below fold</text>
  <text x="45" y="135" font-size="9" fill="#333">3. Minify CSS/JS, remove unused</text>
  <text x="45" y="155" font-size="9" fill="#333">4. Use defer for scripts</text>
  <text x="45" y="175" font-size="9" fill="#333">5. Enable compression (gzip)</text>

  <rect x="310" y="45" width="260" height="250" rx="8" fill="#e3f2fd" stroke="#2196f3"/>
  <text x="440" y="70" text-anchor="middle" font-size="12" fill="#1565c0" font-weight="bold">Accessibility</text>
  <text x="325" y="95" font-size="9" fill="#333">6. Check color contrast (4.5:1)</text>
  <text x="325" y="115" font-size="9" fill="#333">7. Add alt to all images</text>
  <text x="325" y="135" font-size="9" fill="#333">8. Use semantic HTML</text>
  <text x="325" y="155" font-size="9" fill="#333">9. Add visible :focus styles</text>
  <text x="325" y="175" font-size="9" fill="#333">10. Test with keyboard only</text>

  <text x="160" y="220" text-anchor="middle" font-size="8" fill="#388e3c">Tools: Lighthouse, WebPageTest</text>
  <text x="440" y="220" text-anchor="middle" font-size="8" fill="#1976d2">Tools: axe, WAVE, VoiceOver</text>
</svg>
