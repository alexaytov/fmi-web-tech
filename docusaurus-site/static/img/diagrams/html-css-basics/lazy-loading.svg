<svg viewBox="0 0 550 120" xmlns="http://www.w3.org/2000/svg">
  <rect x="30" y="20" width="230" height="80" rx="8" fill="#ffebee" stroke="#f44336"/>
  <text x="145" y="45" text-anchor="middle" font-size="11" fill="#c62828" font-weight="bold">Without lazy loading</text>
  <text x="145" y="65" text-anchor="middle" font-size="10" fill="#d32f2f">All images load immediately</text>
  <text x="145" y="85" text-anchor="middle" font-size="10" fill="#d32f2f">Slow initial page load</text>

  <rect x="290" y="20" width="230" height="80" rx="8" fill="#e8f5e9" stroke="#4caf50"/>
  <text x="405" y="45" text-anchor="middle" font-size="11" fill="#2e7d32" font-weight="bold">With loading="lazy"</text>
  <text x="405" y="65" text-anchor="middle" font-size="10" fill="#388e3c">Images load when visible</text>
  <text x="405" y="85" text-anchor="middle" font-size="10" fill="#388e3c">Fast initial page load</text>
</svg>
