<svg viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg">
  <text x="150" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#9c27b0">Flexbox</text>
  <text x="450" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#2196f3">CSS Grid</text>

  <rect x="30" y="50" width="240" height="50" rx="6" fill="#f3e5f5" stroke="#9c27b0"/>
  <text x="150" y="70" text-anchor="middle" font-size="11" fill="#7b1fa2" font-weight="bold">1-Dimensional</text>
  <text x="150" y="90" text-anchor="middle" font-size="10" fill="#9c27b0">Row OR Column</text>

  <rect x="330" y="50" width="240" height="50" rx="6" fill="#e3f2fd" stroke="#2196f3"/>
  <text x="450" y="70" text-anchor="middle" font-size="11" fill="#1565c0" font-weight="bold">2-Dimensional</text>
  <text x="450" y="90" text-anchor="middle" font-size="10" fill="#1976d2">Rows AND Columns</text>

  <rect x="30" y="110" width="240" height="50" rx="6" fill="#f3e5f5" stroke="#9c27b0"/>
  <text x="150" y="130" text-anchor="middle" font-size="10" fill="#7b1fa2">Navigation, Buttons,</text>
  <text x="150" y="148" text-anchor="middle" font-size="10" fill="#7b1fa2">Single-row layouts</text>

  <rect x="330" y="110" width="240" height="50" rx="6" fill="#e3f2fd" stroke="#2196f3"/>
  <text x="450" y="130" text-anchor="middle" font-size="10" fill="#1565c0">Page layouts, Galleries,</text>
  <text x="450" y="148" text-anchor="middle" font-size="10" fill="#1565c0">Complex grids</text>
</svg>
