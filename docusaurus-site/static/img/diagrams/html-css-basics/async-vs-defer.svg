<svg viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg">
  <text x="300" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Script Loading Timeline</text>

  <text x="50" y="55" font-size="10" fill="#666">async:</text>
  <rect x="100" y="40" width="400" height="25" rx="4" fill="#e8f5e9"/>
  <rect x="200" y="45" width="80" height="15" rx="2" fill="#4caf50"/>
  <text x="240" y="56" text-anchor="middle" font-size="8" fill="white">Load</text>
  <rect x="280" y="45" width="40" height="15" rx="2" fill="#2e7d32"/>
  <text x="300" y="56" text-anchor="middle" font-size="7" fill="white">Run</text>
  <text x="520" y="55" font-size="9" fill="#666">Runs immediately</text>

  <text x="50" y="95" font-size="10" fill="#666">defer:</text>
  <rect x="100" y="80" width="400" height="25" rx="4" fill="#e3f2fd"/>
  <rect x="200" y="85" width="80" height="15" rx="2" fill="#2196f3"/>
  <text x="240" y="96" text-anchor="middle" font-size="8" fill="white">Load</text>
  <rect x="460" y="85" width="40" height="15" rx="2" fill="#1565c0"/>
  <text x="480" y="96" text-anchor="middle" font-size="7" fill="white">Run</text>
  <text x="520" y="95" font-size="9" fill="#666">After DOM ready</text>

  <rect x="150" y="120" width="300" height="45" rx="6" fill="#fff3e0" stroke="#ff9800"/>
  <text x="300" y="140" text-anchor="middle" font-size="10" fill="#e65100" font-weight="bold">Use defer for app code (preserves order)</text>
  <text x="300" y="155" text-anchor="middle" font-size="10" fill="#f57c00">Use async for independent scripts (analytics)</text>
</svg>
