<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120">
  <defs>
    <linearGradient id="gitHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f34f29"/>
      <stop offset="50%" stop-color="#3c873a"/>
      <stop offset="100%" stop-color="#2b3137"/>
    </linearGradient>
    <filter id="gitGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="120" rx="16" fill="url(#gitHeaderGrad)"/>
  <text x="400" y="45" text-anchor="middle" fill="white" font-size="28" font-weight="bold" filter="url(#gitGlow)">🔀 Git &amp; GitHub</text>
  <text x="400" y="75" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="16">Version Control • Collaboration • Code Management</text>
  <text x="400" y="100" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="14">20 упражнения • Commits • Branches • Remote Repositories</text>
</svg>
