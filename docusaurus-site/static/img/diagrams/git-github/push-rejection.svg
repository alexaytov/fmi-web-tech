<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 180">
  <rect x="20" y="30" width="280" height="50" rx="8" fill="#74b9ff"/>
  <text x="160" y="60" text-anchor="middle" fill="white" font-size="12" font-weight="bold">💻 Your Local: A → B → C → D</text>

  <rect x="350" y="30" width="280" height="50" rx="8" fill="#2b3137"/>
  <text x="490" y="60" text-anchor="middle" fill="white" font-size="12" font-weight="bold">☁️ Remote: A → B → X → Y</text>

  <line x1="160" y1="85" x2="490" y2="85" stroke="#e17055" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="325" y="110" text-anchor="middle" fill="#e17055" font-size="14" font-weight="bold">❌ git push REJECTED!</text>
  <text x="325" y="130" text-anchor="middle" fill="#636e72" font-size="11">Histories have diverged</text>

  <text x="160" y="160" text-anchor="middle" fill="#0984e3" font-size="10">Вашите нови commits: C, D</text>
  <text x="490" y="160" text-anchor="middle" fill="#636e72" font-size="10">Колегата добави: X, Y</text>
</svg>
