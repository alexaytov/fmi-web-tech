<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 160">
  <defs>
    <marker id="arrowRemote" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#636e72"/>
    </marker>
  </defs>

  <rect x="30" y="50" width="180" height="80" rx="10" fill="#dfe6e9" stroke="#636e72"/>
  <text x="120" y="80" text-anchor="middle" fill="#2d3436" font-size="14" font-weight="bold">💻 Local</text>
  <text x="120" y="100" text-anchor="middle" fill="#636e72" font-size="11">Your Computer</text>

  <rect x="440" y="50" width="180" height="80" rx="10" fill="#2b3137"/>
  <text x="530" y="80" text-anchor="middle" fill="white" font-size="14" font-weight="bold">☁️ Remote</text>
  <text x="530" y="100" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">GitHub</text>

  <line x1="215" y1="70" x2="435" y2="70" stroke="#00b894" stroke-width="3" marker-end="url(#arrowRemote)"/>
  <text x="325" y="60" text-anchor="middle" fill="#00b894" font-size="12" font-weight="bold">git push ↑</text>

  <line x1="435" y1="110" x2="215" y2="110" stroke="#0984e3" stroke-width="3" marker-end="url(#arrowRemote)"/>
  <text x="325" y="140" text-anchor="middle" fill="#0984e3" font-size="12" font-weight="bold">git pull / fetch ↓</text>
</svg>
