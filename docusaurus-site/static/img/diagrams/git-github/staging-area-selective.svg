<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 180">
  <defs>
    <marker id="arrowStaging" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#636e72"/>
    </marker>
  </defs>

  <text x="325" y="25" text-anchor="middle" fill="#636e72" font-size="14" font-weight="bold">Staging Area позволява селективни commits</text>

  <rect x="30" y="45" width="120" height="40" rx="6" fill="#74b9ff"/>
  <text x="90" y="70" text-anchor="middle" fill="white" font-size="11">login.py ✏️</text>

  <rect x="30" y="95" width="120" height="40" rx="6" fill="#81ecec"/>
  <text x="90" y="120" text-anchor="middle" fill="#2d3436" font-size="11">styles.css ✏️</text>

  <rect x="30" y="145" width="120" height="40" rx="6" fill="#fab1a0"/>
  <text x="90" y="170" text-anchor="middle" fill="#2d3436" font-size="11">debug.py ✏️</text>

  <line x1="155" y1="65" x2="250" y2="65" stroke="#4caf50" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="200" y="55" fill="#4caf50" font-size="10">git add</text>

  <line x1="155" y1="115" x2="250" y2="95" stroke="#4caf50" stroke-width="2" stroke-dasharray="5,3"/>

  <rect x="255" y="50" width="140" height="80" rx="8" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="2"/>
  <text x="325" y="75" text-anchor="middle" fill="#2d3436" font-size="12" font-weight="bold">Staging Area</text>
  <text x="325" y="95" text-anchor="middle" fill="#636e72" font-size="10">login.py</text>
  <text x="325" y="110" text-anchor="middle" fill="#636e72" font-size="10">styles.css</text>

  <line x1="400" y1="90" x2="470" y2="90" stroke="#636e72" stroke-width="2" marker-end="url(#arrowStaging)"/>
  <text x="435" y="80" fill="#636e72" font-size="10">commit</text>

  <rect x="475" y="60" width="150" height="60" rx="8" fill="#55efc4"/>
  <text x="550" y="85" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Commit #1</text>
  <text x="550" y="105" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="10">"Add login feature"</text>

  <text x="90" y="200" text-anchor="middle" fill="#e17055" font-size="10">debug.py НЕ влиза!</text>
</svg>
