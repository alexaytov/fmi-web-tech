<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220">
  <defs>
    <marker id="arrowWorkflow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#636e72"/>
    </marker>
  </defs>

  <text x="350" y="20" text-anchor="middle" fill="#636e72" font-size="14" font-weight="bold">Professional Git Workflow</text>

  <circle cx="60" cy="100" r="12" fill="#636e72"/>
  <circle cx="130" cy="100" r="12" fill="#636e72"/>
  <line x1="72" y1="100" x2="115" y2="100" stroke="#636e72" stroke-width="2"/>
  <text x="95" y="130" text-anchor="middle" fill="#636e72" font-size="10">main</text>

  <line x1="130" y1="88" x2="200" y2="50" stroke="#00b894" stroke-width="2"/>
  <circle cx="220" cy="45" r="12" fill="#00b894"/>
  <circle cx="290" cy="45" r="12" fill="#00b894"/>
  <line x1="232" y1="45" x2="275" y2="45" stroke="#00b894" stroke-width="2"/>
  <text x="255" y="30" text-anchor="middle" fill="#00b894" font-size="10">feature/user-profile</text>

  <circle cx="200" cy="100" r="12" fill="#636e72"/>
  <line x1="142" y1="100" x2="185" y2="100" stroke="#636e72" stroke-width="2"/>

  <line x1="290" y1="57" x2="350" y2="100" stroke="#00b894" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="370" cy="100" r="15" fill="#667eea"/>
  <text x="370" y="105" text-anchor="middle" fill="white" font-size="10">M</text>

  <line x1="212" y1="100" x2="352" y2="100" stroke="#636e72" stroke-width="2"/>

  <circle cx="440" cy="100" r="12" fill="#636e72"/>
  <line x1="385" y1="100" x2="425" y2="100" stroke="#636e72" stroke-width="2"/>

  <line x1="455" y1="100" x2="520" y2="100" stroke="#636e72" stroke-width="2" marker-end="url(#arrowWorkflow)"/>
  <text x="487" y="90" text-anchor="middle" fill="#636e72" font-size="10">push</text>

  <rect x="530" y="80" width="100" height="40" rx="8" fill="#2b3137"/>
  <text x="580" y="105" text-anchor="middle" fill="white" font-size="11">Remote</text>

  <rect x="40" y="160" width="620" height="50" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="60" y="180" fill="#333" font-size="10">1. clone → 2. branch → 3. commit → 4. push branch → 5. merge → 6. push main → 7. delete branch</text>
  <text x="350" y="200" text-anchor="middle" fill="#666" font-size="9">Този workflow осигурява code review, backup и чиста история</text>
</svg>
