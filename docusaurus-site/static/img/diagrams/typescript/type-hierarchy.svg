<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <defs>
    <linearGradient id="unknownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9b59b6"/>
      <stop offset="100%" stop-color="#8e44ad"/>
    </linearGradient>
    <linearGradient id="anyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="primitiveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
    <linearGradient id="neverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34495e"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Top level: unknown -->
  <g filter="url(#shadow)">
    <rect x="280" y="20" width="140" height="50" rx="10" fill="url(#unknownGrad)"/>
    <text x="350" y="50" fill="white" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">unknown</text>
  </g>
  <text x="350" y="90" fill="#666" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Top type (most general)</text>

  <!-- Connecting line: unknown to any -->
  <line x1="350" y1="70" x2="350" y2="110" stroke="#666" stroke-width="2" stroke-dasharray="4"/>

  <!-- Second level: any -->
  <g filter="url(#shadow)">
    <rect x="280" y="115" width="140" height="50" rx="10" fill="url(#anyGrad)"/>
    <text x="350" y="145" fill="white" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">any</text>
  </g>
  <text x="510" y="145" fill="#e74c3c" font-family="system-ui, sans-serif" font-size="10" text-anchor="start">&#9888; Avoid using!</text>

  <!-- Connecting line: any to primitives -->
  <line x1="350" y1="165" x2="350" y2="200" stroke="#666" stroke-width="2" stroke-dasharray="4"/>

  <!-- Branching lines to primitives -->
  <line x1="350" y1="200" x2="100" y2="210" stroke="#666" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="350" y1="200" x2="220" y2="210" stroke="#666" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="350" y1="200" x2="340" y2="210" stroke="#666" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="350" y1="200" x2="460" y2="210" stroke="#666" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="350" y1="200" x2="580" y2="210" stroke="#666" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Middle level: primitives -->
  <g filter="url(#shadow)">
    <!-- string -->
    <rect x="50" y="215" width="100" height="45" rx="8" fill="url(#primitiveGrad)"/>
    <text x="100" y="243" fill="white" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">string</text>

    <!-- number -->
    <rect x="170" y="215" width="100" height="45" rx="8" fill="url(#primitiveGrad)"/>
    <text x="220" y="243" fill="white" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">number</text>

    <!-- boolean -->
    <rect x="290" y="215" width="100" height="45" rx="8" fill="url(#primitiveGrad)"/>
    <text x="340" y="243" fill="white" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">boolean</text>

    <!-- object -->
    <rect x="410" y="215" width="100" height="45" rx="8" fill="url(#primitiveGrad)"/>
    <text x="460" y="243" fill="white" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">object</text>

    <!-- null/undefined -->
    <rect x="530" y="215" width="100" height="45" rx="8" fill="url(#primitiveGrad)"/>
    <text x="580" y="238" fill="white" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">null</text>
    <text x="580" y="253" fill="white" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">undefined</text>
  </g>

  <!-- Connecting lines from primitives to never -->
  <line x1="100" y1="260" x2="350" y2="295" stroke="#666" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="220" y1="260" x2="350" y2="295" stroke="#666" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="340" y1="260" x2="350" y2="295" stroke="#666" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="460" y1="260" x2="350" y2="295" stroke="#666" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="580" y1="260" x2="350" y2="295" stroke="#666" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Bottom level: never -->
  <g filter="url(#shadow)">
    <rect x="280" y="300" width="140" height="50" rx="10" fill="url(#neverGrad)"/>
    <text x="350" y="330" fill="white" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">never</text>
  </g>
  <text x="350" y="370" fill="#666" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Bottom type (most specific)</text>
</svg>
