<svg viewBox="0 0 600 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e91e63"/>
      <stop offset="100%" stop-color="#f06292"/>
    </linearGradient>
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#64b5f6"/>
    </linearGradient>
    <linearGradient id="boolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#ba68c8"/>
    </linearGradient>
  </defs>

  <rect x="30" y="30" width="160" height="100" rx="10" fill="url(#stringGrad)"/>
  <text x="110" y="65" text-anchor="middle" font-size="16" fill="white" font-weight="bold">string</text>
  <text x="110" y="90" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">"alice_dev"</text>
  <text x="110" y="115" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">Text values</text>

  <rect x="220" y="30" width="160" height="100" rx="10" fill="url(#numGrad)"/>
  <text x="300" y="65" text-anchor="middle" font-size="16" fill="white" font-weight="bold">number</text>
  <text x="300" y="90" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">25</text>
  <text x="300" y="115" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">Int &amp; Float</text>

  <rect x="410" y="30" width="160" height="100" rx="10" fill="url(#boolGrad)"/>
  <text x="490" y="65" text-anchor="middle" font-size="16" fill="white" font-weight="bold">boolean</text>
  <text x="490" y="90" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">true</text>
  <text x="490" y="115" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">true / false</text>
