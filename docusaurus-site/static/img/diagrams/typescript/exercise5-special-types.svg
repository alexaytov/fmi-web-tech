<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="voidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#607d8b"/>
      <stop offset="100%" stop-color="#90a4ae"/>
    </linearGradient>
    <linearGradient id="anyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f44336"/>
      <stop offset="100%" stop-color="#e57373"/>
    </linearGradient>
    <linearGradient id="unknownGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
    <linearGradient id="nullGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#795548"/>
      <stop offset="100%" stop-color="#a1887f"/>
    </linearGradient>
  </defs>

  <rect x="30" y="30" width="130" height="70" rx="8" fill="url(#voidGrad)"/>
  <text x="95" y="60" text-anchor="middle" font-size="14" fill="white" font-weight="bold">void</text>
  <text x="95" y="85" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">→ C: No return</text>

  <rect x="175" y="30" width="130" height="70" rx="8" fill="url(#anyGrad)"/>
  <text x="240" y="60" text-anchor="middle" font-size="14" fill="white" font-weight="bold">any</text>
  <text x="240" y="85" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">→ D: No checking ⚠️</text>

  <rect x="320" y="30" width="130" height="70" rx="8" fill="url(#unknownGrad)"/>
  <text x="385" y="60" text-anchor="middle" font-size="14" fill="white" font-weight="bold">unknown</text>
  <text x="385" y="85" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">→ A: Safe any</text>

  <rect x="465" y="30" width="110" height="70" rx="8" fill="url(#nullGrad)"/>
  <text x="520" y="60" text-anchor="middle" font-size="14" fill="white" font-weight="bold">null</text>
  <text x="520" y="85" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">→ B: No value</text>

  <rect x="150" y="120" width="300" height="55" rx="8" fill="#fff3e0" stroke="#ff9800"/>
  <text x="300" y="145" text-anchor="middle" font-size="11" fill="#e65100" font-weight="bold">💡 Prefer unknown over any</text>
  <text x="300" y="163" text-anchor="middle" font-size="10" fill="#f57c00">unknown is type-safe, any is not!</text>
</svg>
