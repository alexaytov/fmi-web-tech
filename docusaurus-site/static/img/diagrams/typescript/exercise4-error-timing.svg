<svg viewBox="0 0 650 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jsTimeline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7df1e"/>
      <stop offset="80%" stop-color="#f7df1e"/>
      <stop offset="100%" stop-color="#f44336"/>
    </linearGradient>
    <linearGradient id="tsTimeline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178c6"/>
      <stop offset="30%" stop-color="#f44336"/>
      <stop offset="35%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#4caf50"/>
    </linearGradient>
  </defs>

  <text x="325" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">When Errors Are Caught</text>

  <text x="50" y="60" font-size="12" fill="#323330" font-weight="bold">JavaScript:</text>
  <rect x="130" y="50" width="480" height="25" rx="4" fill="url(#jsTimeline)"/>
  <text x="200" y="67" font-size="9" fill="#323330">Write</text>
  <text x="350" y="67" font-size="9" fill="#323330">Deploy</text>
  <text x="500" y="67" font-size="9" fill="white">💥 ERROR in Production!</text>

  <text x="50" y="120" font-size="12" fill="#3178c6" font-weight="bold">TypeScript:</text>
  <rect x="130" y="110" width="480" height="25" rx="4" fill="url(#tsTimeline)"/>
  <text x="180" y="127" font-size="9" fill="white">Write</text>
  <text x="270" y="127" font-size="9" fill="white">❌ Error</text>
  <text x="350" y="127" font-size="9" fill="white">Fix</text>
  <text x="450" y="127" font-size="9" fill="white">Deploy</text>
  <text x="550" y="127" font-size="9" fill="white">✅ Safe</text>

  <rect x="180" y="150" width="300" height="35" rx="6" fill="#e8f5e9" stroke="#4caf50"/>
  <text x="330" y="172" text-anchor="middle" font-size="11" fill="#2e7d32" font-weight="bold">TypeScript: Errors caught BEFORE deployment!</text>
</svg>
