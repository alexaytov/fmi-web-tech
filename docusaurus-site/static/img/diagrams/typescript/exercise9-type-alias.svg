<svg viewBox="0 0 500 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#6d4c41"/>
    </linearGradient>
  </defs>

  <rect x="100" y="20" width="300" height="110" rx="10" fill="url(#bookGrad)"/>
  <text x="250" y="50" text-anchor="middle" font-size="14" fill="white" font-weight="bold">type Book</text>

  <rect x="120" y="65" width="120" height="25" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="180" y="82" text-anchor="middle" font-size="10" fill="white">title: string</text>

  <rect x="260" y="65" width="120" height="25" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="320" y="82" text-anchor="middle" font-size="10" fill="white">author: string</text>

  <rect x="120" y="95" width="120" height="25" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="180" y="112" text-anchor="middle" font-size="10" fill="white">pages: number</text>

  <rect x="260" y="95" width="120" height="25" rx="4" fill="rgba(255,255,255,0.15)" stroke-dasharray="4,2" stroke="white"/>
  <text x="320" y="112" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">isbn?: string</text>
</svg>
