<svg viewBox="0 0 550 120" xmlns="http://www.w3.org/2000/svg">
  <text x="275" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Two Array Type Syntaxes</text>

  <rect x="30" y="45" width="230" height="55" rx="8" fill="#e3f2fd" stroke="#2196f3"/>
  <text x="145" y="70" text-anchor="middle" font-size="12" fill="#1565c0" font-family="monospace">string[]</text>
  <text x="145" y="90" text-anchor="middle" font-size="10" fill="#1976d2">Most common syntax</text>

  <rect x="290" y="45" width="230" height="55" rx="8" fill="#e8eaf6" stroke="#673ab7"/>
  <text x="405" y="70" text-anchor="middle" font-size="12" fill="#512da8" font-family="monospace">Array&lt;string&gt;</text>
  <text x="405" y="90" text-anchor="middle" font-size="10" fill="#5e35b1">Generic syntax</text>
</svg>
