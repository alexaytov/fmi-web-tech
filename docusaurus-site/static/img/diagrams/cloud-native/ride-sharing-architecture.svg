<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250">
  <text x="350" y="20" text-anchor="middle" fill="#636e72" font-size="12" font-weight="bold">Ride-Sharing Microservices Architecture</text>

  <rect x="280" y="35" width="140" height="35" rx="6" fill="#74b9ff"/>
  <text x="350" y="58" text-anchor="middle" fill="white" font-size="11" font-weight="bold">API Gateway</text>

  <line x1="350" y1="70" x2="350" y2="90" stroke="#636e72" stroke-width="2"/>

  <rect x="50" y="95" width="90" height="50" rx="6" fill="#00b894"/>
  <text x="95" y="115" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Auth</text>
  <text x="95" y="130" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="8">Service</text>

  <rect x="155" y="95" width="90" height="50" rx="6" fill="#e17055"/>
  <text x="200" y="115" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Location</text>
  <text x="200" y="130" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="8">Service</text>

  <rect x="260" y="95" width="90" height="50" rx="6" fill="#6c5ce7"/>
  <text x="305" y="115" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Matching</text>
  <text x="305" y="130" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="8">Service</text>

  <rect x="365" y="95" width="90" height="50" rx="6" fill="#fdcb6e"/>
  <text x="410" y="115" text-anchor="middle" fill="#2d3436" font-size="9" font-weight="bold">Payment</text>
  <text x="410" y="130" text-anchor="middle" fill="rgba(0,0,0,0.6)" font-size="8">Service</text>

  <rect x="470" y="95" width="90" height="50" rx="6" fill="#81ecec"/>
  <text x="515" y="115" text-anchor="middle" fill="#2d3436" font-size="9" font-weight="bold">Trip</text>
  <text x="515" y="130" text-anchor="middle" fill="rgba(0,0,0,0.6)" font-size="8">Service</text>

  <rect x="575" y="95" width="90" height="50" rx="6" fill="#a29bfe"/>
  <text x="620" y="115" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Notification</text>
  <text x="620" y="130" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="8">Service</text>

  <rect x="150" y="180" width="180" height="35" rx="6" fill="#dfe6e9" stroke="#b2bec3"/>
  <text x="240" y="202" text-anchor="middle" fill="#636e72" font-size="10">Message Queue (Kafka)</text>

  <rect x="370" y="180" width="180" height="35" rx="6" fill="#dfe6e9" stroke="#b2bec3"/>
  <text x="460" y="202" text-anchor="middle" fill="#636e72" font-size="10">Database(s)</text>

  <text x="200" y="240" text-anchor="middle" fill="#e17055" font-size="9">🔥 High-frequency scaling needed</text>
  <text x="515" y="240" text-anchor="middle" fill="#636e72" font-size="9">Async communication</text>
</svg>
