<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 140">
  <rect x="20" y="20" width="190" height="100" rx="10" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
