<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220">
  <text x="300" y="20" text-anchor="middle" fill="#636e72" font-size="12" font-weight="bold">Docker Image Layers</text>

  <rect x="100" y="35" width="400" height="25" rx="4" fill="#74b9ff"/>
  <text x="300" y="52" text-anchor="middle" fill="white" font-size="10">Layer 1: FROM python:3.9-slim (Base Image)</text>

  <rect x="100" y="65" width="400" height="25" rx="4" fill="#81ecec"/>
  <text x="300" y="82" text-anchor="middle" fill="#2d3436" font-size="10">Layer 2: WORKDIR /app</text>

  <rect x="100" y="95" width="400" height="25" rx="4" fill="#ffeaa7"/>
  <text x="300" y="112" text-anchor="middle" fill="#2d3436" font-size="10">Layer 3: COPY requirements.txt (Changes rarely)</text>

  <rect x="100" y="125" width="400" height="25" rx="4" fill="#fdcb6e"/>
  <text x="300" y="142" text-anchor="middle" fill="#2d3436" font-size="10">Layer 4: RUN pip install (Cached if req unchanged)</text>

  <rect x="100" y="155" width="400" height="25" rx="4" fill="#fab1a0"/>
  <text x="300" y="172" text-anchor="middle" fill="#2d3436" font-size="10">Layer 5: COPY . . (Changes often)</text>

  <rect x="100" y="185" width="400" height="25" rx="4" fill="#ff7675"/>
  <text x="300" y="202" text-anchor="middle" fill="white" font-size="10">Layer 6: EXPOSE + CMD (Runtime config)</text>

  <text x="530" y="110" fill="#00b894" font-size="9">← Cached</text>
  <text x="530" y="172" fill="#e17055" font-size="9">← Rebuilt</text>
</svg>
