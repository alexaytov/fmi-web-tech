<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180">
  <text x="350" y="25" text-anchor="middle" fill="#636e72" font-size="12" font-weight="bold">Cloud Migration Journey</text>

  <rect x="30" y="50" width="180" height="100" rx="10" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="2"/>
  <text x="120" y="80" text-anchor="middle" fill="#424242" font-size="12" font-weight="bold">🏢 On-Premises</text>
  <text x="120" y="100" text-anchor="middle" fill="#666" font-size="10">Traditional</text>
  <text x="120" y="115" text-anchor="middle" fill="#666" font-size="10">Monolith</text>
  <text x="120" y="140" text-anchor="middle" fill="#9e9e9e" font-size="9">Physical servers</text>

  <path d="M 215 100 L 265 100" stroke="#ff9800" stroke-width="3"/>
  <text x="240" y="90" text-anchor="middle" fill="#ff9800" font-size="9">Lift &amp; Shift</text>

  <rect x="270" y="50" width="180" height="100" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="360" y="80" text-anchor="middle" fill="#e65100" font-size="12" font-weight="bold">☁️ Cloud-Enabled</text>
  <text x="360" y="100" text-anchor="middle" fill="#666" font-size="10">Same app,</text>
  <text x="360" y="115" text-anchor="middle" fill="#666" font-size="10">different location</text>
  <text x="360" y="140" text-anchor="middle" fill="#ff9800" font-size="9">EC2 instances</text>

  <path d="M 455 100 L 505 100" stroke="#4caf50" stroke-width="3"/>
  <text x="480" y="90" text-anchor="middle" fill="#4caf50" font-size="9">Transform</text>

  <rect x="510" y="50" width="180" height="100" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="600" y="80" text-anchor="middle" fill="#2e7d32" font-size="12" font-weight="bold">🚀 Cloud-Native</text>
  <text x="600" y="100" text-anchor="middle" fill="#666" font-size="10">Microservices,</text>
  <text x="600" y="115" text-anchor="middle" fill="#666" font-size="10">Containers, K8s</text>
  <text x="600" y="140" text-anchor="middle" fill="#4caf50" font-size="9">Auto-scaling, IaC</text>

  <text x="360" y="170" text-anchor="middle" fill="#e65100" font-size="10">⚠️ CTO's claim: HERE (but not cloud-native!)</text>
</svg>
