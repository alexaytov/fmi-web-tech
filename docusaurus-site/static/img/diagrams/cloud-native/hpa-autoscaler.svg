<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 150">
  <text x="325" y="20" text-anchor="middle" fill="#636e72" font-size="12" font-weight="bold">HorizontalPodAutoscaler in Action</text>

  <rect x="30" y="40" width="100" height="90" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="80" y="60" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="bold">Low Traffic</text>
  <rect x="45" y="75" width="30" height="20" rx="3" fill="#81c784"/>
  <rect x="85" y="75" width="30" height="20" rx="3" fill="#81c784"/>
  <text x="80" y="115" text-anchor="middle" fill="#666" font-size="9">min: 2 pods</text>

  <path d="M 140 85 L 200 85" stroke="#636e72" stroke-width="2"/>
  <text x="170" y="75" text-anchor="middle" fill="#636e72" font-size="9">CPU &gt; 70%</text>

  <rect x="210" y="40" width="140" height="90" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="280" y="60" text-anchor="middle" fill="#e65100" font-size="10" font-weight="bold">Scaling Up</text>
  <rect x="225" y="75" width="25" height="18" rx="3" fill="#ffcc80"/>
  <rect x="255" y="75" width="25" height="18" rx="3" fill="#ffcc80"/>
  <rect x="285" y="75" width="25" height="18" rx="3" fill="#a5d6a7"/>
  <rect x="315" y="75" width="25" height="18" rx="3" fill="#a5d6a7"/>
  <text x="280" y="115" text-anchor="middle" fill="#666" font-size="9">4 pods</text>

  <path d="M 360 85 L 420 85" stroke="#636e72" stroke-width="2"/>
  <text x="390" y="75" text-anchor="middle" fill="#636e72" font-size="9">Traffic spike</text>

  <rect x="430" y="40" width="200" height="90" rx="8" fill="#ffebee" stroke="#e57373" stroke-width="2"/>
  <text x="530" y="60" text-anchor="middle" fill="#c62828" font-size="10" font-weight="bold">Max Capacity</text>
  <g transform="translate(445, 75)">
    <rect x="0" y="0" width="18" height="15" rx="2" fill="#ef9a9a"/>
    <rect x="22" y="0" width="18" height="15" rx="2" fill="#ef9a9a"/>
    <rect x="44" y="0" width="18" height="15" rx="2" fill="#ef9a9a"/>
    <rect x="66" y="0" width="18" height="15" rx="2" fill="#ef9a9a"/>
    <rect x="88" y="0" width="18" height="15" rx="2" fill="#ef9a9a"/>
    <rect x="0" y="18" width="18" height="15" rx="2" fill="#ef9a9a"/>
    <rect x="22" y="18" width="18" height="15" rx="2" fill="#ef9a9a"/>
    <rect x="44" y="18" width="18" height="15" rx="2" fill="#ef9a9a"/>
    <rect x="66" y="18" width="18" height="15" rx="2" fill="#ef9a9a"/>
    <rect x="88" y="18" width="18" height="15" rx="2" fill="#ef9a9a"/>
  </g>
  <text x="530" y="115" text-anchor="middle" fill="#666" font-size="9">max: 10 pods</text>
</svg>
