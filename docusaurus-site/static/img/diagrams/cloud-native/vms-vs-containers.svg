<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180">
  <rect x="30" y="20" width="250" height="140" rx="10" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="155" y="45" text-anchor="middle" fill="#1565c0" font-size="13" font-weight="bold">Virtual Machines</text>

  <rect x="50" y="60" width="90" height="40" rx="5" fill="#bbdefb"/>
  <text x="95" y="75" text-anchor="middle" fill="#333" font-size="8">App A</text>
  <text x="95" y="90" text-anchor="middle" fill="#666" font-size="7">Guest OS</text>

  <rect x="150" y="60" width="90" height="40" rx="5" fill="#bbdefb"/>
  <text x="195" y="75" text-anchor="middle" fill="#333" font-size="8">App B</text>
  <text x="195" y="90" text-anchor="middle" fill="#666" font-size="7">Guest OS</text>

  <rect x="50" y="110" width="190" height="25" rx="5" fill="#90caf9"/>
  <text x="145" y="127" text-anchor="middle" fill="#333" font-size="9">Hypervisor</text>

  <rect x="50" y="140" width="190" height="15" rx="3" fill="#64b5f6"/>
  <text x="145" y="151" text-anchor="middle" fill="white" font-size="8">Host OS</text>

  <rect x="320" y="20" width="250" height="140" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="445" y="45" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="bold">Containers</text>

  <rect x="340" y="60" width="70" height="50" rx="5" fill="#c8e6c9"/>
  <text x="375" y="80" text-anchor="middle" fill="#333" font-size="8">App A</text>
  <text x="375" y="95" text-anchor="middle" fill="#666" font-size="7">Libs</text>

  <rect x="420" y="60" width="70" height="50" rx="5" fill="#c8e6c9"/>
  <text x="455" y="80" text-anchor="middle" fill="#333" font-size="8">App B</text>
  <text x="455" y="95" text-anchor="middle" fill="#666" font-size="7">Libs</text>

  <rect x="500" y="60" width="50" height="50" rx="5" fill="#c8e6c9"/>
  <text x="525" y="85" text-anchor="middle" fill="#333" font-size="8">...</text>

  <rect x="340" y="115" width="210" height="20" rx="5" fill="#81c784"/>
  <text x="445" y="129" text-anchor="middle" fill="white" font-size="9">Container Engine (Docker)</text>

  <rect x="340" y="140" width="210" height="15" rx="3" fill="#66bb6a"/>
  <text x="445" y="151" text-anchor="middle" fill="white" font-size="8">Shared Host OS Kernel</text>

  <text x="155" y="175" text-anchor="middle" fill="#e57373" font-size="10">GBs, Minutes</text>
  <text x="445" y="175" text-anchor="middle" fill="#66bb6a" font-size="10">MBs, Seconds</text>
</svg>
