<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160">
  <rect x="20" y="20" width="260" height="120" rx="10" fill="#ffebee" stroke="#e57373" stroke-width="2"/>
  <text x="150" y="45" text-anchor="middle" fill="#c62828" font-size="12" font-weight="bold">❌ Imperative</text>
  <text x="150" y="65" text-anchor="middle" fill="#333" font-size="10">"SSH → Edit → Restart"</text>
  <text x="40" y="85" fill="#666" font-size="9">• Human error prone</text>
  <text x="40" y="100" fill="#666" font-size="9">• No audit trail</text>
  <text x="40" y="115" fill="#666" font-size="9">• Configuration drift</text>
  <text x="40" y="130" fill="#666" font-size="9">• Manual repetition</text>

  <rect x="320" y="20" width="260" height="120" rx="10" fill="#e8f5e9" stroke="#81c784" stroke-width="2"/>
  <text x="450" y="45" text-anchor="middle" fill="#2e7d32" font-size="12" font-weight="bold">✅ Declarative</text>
  <text x="450" y="65" text-anchor="middle" fill="#333" font-size="10">"kubectl apply -f config.yaml"</text>
  <text x="340" y="85" fill="#666" font-size="9">• Reproducible</text>
  <text x="340" y="100" fill="#666" font-size="9">• Git history = audit</text>
  <text x="340" y="115" fill="#666" font-size="9">• Consistent state</text>
  <text x="340" y="130" fill="#666" font-size="9">• Single command</text>
</svg>
