<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300">
  <defs>
    <linearGradient id="k8sBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#326ce5"/>
      <stop offset="100%" stop-color="#2956b8"/>
    </linearGradient>
    <linearGradient id="k8sGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#1e8449"/>
    </linearGradient>
    <linearGradient id="k8sPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9b59b6"/>
      <stop offset="100%" stop-color="#8e44ad"/>
    </linearGradient>
    <filter id="k8sShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <style>
    .k8s-frame { opacity: 0; animation: k8sFadeIn 0.5s ease-out 0.1s forwards; }
    .k8s-title { opacity: 0; animation: k8sFadeIn 0.4s ease-out 0.2s forwards; }
    .k8s-control { opacity: 0; transform: translateY(-10px); animation: k8sSlideIn 0.4s ease-out 0.3s forwards; }
    .k8s-workers { opacity: 0; transform: translateY(10px); animation: k8sSlideIn 0.4s ease-out 0.5s forwards; }
    .k8s-comp { opacity: 0; transform: scale(0.8); }
    .k8s-api { animation: k8sPopIn 0.3s ease-out 0.5s forwards; }
    .k8s-sched { animation: k8sPopIn 0.3s ease-out 0.6s forwards; }
    .k8s-etcd { animation: k8sPopIn 0.3s ease-out 0.7s forwards; }
    .k8s-node { opacity: 0; transform: scale(0.9); }
    .k8s-node1 { animation: k8sNodeIn 0.4s ease-out 0.7s forwards; }
    .k8s-node2 { animation: k8sNodeIn 0.4s ease-out 0.85s forwards; }
    .k8s-pod { opacity: 0; transform: scale(0); }
    .k8s-pod1 { animation: k8sPodPop 0.25s ease-out 0.9s forwards; }
    .k8s-pod2 { animation: k8sPodPop 0.25s ease-out 1.0s forwards; }
    .k8s-pod3 { animation: k8sPodPop 0.25s ease-out 1.1s forwards; }
    .k8s-pod4 { animation: k8sPodPop 0.25s ease-out 1.2s forwards; }
    @keyframes k8sFadeIn { to { opacity: 1; } }
    @keyframes k8sSlideIn { to { opacity: 1; transform: translateY(0); } }
    @keyframes k8sPopIn { to { opacity: 1; transform: scale(1); } }
    @keyframes k8sNodeIn { to { opacity: 1; transform: scale(1); } }
    @keyframes k8sPodPop { 0% { opacity: 0; transform: scale(0); } 70% { transform: scale(1.15); } 100% { opacity: 1; transform: scale(1); } }
  </style>
  <rect class="k8s-frame" x="30" y="15" width="560" height="270" rx="10" fill="#f8f9fa" stroke="url(#k8sBlue)" stroke-width="3"/>
  <text class="k8s-title" x="310" y="42" fill="#326ce5" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">☸️ KUBERNETES CLUSTER</text>
  <g class="k8s-control">
    <rect x="50" y="55" width="520" height="65" rx="6" fill="#e8f4fd" stroke="#326ce5" stroke-width="1.5"/>
    <text x="310" y="75" fill="#326ce5" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CONTROL PLANE</text>
  </g>
  <g class="k8s-comp k8s-api" filter="url(#k8sShadow)">
    <rect x="70" y="85" width="90" height="26" rx="4" fill="url(#k8sBlue)"/>
    <text x="115" y="103" fill="white" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">API Server</text>
  </g>
  <g class="k8s-comp k8s-sched" filter="url(#k8sShadow)">
    <rect x="175" y="85" width="90" height="26" rx="4" fill="url(#k8sBlue)"/>
    <text x="220" y="103" fill="white" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Scheduler</text>
  </g>
  <g class="k8s-comp k8s-etcd" filter="url(#k8sShadow)">
    <rect x="280" y="85" width="90" height="26" rx="4" fill="url(#k8sPurple)"/>
    <text x="325" y="103" fill="white" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">etcd</text>
  </g>
  <g class="k8s-workers">
    <rect x="50" y="130" width="520" height="140" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/>
    <text x="310" y="150" fill="#27ae60" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">WORKER NODES</text>
  </g>
  <g class="k8s-node k8s-node1" filter="url(#k8sShadow)">
    <rect x="70" y="160" width="180" height="90" rx="5" fill="white" stroke="#27ae60" stroke-width="1.5"/>
    <text x="160" y="178" fill="#27ae60" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Node 1</text>
  </g>
  <g class="k8s-node k8s-node2" filter="url(#k8sShadow)">
    <rect x="270" y="160" width="180" height="90" rx="5" fill="white" stroke="#27ae60" stroke-width="1.5"/>
    <text x="360" y="178" fill="#27ae60" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Node 2</text>
  </g>
  <rect class="k8s-pod k8s-pod1" x="85" y="190" width="50" height="45" rx="4" fill="url(#k8sGreen)" filter="url(#k8sShadow)"/>
  <text class="k8s-pod k8s-pod1" x="110" y="218" fill="white" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Pod</text>
  <rect class="k8s-pod k8s-pod2" x="145" y="190" width="50" height="45" rx="4" fill="url(#k8sGreen)" filter="url(#k8sShadow)"/>
  <text class="k8s-pod k8s-pod2" x="170" y="218" fill="white" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Pod</text>
  <rect class="k8s-pod k8s-pod3" x="285" y="190" width="50" height="45" rx="4" fill="url(#k8sGreen)" filter="url(#k8sShadow)"/>
  <text class="k8s-pod k8s-pod3" x="310" y="218" fill="white" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Pod</text>
  <rect class="k8s-pod k8s-pod4" x="345" y="190" width="50" height="45" rx="4" fill="url(#k8sGreen)" filter="url(#k8sShadow)"/>
  <text class="k8s-pod k8s-pod4" x="370" y="218" fill="white" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Pod</text>
  <text class="k8s-node k8s-node2" x="490" y="215" fill="#27ae60" font-family="system-ui, sans-serif" font-size="16" font-weight="600">...</text>
</svg>
