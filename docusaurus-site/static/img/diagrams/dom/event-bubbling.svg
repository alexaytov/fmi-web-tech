<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380">
  <defs>
    <linearGradient id="bubbleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="targetGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="eventShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <marker id="bubbleArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Document layer (outermost) -->
  <rect x="50" y="30" width="500" height="280" rx="15" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="70" y="55" fill="#64748b" font-family="monospace" font-size="13" font-weight="600">document</text>

  <!-- Body layer -->
  <rect x="80" y="70" width="440" height="210" rx="12" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="95" fill="#3b82f6" font-family="monospace" font-size="13" font-weight="600">&lt;body&gt;</text>

  <!-- Div layer -->
  <rect x="110" y="110" width="380" height="140" rx="10" fill="none" stroke="#10b981" stroke-width="2"/>
  <text x="130" y="135" fill="#10b981" font-family="monospace" font-size="13" font-weight="600">&lt;div&gt;</text>

  <!-- Button (target) -->
  <g filter="url(#eventShadow)">
    <rect x="220" y="160" width="160" height="60" rx="8" fill="url(#targetGradient)"/>
    <text x="300" y="198" fill="white" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">&lt;button&gt;</text>
    <text x="300" y="212" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">TARGET</text>
  </g>

  <!-- Bubbling arrows going UP (on the right side) -->
  <g>
    <!-- Arrow from button to div -->
    <line x1="400" y1="190" x2="400" y2="145" stroke="url(#bubbleGradient)" stroke-width="3" marker-end="url(#bubbleArrow)"/>

    <!-- Arrow from div to body -->
    <line x1="430" y1="135" x2="430" y2="100" stroke="url(#bubbleGradient)" stroke-width="3" marker-end="url(#bubbleArrow)"/>

    <!-- Arrow from body to document -->
    <line x1="460" y1="85" x2="460" y2="55" stroke="url(#bubbleGradient)" stroke-width="3" marker-end="url(#bubbleArrow)"/>
  </g>

  <!-- Bubbling label -->
  <g>
    <rect x="475" y="100" width="100" height="35" rx="6" fill="url(#bubbleGradient)"/>
    <text x="525" y="123" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">bubbles</text>
  </g>

  <!-- Up arrow indicator -->
  <text x="525" y="150" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" font-weight="bold">^</text>

  <!-- Event flow description -->
  <text x="300" y="340" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Event bubbling: events propagate UP from target to ancestors</text>
  <text x="300" y="360" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">button -> div -> body -> document</text>
</svg>
