<svg viewBox="0 0 650 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="10" width="310" height="180" rx="10" fill="#ffebee" stroke="#f44336" stroke-width="2"/>
  <text x="165" y="35" text-anchor="middle" fill="#c62828" font-size="13" font-weight="bold">Wrong code</text>
  <text x="30" y="60" fill="#333" font-size="10" font-family="monospace">addEventlistener</text>
  <text x="200" y="60" fill="#f44336" font-size="10">-&gt; L should be uppercase</text>
  <text x="30" y="85" fill="#333" font-size="10" font-family="monospace">'onclick'</text>
  <text x="200" y="85" fill="#f44336" font-size="10">-&gt; without "on" prefix</text>
  <text x="30" y="110" fill="#333" font-size="10" font-family="monospace">innerhtml</text>
  <text x="200" y="110" fill="#f44336" font-size="10">-&gt; innerHTML (camelCase)</text>
  <text x="30" y="135" fill="#333" font-size="10" font-family="monospace">};</text>
  <text x="200" y="135" fill="#f44336" font-size="10">-&gt; missing )</text>

  <rect x="330" y="10" width="310" height="180" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="485" y="35" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="bold">Correct code</text>
  <text x="350" y="60" fill="#333" font-size="10" font-family="monospace">addEventListener</text>
  <text x="350" y="85" fill="#333" font-size="10" font-family="monospace">'click'</text>
  <text x="350" y="110" fill="#333" font-size="10" font-family="monospace">innerHTML</text>
  <text x="350" y="135" fill="#333" font-size="10" font-family="monospace">});</text>
</svg>
