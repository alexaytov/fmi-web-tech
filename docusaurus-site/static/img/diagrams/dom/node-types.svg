<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">
  <defs>
    <linearGradient id="elemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="attrGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="commentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <filter id="nodeTypeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Element Node (Blue) -->
  <g filter="url(#nodeTypeShadow)">
    <rect x="30" y="40" width="140" height="200" rx="12" fill="url(#elemGrad)"/>
    <!-- Icon circle -->
    <circle cx="100" cy="75" r="20" fill="rgba(255,255,255,0.2)"/>
    <text x="100" y="82" fill="white" font-size="18" text-anchor="middle">&lt;/&gt;</text>
    <text x="100" y="115" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Element Node</text>
    <text x="100" y="140" fill="rgba(255,255,255,0.9)" font-family="monospace" font-size="11" text-anchor="middle">&lt;div&gt;, &lt;p&gt;</text>
    <text x="100" y="158" fill="rgba(255,255,255,0.9)" font-family="monospace" font-size="11" text-anchor="middle">&lt;button&gt;</text>
    <line x1="50" y1="175" x2="150" y2="175" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="100" y="198" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">HTML tags</text>
    <text x="100" y="215" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Most common type</text>
  </g>

  <!-- Text Node (Green) -->
  <g filter="url(#nodeTypeShadow)">
    <rect x="200" y="40" width="140" height="200" rx="12" fill="url(#textGrad)"/>
    <!-- Icon circle -->
    <circle cx="270" cy="75" r="20" fill="rgba(255,255,255,0.2)"/>
    <text x="270" y="82" fill="white" font-size="16" text-anchor="middle">Aa</text>
    <text x="270" y="115" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Text Node</text>
    <text x="270" y="140" fill="rgba(255,255,255,0.9)" font-family="monospace" font-size="11" text-anchor="middle">"Hello World"</text>
    <text x="270" y="158" fill="rgba(255,255,255,0.9)" font-family="monospace" font-size="11" text-anchor="middle">"Click me"</text>
    <line x1="220" y1="175" x2="320" y2="175" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="270" y="198" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Text content</text>
    <text x="270" y="215" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">inside elements</text>
  </g>

  <!-- Attribute Node (Orange) -->
  <g filter="url(#nodeTypeShadow)">
    <rect x="370" y="40" width="140" height="200" rx="12" fill="url(#attrGrad)"/>
    <!-- Icon circle -->
    <circle cx="440" cy="75" r="20" fill="rgba(255,255,255,0.2)"/>
    <text x="440" y="82" fill="white" font-size="14" text-anchor="middle">attr</text>
    <text x="440" y="115" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Attribute Node</text>
    <text x="440" y="140" fill="rgba(255,255,255,0.9)" font-family="monospace" font-size="11" text-anchor="middle">id="main"</text>
    <text x="440" y="158" fill="rgba(255,255,255,0.9)" font-family="monospace" font-size="11" text-anchor="middle">class="btn"</text>
    <line x1="390" y1="175" x2="490" y2="175" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="440" y="198" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Element properties</text>
    <text x="440" y="215" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">and metadata</text>
  </g>

  <!-- Comment Node (Gray) -->
  <g filter="url(#nodeTypeShadow)">
    <rect x="540" y="40" width="140" height="200" rx="12" fill="url(#commentGrad)"/>
    <!-- Icon circle -->
    <circle cx="610" cy="75" r="20" fill="rgba(255,255,255,0.2)"/>
    <text x="610" y="82" fill="white" font-size="14" text-anchor="middle">/**/</text>
    <text x="610" y="115" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Comment Node</text>
    <text x="610" y="140" fill="rgba(255,255,255,0.9)" font-family="monospace" font-size="9" text-anchor="middle">&lt;!-- TODO --&gt;</text>
    <text x="610" y="158" fill="rgba(255,255,255,0.9)" font-family="monospace" font-size="9" text-anchor="middle">&lt;!-- Note --&gt;</text>
    <line x1="560" y1="175" x2="660" y2="175" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="610" y="198" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">HTML comments</text>
    <text x="610" y="215" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Hidden from view</text>
  </g>

  <!-- Description -->
  <text x="350" y="275" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Four main types of nodes in the Document Object Model</text>
</svg>
