<svg viewBox="0 0 600 140" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="10" width="280" height="120" rx="10" fill="#ffebee" stroke="#f44336" stroke-width="2"/>
  <text x="150" y="35" text-anchor="middle" fill="#c62828" font-size="13" font-weight="bold">onclick="..."</text>
  <text x="150" y="60" text-anchor="middle" fill="#666" font-size="10">Only ONE handler</text>
  <text x="150" y="80" text-anchor="middle" fill="#666" font-size="10">Mixes HTML and JS</text>
  <text x="150" y="100" text-anchor="middle" fill="#666" font-size="10">Hard to maintain</text>

  <rect x="310" y="10" width="280" height="120" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="450" y="35" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="bold">addEventListener</text>
  <text x="450" y="60" text-anchor="middle" fill="#666" font-size="10">Multiple handlers</text>
  <text x="450" y="80" text-anchor="middle" fill="#666" font-size="10">Separation of concerns</text>
  <text x="450" y="100" text-anchor="middle" fill="#666" font-size="10">Better control</text>
</svg>
