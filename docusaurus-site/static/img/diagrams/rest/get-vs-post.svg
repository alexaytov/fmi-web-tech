<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">
  <defs>
    <linearGradient id="getGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
    <linearGradient id="postGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="350" y="30" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">GET vs POST Comparison</text>

  <!-- GET Card -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="50" width="300" height="250" rx="12" fill="white" stroke="#3498db" stroke-width="2"/>
    <rect x="30" y="50" width="300" height="50" rx="12" fill="url(#getGrad)"/>
    <rect x="30" y="88" width="300" height="12" fill="url(#getGrad)"/>
    <text x="180" y="82" fill="white" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">📖 GET</text>

    <!-- GET Properties -->
    <text x="50" y="130" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Цел:</text>
    <text x="130" y="130" fill="#666" font-family="system-ui, sans-serif" font-size="12">Извличане на данни</text>

    <text x="50" y="155" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Идемпотентен:</text>
    <text x="155" y="155" fill="#27ae60" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Да</text>

    <text x="50" y="180" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Данни:</text>
    <text x="130" y="180" fill="#666" font-family="system-ui, sans-serif" font-size="12">В URL (query params)</text>

    <text x="50" y="205" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Кеширане:</text>
    <text x="130" y="205" fill="#27ae60" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Да</text>

    <text x="50" y="230" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Body:</text>
    <text x="130" y="230" fill="#e74c3c" font-family="system-ui, sans-serif" font-size="12">✗ Няма</text>

    <!-- Example -->
    <rect x="50" y="250" width="260" height="35" rx="4" fill="#ecf0f1"/>
    <text x="180" y="272" fill="#2980b9" font-family="monospace" font-size="10" text-anchor="middle">GET /api/users?role=admin</text>
  </g>

  <!-- POST Card -->
  <g filter="url(#cardShadow)">
    <rect x="370" y="50" width="300" height="250" rx="12" fill="white" stroke="#e67e22" stroke-width="2"/>
    <rect x="370" y="50" width="300" height="50" rx="12" fill="url(#postGrad)"/>
    <rect x="370" y="88" width="300" height="12" fill="url(#postGrad)"/>
    <text x="520" y="82" fill="white" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">➕ POST</text>

    <!-- POST Properties -->
    <text x="390" y="130" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Цел:</text>
    <text x="470" y="130" fill="#666" font-family="system-ui, sans-serif" font-size="12">Създаване на ресурси</text>

    <text x="390" y="155" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Идемпотентен:</text>
    <text x="495" y="155" fill="#e74c3c" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✗ Не</text>

    <text x="390" y="180" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Данни:</text>
    <text x="470" y="180" fill="#666" font-family="system-ui, sans-serif" font-size="12">В request body</text>

    <text x="390" y="205" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Кеширане:</text>
    <text x="470" y="205" fill="#e74c3c" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✗ Не</text>

    <text x="390" y="230" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Body:</text>
    <text x="470" y="230" fill="#27ae60" font-family="system-ui, sans-serif" font-size="12">✓ JSON данни</text>

    <!-- Example -->
    <rect x="390" y="250" width="260" height="35" rx="4" fill="#ecf0f1"/>
    <text x="520" y="272" fill="#d35400" font-family="monospace" font-size="10" text-anchor="middle">POST /api/users {"name":"..."}</text>
  </g>
</svg>
