<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 320">
  <defs>
    <linearGradient id="jsonHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9b59b6"/>
      <stop offset="100%" stop-color="#8e44ad"/>
    </linearGradient>
    <filter id="jsonShadow" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="325" y="30" fill="#2c3e50" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">JSON Structure</text>

  <!-- JSON Code Block -->
  <g filter="url(#jsonShadow)">
    <rect x="50" y="50" width="550" height="240" rx="10" fill="#2d3436"/>
    <rect x="50" y="50" width="550" height="35" rx="10" fill="url(#jsonHeaderGrad)"/>
    <rect x="50" y="75" width="550" height="10" fill="url(#jsonHeaderGrad)"/>

    <!-- Window controls -->
    <circle cx="75" cy="67" r="6" fill="#e74c3c"/>
    <circle cx="95" cy="67" r="6" fill="#f39c12"/>
    <circle cx="115" cy="67" r="6" fill="#27ae60"/>

    <text x="325" y="72" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">user.json</text>

    <!-- JSON Content -->
    <text x="70" y="115" fill="#dfe6e9" font-family="monospace" font-size="13">{</text>

    <text x="90" y="140" fill="#e74c3c" font-family="monospace" font-size="13">"name"</text>
    <text x="150" y="140" fill="#dfe6e9" font-family="monospace" font-size="13">:</text>
    <text x="165" y="140" fill="#a6e22e" font-family="monospace" font-size="13">"Иван Петров"</text>
    <text x="285" y="140" fill="#dfe6e9" font-family="monospace" font-size="13">,</text>
    <text x="320" y="140" fill="#636e72" font-family="monospace" font-size="11">← string</text>

    <text x="90" y="165" fill="#e74c3c" font-family="monospace" font-size="13">"age"</text>
    <text x="135" y="165" fill="#dfe6e9" font-family="monospace" font-size="13">:</text>
    <text x="150" y="165" fill="#ae81ff" font-family="monospace" font-size="13">28</text>
    <text x="170" y="165" fill="#dfe6e9" font-family="monospace" font-size="13">,</text>
    <text x="320" y="165" fill="#636e72" font-family="monospace" font-size="11">← number</text>

    <text x="90" y="190" fill="#e74c3c" font-family="monospace" font-size="13">"isActive"</text>
    <text x="180" y="190" fill="#dfe6e9" font-family="monospace" font-size="13">:</text>
    <text x="195" y="190" fill="#66d9ef" font-family="monospace" font-size="13">true</text>
    <text x="230" y="190" fill="#dfe6e9" font-family="monospace" font-size="13">,</text>
    <text x="320" y="190" fill="#636e72" font-family="monospace" font-size="11">← boolean</text>

    <text x="90" y="215" fill="#e74c3c" font-family="monospace" font-size="13">"skills"</text>
    <text x="160" y="215" fill="#dfe6e9" font-family="monospace" font-size="13">:</text>
    <text x="175" y="215" fill="#dfe6e9" font-family="monospace" font-size="13">[</text>
    <text x="185" y="215" fill="#a6e22e" font-family="monospace" font-size="13">"JS"</text>
    <text x="215" y="215" fill="#dfe6e9" font-family="monospace" font-size="13">,</text>
    <text x="225" y="215" fill="#a6e22e" font-family="monospace" font-size="13">"Python"</text>
    <text x="295" y="215" fill="#dfe6e9" font-family="monospace" font-size="13">]</text>
    <text x="320" y="215" fill="#636e72" font-family="monospace" font-size="11">← array</text>

    <text x="90" y="240" fill="#e74c3c" font-family="monospace" font-size="13">"address"</text>
    <text x="170" y="240" fill="#dfe6e9" font-family="monospace" font-size="13">:</text>
    <text x="185" y="240" fill="#dfe6e9" font-family="monospace" font-size="13">{</text>
    <text x="200" y="240" fill="#e74c3c" font-family="monospace" font-size="13">"city"</text>
    <text x="245" y="240" fill="#dfe6e9" font-family="monospace" font-size="13">:</text>
    <text x="260" y="240" fill="#a6e22e" font-family="monospace" font-size="13">"Sofia"</text>
    <text x="320" y="240" fill="#dfe6e9" font-family="monospace" font-size="13">}</text>
    <text x="360" y="240" fill="#636e72" font-family="monospace" font-size="11">← nested object</text>

    <text x="70" y="265" fill="#dfe6e9" font-family="monospace" font-size="13">}</text>
  </g>

  <!-- Legend -->
  <g transform="translate(100, 300)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#e74c3c"/>
    <text x="18" y="10" fill="#666" font-family="system-ui, sans-serif" font-size="10">Key</text>

    <rect x="60" y="0" width="12" height="12" rx="2" fill="#a6e22e"/>
    <text x="78" y="10" fill="#666" font-family="system-ui, sans-serif" font-size="10">String</text>

    <rect x="140" y="0" width="12" height="12" rx="2" fill="#ae81ff"/>
    <text x="158" y="10" fill="#666" font-family="system-ui, sans-serif" font-size="10">Number</text>

    <rect x="220" y="0" width="12" height="12" rx="2" fill="#66d9ef"/>
    <text x="238" y="10" fill="#666" font-family="system-ui, sans-serif" font-size="10">Boolean</text>

    <rect x="305" y="0" width="12" height="12" rx="2" fill="#dfe6e9"/>
    <text x="323" y="10" fill="#666" font-family="system-ui, sans-serif" font-size="10">Array [ ] / Object { }</text>
  </g>
</svg>
