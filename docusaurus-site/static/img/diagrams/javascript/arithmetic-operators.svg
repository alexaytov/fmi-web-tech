<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="opGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <text x="300" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Arithmetic Operations (x=15, y=4)</text>

  <rect x="20" y="45" width="100" height="60" rx="8" fill="url(#opGrad1)"/>
  <text x="70" y="70" text-anchor="middle" font-size="20" fill="white" font-weight="bold">+</text>
  <text x="70" y="95" text-anchor="middle" font-size="12" fill="white">19</text>

  <rect x="135" y="45" width="100" height="60" rx="8" fill="url(#opGrad1)"/>
  <text x="185" y="70" text-anchor="middle" font-size="20" fill="white" font-weight="bold">−</text>
  <text x="185" y="95" text-anchor="middle" font-size="12" fill="white">11</text>

  <rect x="250" y="45" width="100" height="60" rx="8" fill="url(#opGrad1)"/>
  <text x="300" y="70" text-anchor="middle" font-size="20" fill="white" font-weight="bold">×</text>
  <text x="300" y="95" text-anchor="middle" font-size="12" fill="white">60</text>

  <rect x="365" y="45" width="100" height="60" rx="8" fill="url(#opGrad1)"/>
  <text x="415" y="70" text-anchor="middle" font-size="20" fill="white" font-weight="bold">÷</text>
  <text x="415" y="95" text-anchor="middle" font-size="12" fill="white">3.75</text>

  <rect x="480" y="45" width="100" height="60" rx="8" fill="url(#opGrad1)"/>
  <text x="530" y="70" text-anchor="middle" font-size="20" fill="white" font-weight="bold">%</text>
  <text x="530" y="95" text-anchor="middle" font-size="12" fill="white">3</text>

  <rect x="150" y="125" width="300" height="60" rx="8" fill="#e3f2fd" stroke="#2196f3"/>
  <text x="300" y="150" text-anchor="middle" font-size="11" fill="#1565c0" font-weight="bold">% (Modulo) = Remainder after division</text>
  <text x="300" y="170" text-anchor="middle" font-size="10" fill="#1976d2">15 ÷ 4 = 3 remainder 3 → 15 % 4 = 3</text>
</svg>
