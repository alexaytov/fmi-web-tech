<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150">
  <defs>
    <linearGradient id="funcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#673ab7"/>
      <stop offset="100%" stop-color="#9c27b0"/>
    </linearGradient>
  </defs>

  <rect x="50" y="30" width="120" height="80" rx="8" fill="#e8eaf6" stroke="#673ab7"/>
  <text x="110" y="60" text-anchor="middle" font-size="11" fill="#673ab7" font-weight="bold">INPUT</text>
  <text x="110" y="80" text-anchor="middle" font-size="10" fill="#5e35b1">width: 5</text>
  <text x="110" y="95" text-anchor="middle" font-size="10" fill="#5e35b1">height: 3</text>

  <path d="M170 70 L220 70" stroke="#673ab7" stroke-width="2"/>
  <polygon points="220,65 230,70 220,75" fill="#673ab7"/>

  <rect x="230" y="30" width="140" height="80" rx="8" fill="url(#funcGrad)"/>
  <text x="300" y="55" text-anchor="middle" font-size="11" fill="white" font-weight="bold">calculateArea</text>
  <text x="300" y="75" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">width × height</text>
  <text x="300" y="95" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">5 × 3 = 15</text>

  <path d="M370 70 L420 70" stroke="#673ab7" stroke-width="2"/>
  <polygon points="420,65 430,70 420,75" fill="#673ab7"/>

  <rect x="430" y="30" width="120" height="80" rx="8" fill="#e8f5e9" stroke="#4caf50"/>
  <text x="490" y="60" text-anchor="middle" font-size="11" fill="#388e3c" font-weight="bold">OUTPUT</text>
  <text x="490" y="85" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">15</text>
</svg>
