<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200">
  <defs>
    <linearGradient id="conditionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
  </defs>

  <polygon points="250,20 350,70 250,120 150,70" fill="url(#conditionGrad)" stroke="#7b1fa2" stroke-width="2"/>
  <text x="250" y="65" text-anchor="middle" font-size="12" fill="white" font-weight="bold">age >= 18?</text>
  <text x="250" y="85" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">(condition)</text>

  <path d="M150 70 L80 70 L80 150" stroke="#4caf50" stroke-width="2" fill="none"/>
  <text x="100" y="60" font-size="10" fill="#4caf50" font-weight="bold">true</text>

  <path d="M350 70 L420 70 L420 150" stroke="#f44336" stroke-width="2" fill="none"/>
  <text x="380" y="60" font-size="10" fill="#f44336" font-weight="bold">false</text>

  <rect x="20" y="150" width="120" height="40" rx="6" fill="#e8f5e9" stroke="#4caf50"/>
  <text x="80" y="175" text-anchor="middle" font-size="11" fill="#2e7d32">"Пълнолетен"</text>

  <rect x="360" y="150" width="120" height="40" rx="6" fill="#ffebee" stroke="#f44336"/>
  <text x="420" y="175" text-anchor="middle" font-size="11" fill="#c62828">"Непълнолетен"</text>
</svg>
