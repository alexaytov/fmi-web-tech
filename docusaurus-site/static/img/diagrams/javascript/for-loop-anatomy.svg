<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180">
  <defs>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#26c6da"/>
    </linearGradient>
  </defs>

  <text x="300" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">For Loop Anatomy</text>

  <rect x="50" y="45" width="500" height="50" rx="8" fill="url(#loopGrad)"/>
  <text x="300" y="75" text-anchor="middle" font-size="14" fill="white" font-family="monospace">for (let i = 1;  i &lt;= 5;  i++)</text>

  <rect x="95" y="110" width="100" height="50" rx="6" fill="#e0f7fa" stroke="#00bcd4"/>
  <text x="145" y="130" text-anchor="middle" font-size="9" fill="#006064" font-weight="bold">Initialize</text>
  <text x="145" y="148" text-anchor="middle" font-size="10" fill="#00838f">let i = 1</text>

  <rect x="250" y="110" width="100" height="50" rx="6" fill="#e0f7fa" stroke="#00bcd4"/>
  <text x="300" y="130" text-anchor="middle" font-size="9" fill="#006064" font-weight="bold">Condition</text>
  <text x="300" y="148" text-anchor="middle" font-size="10" fill="#00838f">i &lt;= 5</text>

  <rect x="405" y="110" width="100" height="50" rx="6" fill="#e0f7fa" stroke="#00bcd4"/>
  <text x="455" y="130" text-anchor="middle" font-size="9" fill="#006064" font-weight="bold">Increment</text>
  <text x="455" y="148" text-anchor="middle" font-size="10" fill="#00838f">i++</text>

  <path d="M145 95 L145 110" stroke="#00bcd4" stroke-width="2"/>
  <path d="M300 95 L300 110" stroke="#00bcd4" stroke-width="2"/>
  <path d="M455 95 L455 110" stroke="#00bcd4" stroke-width="2"/>
</svg>
