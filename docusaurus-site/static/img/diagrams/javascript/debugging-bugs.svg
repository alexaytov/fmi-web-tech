<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="bugGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f44336"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
  </defs>

  <text x="300" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">🐛 4 Bugs Found</text>

  <rect x="20" y="45" width="130" height="60" rx="6" fill="url(#bugGrad)"/>
  <text x="85" y="70" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Bug #1</text>
  <text x="85" y="90" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">Missing ;</text>

  <rect x="165" y="45" width="130" height="60" rx="6" fill="url(#bugGrad)"/>
  <text x="230" y="70" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Bug #2</text>
  <text x="230" y="90" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">&lt;= should be &lt;</text>

  <rect x="310" y="45" width="130" height="60" rx="6" fill="url(#bugGrad)"/>
  <text x="375" y="70" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Bug #3</text>
  <text x="375" y="90" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">lenght → length</text>

  <rect x="455" y="45" width="130" height="60" rx="6" fill="url(#bugGrad)"/>
  <text x="520" y="70" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Bug #4</text>
  <text x="520" y="90" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">Missing ;</text>

  <rect x="100" y="125" width="400" height="55" rx="8" fill="#e8f5e9" stroke="#4caf50"/>
  <text x="300" y="148" text-anchor="middle" font-size="11" fill="#2e7d32" font-weight="bold">✅ Fixed Version:</text>
  <text x="300" y="168" text-anchor="middle" font-size="10" fill="#388e3c" font-family="monospace">for (let i = 0; i &lt; numbers.length; i++)</text>
</svg>
