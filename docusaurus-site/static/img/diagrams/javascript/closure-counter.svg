<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 180">
  <defs>
    <linearGradient id="closureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b1fa2"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
  </defs>

  <rect x="100" y="20" width="350" height="140" rx="12" fill="url(#closureGrad)"/>

  <rect x="180" y="40" width="190" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
  <text x="275" y="55" text-anchor="middle" font-size="10" fill="white">🔒 Private Variable</text>
  <text x="275" y="72" text-anchor="middle" font-size="12" fill="white" font-weight="bold">let count = 0</text>

  <rect x="120" y="95" width="95" height="50" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="167" y="115" text-anchor="middle" font-size="9" fill="white">increment()</text>
  <text x="167" y="135" text-anchor="middle" font-size="10" fill="white">count++</text>

  <rect x="227" y="95" width="95" height="50" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="275" y="115" text-anchor="middle" font-size="9" fill="white">decrement()</text>
  <text x="275" y="135" text-anchor="middle" font-size="10" fill="white">count--</text>

  <rect x="335" y="95" width="95" height="50" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="382" y="115" text-anchor="middle" font-size="9" fill="white">getValue()</text>
  <text x="382" y="135" text-anchor="middle" font-size="10" fill="white">return count</text>
</svg>
