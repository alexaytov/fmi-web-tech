<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 280">
  <defs>
    <linearGradient id="stringType" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e91e63"/>
      <stop offset="100%" stop-color="#f06292"/>
    </linearGradient>
    <linearGradient id="numberType" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#64b5f6"/>
    </linearGradient>
    <linearGradient id="boolType" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#ba68c8"/>
    </linearGradient>
    <linearGradient id="undefType" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#607d8b"/>
      <stop offset="100%" stop-color="#90a4ae"/>
    </linearGradient>
    <linearGradient id="nullType" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#795548"/>
      <stop offset="100%" stop-color="#a1887f"/>
    </linearGradient>
    <linearGradient id="arrayType" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
  </defs>

  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">JavaScript Data Types</text>

  <rect x="20" y="50" width="190" height="60" rx="8" fill="url(#stringType)"/>
  <text x="115" y="75" text-anchor="middle" font-size="12" fill="white" font-weight="bold">a = "Здравей"</text>
  <text x="115" y="95" text-anchor="middle" font-size="14" fill="white">📝 string</text>

  <rect x="230" y="50" width="190" height="60" rx="8" fill="url(#numberType)"/>
  <text x="325" y="75" text-anchor="middle" font-size="12" fill="white" font-weight="bold">b = 42</text>
  <text x="325" y="95" text-anchor="middle" font-size="14" fill="white">🔢 number</text>

  <rect x="440" y="50" width="190" height="60" rx="8" fill="url(#boolType)"/>
  <text x="535" y="75" text-anchor="middle" font-size="12" fill="white" font-weight="bold">c = true</text>
  <text x="535" y="95" text-anchor="middle" font-size="14" fill="white">✓✗ boolean</text>

  <rect x="20" y="130" width="190" height="60" rx="8" fill="url(#undefType)"/>
  <text x="115" y="155" text-anchor="middle" font-size="12" fill="white" font-weight="bold">d = undefined</text>
  <text x="115" y="175" text-anchor="middle" font-size="14" fill="white">❓ undefined</text>

  <rect x="230" y="130" width="190" height="60" rx="8" fill="url(#nullType)"/>
  <text x="325" y="155" text-anchor="middle" font-size="12" fill="white" font-weight="bold">e = null</text>
  <text x="325" y="175" text-anchor="middle" font-size="14" fill="white">∅ null</text>

  <rect x="440" y="130" width="190" height="60" rx="8" fill="url(#arrayType)"/>
  <text x="535" y="155" text-anchor="middle" font-size="12" fill="white" font-weight="bold">f = [1, 2, 3]</text>
  <text x="535" y="175" text-anchor="middle" font-size="14" fill="white">📦 array/object</text>

  <rect x="150" y="210" width="350" height="55" rx="8" fill="#fff3e0" stroke="#ff9800"/>
  <text x="325" y="235" text-anchor="middle" font-size="11" fill="#e65100" font-weight="bold">⚠️ Fun Fact: typeof null === "object"</text>
  <text x="325" y="253" text-anchor="middle" font-size="10" fill="#f57c00">This is a famous bug in JavaScript since 1995!</text>
</svg>
