<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180">
  <defs>
    <linearGradient id="validationGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
  </defs>

  <rect x="50" y="20" width="500" height="140" rx="10" fill="#fff3e0" stroke="#ff9800"/>
  <text x="300" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">Validation Pipeline</text>

  <rect x="80" y="70" width="130" height="70" rx="6" fill="url(#validationGrad)"/>
  <text x="145" y="95" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Empty Check</text>
  <text x="145" y="115" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">!username</text>
  <text x="145" y="130" text-anchor="middle" font-size="8" fill="white">→ "Required"</text>

  <path d="M210 105 L240 105" stroke="#ff9800" stroke-width="2"/>

  <rect x="240" y="70" width="130" height="70" rx="6" fill="url(#validationGrad)"/>
  <text x="305" y="95" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Min Length</text>
  <text x="305" y="115" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">length &lt; 3</text>
  <text x="305" y="130" text-anchor="middle" font-size="8" fill="white">→ "Min 3 chars"</text>

  <path d="M370 105 L400 105" stroke="#ff9800" stroke-width="2"/>

  <rect x="400" y="70" width="130" height="70" rx="6" fill="url(#validationGrad)"/>
  <text x="465" y="95" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Max Length</text>
  <text x="465" y="115" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">length > 15</text>
  <text x="465" y="130" text-anchor="middle" font-size="8" fill="white">→ "Max 15 chars"</text>
</svg>
