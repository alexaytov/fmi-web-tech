<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220">
  <defs>
    <linearGradient id="looseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#ffc107"/>
    </linearGradient>
    <linearGradient id="strictGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#8bc34a"/>
    </linearGradient>
  </defs>

  <text x="300" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">== vs === Comparison</text>

  <rect x="50" y="45" width="220" height="80" rx="10" fill="url(#looseGrad)"/>
  <text x="160" y="75" text-anchor="middle" font-size="16" fill="white" font-weight="bold">== (Loose)</text>
  <text x="160" y="100" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">Converts types before comparing</text>
  <text x="160" y="118" text-anchor="middle" font-size="10" fill="white">5 == "5" → true</text>

  <rect x="330" y="45" width="220" height="80" rx="10" fill="url(#strictGrad)"/>
  <text x="440" y="75" text-anchor="middle" font-size="16" fill="white" font-weight="bold">=== (Strict)</text>
  <text x="440" y="100" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">Compares type AND value</text>
  <text x="440" y="118" text-anchor="middle" font-size="10" fill="white">5 === "5" → false</text>

  <rect x="100" y="145" width="400" height="60" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="300" y="170" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="bold">✅ Best Practice: Always use === and !==</text>
  <text x="300" y="190" text-anchor="middle" font-size="10" fill="#388e3c">Avoids unexpected type coercion bugs</text>
</svg>
