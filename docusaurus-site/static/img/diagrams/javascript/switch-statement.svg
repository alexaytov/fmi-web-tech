<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 180">
  <defs>
    <linearGradient id="switchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
  </defs>

  <rect x="200" y="20" width="150" height="40" rx="8" fill="url(#switchGrad)"/>
  <text x="275" y="45" text-anchor="middle" font-size="12" fill="white" font-weight="bold">switch(dayNumber)</text>

  <path d="M275 60 L275 80 L100 80 L100 100" stroke="#9c27b0" stroke-width="2"/>
  <path d="M275 60 L275 80 L275 100" stroke="#9c27b0" stroke-width="2"/>
  <path d="M275 60 L275 80 L450 80 L450 100" stroke="#9c27b0" stroke-width="2"/>

  <rect x="50" y="100" width="100" height="60" rx="6" fill="#f3e5f5" stroke="#9c27b0"/>
  <text x="100" y="125" text-anchor="middle" font-size="10" fill="#7b1fa2" font-weight="bold">case 1:</text>
  <text x="100" y="145" text-anchor="middle" font-size="9" fill="#9c27b0">"Понеделник"</text>

  <rect x="225" y="100" width="100" height="60" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="275" y="125" text-anchor="middle" font-size="10" fill="#2e7d32" font-weight="bold">case 3: ✓</text>
  <text x="275" y="145" text-anchor="middle" font-size="9" fill="#388e3c">"Сряда"</text>

  <rect x="400" y="100" width="100" height="60" rx="6" fill="#f3e5f5" stroke="#9c27b0"/>
  <text x="450" y="125" text-anchor="middle" font-size="10" fill="#7b1fa2" font-weight="bold">default:</text>
  <text x="450" y="145" text-anchor="middle" font-size="9" fill="#9c27b0">"Невалиден"</text>
</svg>
