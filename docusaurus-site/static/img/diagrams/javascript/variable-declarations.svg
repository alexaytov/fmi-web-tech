<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="constGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#8bc34a"/>
    </linearGradient>
    <linearGradient id="letGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#03a9f4"/>
    </linearGradient>
    <linearGradient id="varGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#ffc107"/>
    </linearGradient>
    <linearGradient id="noKeyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f44336"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="130" height="70" rx="8" fill="url(#constGrad)"/>
  <text x="85" y="50" text-anchor="middle" font-size="14" fill="white" font-weight="bold">const</text>
  <text x="85" y="70" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">✅ Best choice</text>

  <rect x="170" y="20" width="130" height="70" rx="8" fill="url(#letGrad)"/>
  <text x="235" y="50" text-anchor="middle" font-size="14" fill="white" font-weight="bold">let</text>
  <text x="235" y="70" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">✓ Mutable vars</text>

  <rect x="320" y="20" width="130" height="70" rx="8" fill="url(#varGrad)"/>
  <text x="385" y="50" text-anchor="middle" font-size="14" fill="white" font-weight="bold">var</text>
  <text x="385" y="70" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">⚠️ Avoid</text>

  <rect x="470" y="20" width="110" height="70" rx="8" fill="url(#noKeyGrad)"/>
  <text x="525" y="50" text-anchor="middle" font-size="14" fill="white" font-weight="bold">(none)</text>
  <text x="525" y="70" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">❌ Never</text>

  <rect x="20" y="110" width="560" height="70" rx="8" fill="#e8f5e9" stroke="#4caf50"/>
  <text x="300" y="140" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="bold">Modern JavaScript Rule:</text>
  <text x="300" y="160" text-anchor="middle" font-size="11" fill="#388e3c">Use const by default, let only when reassignment is needed</text>
</svg>
