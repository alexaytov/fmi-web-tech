<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <defs>
    <linearGradient id="stackGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="stackGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
    <linearGradient id="stackGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#1e8449"/>
    </linearGradient>
    <filter id="stackShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <marker id="stackArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" fill="#333" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Call Stack Visualization</text>

  <!-- Stack Container -->
  <rect x="200" y="50" width="300" height="280" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  <text x="350" y="75" fill="#666" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Call Stack</text>

  <!-- Stack Frame 3 - innerFunction() at top (green) -->
  <g filter="url(#stackShadow)">
    <rect x="220" y="95" width="260" height="50" rx="6" fill="url(#stackGrad3)"/>
    <text x="350" y="125" fill="white" font-family="monospace" font-size="13" text-anchor="middle">innerFunction()</text>
  </g>

  <!-- Stack Frame 2 - outerFunction() in middle (orange) -->
  <g filter="url(#stackShadow)">
    <rect x="220" y="160" width="260" height="50" rx="6" fill="url(#stackGrad2)"/>
    <text x="350" y="190" fill="white" font-family="monospace" font-size="13" text-anchor="middle">outerFunction()</text>
  </g>

  <!-- Stack Frame 1 - main() at bottom (red) -->
  <g filter="url(#stackShadow)">
    <rect x="220" y="225" width="260" height="50" rx="6" fill="url(#stackGrad1)"/>
    <text x="350" y="255" fill="white" font-family="monospace" font-size="13" text-anchor="middle">main()</text>
  </g>

  <!-- Step labels on the left -->
  <text x="80" y="255" fill="#e74c3c" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">1. main() called</text>
  <text x="80" y="190" fill="#f39c12" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">2. outerFunction()</text>
  <text x="80" y="125" fill="#27ae60" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">3. innerFunction()</text>

  <!-- Arrows showing execution order -->
  <line x1="130" y1="240" x2="130" y2="205" stroke="#666" stroke-width="2" marker-end="url(#stackArrow)"/>
  <line x1="130" y1="175" x2="130" y2="140" stroke="#666" stroke-width="2" marker-end="url(#stackArrow)"/>

  <!-- Top indicator -->
  <text x="540" y="120" fill="#27ae60" font-family="system-ui, sans-serif" font-size="10" text-anchor="start">TOP</text>
  <line x1="490" y1="120" x2="530" y2="120" stroke="#27ae60" stroke-width="2" marker-end="url(#stackArrow)"/>

  <!-- Bottom indicator -->
  <text x="540" y="250" fill="#e74c3c" font-family="system-ui, sans-serif" font-size="10" text-anchor="start">BOTTOM</text>
  <line x1="490" y1="250" x2="530" y2="250" stroke="#e74c3c" stroke-width="2" marker-end="url(#stackArrow)"/>

  <!-- Bottom labels -->
  <text x="350" y="310" fill="#666" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">LIFO: Last In, First Out</text>
  <text x="350" y="328" fill="#999" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">innerFunction() finishes first, main() finishes last</text>
</svg>
