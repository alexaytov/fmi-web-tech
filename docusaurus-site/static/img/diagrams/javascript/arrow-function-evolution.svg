<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120">
  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e91e63"/>
      <stop offset="100%" stop-color="#f06292"/>
    </linearGradient>
  </defs>

  <text x="300" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Function → Arrow Function Evolution</text>

  <rect x="20" y="45" width="180" height="55" rx="6" fill="#fce4ec" stroke="#e91e63"/>
  <text x="110" y="68" text-anchor="middle" font-size="9" fill="#c2185b" font-family="monospace">function(num) {</text>
  <text x="110" y="85" text-anchor="middle" font-size="9" fill="#c2185b" font-family="monospace">return num * num }</text>

  <text x="230" y="75" font-size="20" fill="#e91e63">→</text>

  <rect x="260" y="50" width="150" height="40" rx="6" fill="url(#arrowGrad)"/>
  <text x="335" y="75" text-anchor="middle" font-size="10" fill="white" font-family="monospace">(num) => num * num</text>

  <text x="440" y="75" font-size="20" fill="#e91e63">→</text>

  <rect x="470" y="50" width="110" height="40" rx="6" fill="url(#arrowGrad)"/>
  <text x="525" y="75" text-anchor="middle" font-size="10" fill="white" font-family="monospace">n => n * n</text>
</svg>
