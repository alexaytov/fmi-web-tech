<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <defs>
    <linearGradient id="marginGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffecd2" stop-opacity="1" />
      <stop offset="100%" stop-color="#fcb69f" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8edea" stop-opacity="1" />
      <stop offset="100%" stop-color="#fed6e3" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="paddingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89CFF0" stop-opacity="1" />
      <stop offset="100%" stop-color="#5DADE2" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="contentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27ae60" stop-opacity="1" />
      <stop offset="100%" stop-color="#2ecc71" stop-opacity="1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Margin Layer (Light Gray / Peach) -->
  <rect x="20" y="20" width="460" height="360" rx="12" fill="url(#marginGrad)" stroke="#e67e22" stroke-width="2"/>
  <text x="40" y="50" fill="#d35400" font-weight="bold" font-size="14" font-family="Arial, sans-serif">MARGIN</text>

  <!-- Border Layer (Dark) -->
  <rect x="60" y="60" width="380" height="280" rx="10" fill="url(#borderGrad)" stroke="#2c3e50" stroke-width="4"/>
  <text x="80" y="90" fill="#2c3e50" font-weight="bold" font-size="14" font-family="Arial, sans-serif">BORDER</text>

  <!-- Padding Layer (Blue) -->
  <rect x="100" y="100" width="300" height="200" rx="8" fill="url(#paddingGrad)" stroke="#3498db" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="120" y="130" fill="#2980b9" font-weight="bold" font-size="14" font-family="Arial, sans-serif">PADDING</text>

  <!-- Content Layer (Green center) -->
  <rect x="150" y="150" width="200" height="100" rx="6" fill="url(#contentGrad)"/>
  <text x="250" y="195" fill="white" font-weight="bold" font-size="16" text-anchor="middle" font-family="Arial, sans-serif">CONTENT</text>
  <text x="250" y="220" fill="white" font-size="12" text-anchor="middle" font-family="Arial, sans-serif">width x height</text>

  <!-- Dimension arrows -->
  <line x1="150" y1="270" x2="350" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="370" y1="150" x2="370" y2="250" stroke="#333" stroke-width="2"/>
  <text x="250" y="290" fill="#333" font-size="11" text-anchor="middle" font-family="Arial, sans-serif">width</text>
  <text x="390" y="200" fill="#333" font-size="11" text-anchor="middle" transform="rotate(90, 390, 200)" font-family="Arial, sans-serif">height</text>

  <!-- Layer size labels -->
  <text x="250" y="385" fill="#666" font-size="10" text-anchor="middle" font-family="Arial, sans-serif">Each layer adds to the total element size</text>
</svg>
