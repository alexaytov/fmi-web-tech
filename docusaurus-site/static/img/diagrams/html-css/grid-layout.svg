<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="gridContainerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="1" />
      <stop offset="100%" stop-color="#16213e" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="1" />
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="sidebarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3460" stop-opacity="1" />
      <stop offset="100%" stop-color="#533483" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b894" stop-opacity="1" />
      <stop offset="100%" stop-color="#00cec9" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdcb6e" stop-opacity="1" />
      <stop offset="100%" stop-color="#f39c12" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Grid Container -->
  <rect x="30" y="30" width="540" height="340" rx="12" fill="url(#gridContainerGrad)" stroke="#e94560" stroke-width="2"/>

  <!-- Grid Lines - Vertical -->
  <line x1="210" y1="50" x2="210" y2="350" stroke="#fff" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  <line x1="390" y1="50" x2="390" y2="350" stroke="#fff" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>

  <!-- Grid Lines - Horizontal -->
  <line x1="50" y1="120" x2="550" y2="120" stroke="#fff" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  <line x1="50" y1="270" x2="550" y2="270" stroke="#fff" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>

  <!-- Column Labels -->
  <text x="125" y="20" fill="#e94560" font-size="11" text-anchor="middle" font-family="Arial, sans-serif">Column 1</text>
  <text x="300" y="20" fill="#e94560" font-size="11" text-anchor="middle" font-family="Arial, sans-serif">Column 2</text>
  <text x="470" y="20" fill="#e94560" font-size="11" text-anchor="middle" font-family="Arial, sans-serif">Column 3</text>

  <!-- Row Labels -->
  <text x="15" y="85" fill="#e94560" font-size="10" text-anchor="middle" transform="rotate(-90, 15, 85)" font-family="Arial, sans-serif">Row 1</text>
  <text x="15" y="195" fill="#e94560" font-size="10" text-anchor="middle" transform="rotate(-90, 15, 195)" font-family="Arial, sans-serif">Row 2</text>
  <text x="15" y="310" fill="#e94560" font-size="10" text-anchor="middle" transform="rotate(-90, 15, 310)" font-family="Arial, sans-serif">Row 3</text>

  <!-- Header - spans all 3 columns (Red/Pink) -->
  <rect x="50" y="50" width="500" height="60" rx="8" fill="url(#headerGrad)"/>
  <text x="300" y="85" fill="white" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">HEADER</text>
  <text x="300" y="100" fill="white" font-size="10" text-anchor="middle" font-family="Arial, sans-serif">(grid-column: 1 / -1)</text>

  <!-- Sidebar - left column (Purple/Blue) -->
  <rect x="50" y="130" width="150" height="130" rx="8" fill="url(#sidebarGrad)"/>
  <text x="125" y="200" fill="white" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">SIDEBAR</text>

  <!-- Main Content - center, spans 2 columns (Green/Teal) -->
  <rect x="210" y="130" width="340" height="130" rx="8" fill="url(#mainGrad)"/>
  <text x="380" y="195" fill="white" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">MAIN</text>
  <text x="380" y="215" fill="white" font-size="10" text-anchor="middle" font-family="Arial, sans-serif">(grid-column: 2 / 4)</text>

  <!-- Footer - spans all 3 columns at bottom (Yellow/Orange) -->
  <rect x="50" y="280" width="500" height="60" rx="8" fill="url(#footerGrad)"/>
  <text x="300" y="315" fill="white" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">FOOTER</text>
  <text x="300" y="330" fill="white" font-size="10" text-anchor="middle" font-family="Arial, sans-serif">(grid-column: 1 / -1)</text>

  <!-- Gap indicator -->
  <text x="300" y="385" fill="#666" font-size="10" text-anchor="middle" font-family="Arial, sans-serif">gap: 10px (space between grid cells)</text>
</svg>
