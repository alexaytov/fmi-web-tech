<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="containerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" stop-opacity="1" />
      <stop offset="100%" stop-color="#34495e" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="item1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c" stop-opacity="1" />
      <stop offset="100%" stop-color="#c0392b" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="item2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498db" stop-opacity="1" />
      <stop offset="100%" stop-color="#2980b9" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="item3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71" stop-opacity="1" />
      <stop offset="100%" stop-color="#27ae60" stop-opacity="1" />
    </linearGradient>
    <marker id="arrowMain" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12" />
    </marker>
    <marker id="arrowCross" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b59b6" />
    </marker>
  </defs>

  <!-- Container -->
  <rect x="50" y="80" width="500" height="180" rx="10" fill="url(#containerGrad)" stroke="#1abc9c" stroke-width="3"/>
  <text x="70" y="105" fill="#1abc9c" font-weight="bold" font-size="12" font-family="Arial, sans-serif">display: flex</text>

  <!-- Main Axis Arrow (Horizontal) -->
  <line x1="70" y1="170" x2="520" y2="170" stroke="#f39c12" stroke-width="3" stroke-dasharray="10,5" marker-end="url(#arrowMain)"/>
  <text x="480" y="190" fill="#f39c12" font-size="11" font-weight="bold" font-family="Arial, sans-serif">Main Axis</text>

  <!-- Cross Axis Arrow (Vertical) -->
  <line x1="300" y1="95" x2="300" y2="245" stroke="#9b59b6" stroke-width="3" stroke-dasharray="10,5" marker-end="url(#arrowCross)"/>
  <text x="310" y="240" fill="#9b59b6" font-size="11" font-weight="bold" font-family="Arial, sans-serif">Cross Axis</text>

  <!-- Flex Items (colored boxes) -->
  <g>
    <rect x="90" y="120" width="100" height="100" rx="8" fill="url(#item1Grad)"/>
    <text x="140" y="175" fill="white" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">Item 1</text>
  </g>

  <g>
    <rect x="210" y="120" width="120" height="100" rx="8" fill="url(#item2Grad)"/>
    <text x="270" y="175" fill="white" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">Item 2</text>
  </g>

  <g>
    <rect x="350" y="120" width="80" height="100" rx="8" fill="url(#item3Grad)"/>
    <text x="390" y="175" fill="white" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">Item 3</text>
  </g>

  <!-- Gap indication -->
  <line x1="190" y1="130" x2="210" y2="130" stroke="white" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="330" y1="130" x2="350" y2="130" stroke="white" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="200" y="145" fill="white" font-size="9" text-anchor="middle" font-family="Arial, sans-serif">gap</text>
  <text x="340" y="145" fill="white" font-size="9" text-anchor="middle" font-family="Arial, sans-serif">gap</text>

  <!-- Legend -->
  <rect x="50" y="290" width="500" height="50" rx="5" fill="#ecf0f1"/>
  <text x="70" y="315" fill="#2c3e50" font-size="11" font-family="Arial, sans-serif">justify-content: alignment along Main Axis</text>
  <text x="70" y="330" fill="#2c3e50" font-size="11" font-family="Arial, sans-serif">align-items: alignment along Cross Axis</text>
  <text x="350" y="315" fill="#2c3e50" font-size="11" font-family="Arial, sans-serif">flex-direction: row | column</text>
  <text x="350" y="330" fill="#2c3e50" font-size="11" font-family="Arial, sans-serif">gap: space between items</text>
</svg>
