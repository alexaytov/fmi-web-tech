<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300">
  <defs>
    <linearGradient id="wideContainerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="1" />
      <stop offset="100%" stop-color="#764ba2" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="narrowContainerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f093fb" stop-opacity="1" />
      <stop offset="100%" stop-color="#f5576c" stop-opacity="1" />
    </linearGradient>
    <style>
      @keyframes containerResize {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.8; }
      }
      .container-demo { animation: containerResize 3s ease-in-out infinite; }
      .container-demo-delayed { animation: containerResize 3s ease-in-out 1.5s infinite; }
    </style>
  </defs>

  <!-- Wide Container -->
  <g class="container-demo">
    <rect x="20" y="30" width="300" height="120" rx="10" fill="url(#wideContainerGrad)" stroke="#333" stroke-width="2"/>
    <text x="30" y="55" fill="white" font-size="11" font-weight="bold">container-type: inline-size</text>

    <!-- Card in wide container - horizontal layout -->
    <rect x="35" y="70" width="270" height="65" rx="6" fill="white"/>
    <rect x="45" y="80" width="60" height="45" rx="4" fill="#ddd"/>
    <rect x="115" y="85" width="100" height="10" rx="2" fill="#333"/>
    <rect x="115" y="100" width="150" height="8" rx="2" fill="#999"/>
    <rect x="115" y="113" width="130" height="8" rx="2" fill="#999"/>
    <text x="270" y="120" fill="#667eea" font-size="9">Horizontal</text>
  </g>
  <text x="170" y="170" fill="#333" font-size="12" text-anchor="middle" font-weight="bold">Широк контейнер (400px+)</text>
  <text x="170" y="185" fill="#666" font-size="10" text-anchor="middle">@container (min-width: 400px)</text>

  <!-- Arrow -->
  <text x="345" y="100" fill="#333" font-size="24">vs</text>

  <!-- Narrow Container -->
  <g class="container-demo-delayed">
    <rect x="400" y="30" width="140" height="180" rx="10" fill="url(#narrowContainerGrad)" stroke="#333" stroke-width="2"/>
    <text x="410" y="55" fill="white" font-size="10" font-weight="bold">container-type:</text>
    <text x="410" y="70" fill="white" font-size="10" font-weight="bold">inline-size</text>

    <!-- Card in narrow container - vertical/stacked layout -->
    <rect x="415" y="85" width="110" height="110" rx="6" fill="white"/>
    <rect x="425" y="95" width="90" height="50" rx="4" fill="#ddd"/>
    <rect x="425" y="155" width="80" height="8" rx="2" fill="#333"/>
    <rect x="425" y="168" width="70" height="6" rx="2" fill="#999"/>
    <rect x="425" y="178" width="60" height="6" rx="2" fill="#999"/>
    <text x="500" y="185" fill="#f5576c" font-size="9">Vertical</text>
  </g>
  <text x="470" y="230" fill="#333" font-size="12" text-anchor="middle" font-weight="bold">Тесен контейнер</text>
  <text x="470" y="245" fill="#666" font-size="10" text-anchor="middle">@container (max-width: 399px)</text>

  <!-- Key point -->
  <rect x="150" y="260" width="350" height="30" rx="5" fill="#e8f5e9"/>
  <text x="325" y="280" fill="#2e7d32" font-size="11" text-anchor="middle" font-weight="bold">Компонентът се адаптира към контейнера, не към viewport-а!</text>
</svg>
