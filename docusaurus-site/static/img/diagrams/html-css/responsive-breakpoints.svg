<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">
  <defs>
    <linearGradient id="mobileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="1" />
      <stop offset="100%" stop-color="#764ba2" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="tabletGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11998e" stop-opacity="1" />
      <stop offset="100%" stop-color="#38ef7d" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="desktopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fc4a1a" stop-opacity="1" />
      <stop offset="100%" stop-color="#f7b733" stop-opacity="1" />
    </linearGradient>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Mobile Device (Phone - Small) -->
  <g>
    <rect x="30" y="60" width="80" height="150" rx="10" fill="url(#mobileGrad)" stroke="#333" stroke-width="2"/>
    <rect x="40" y="80" width="60" height="100" rx="3" fill="white" opacity="0.9"/>
    <circle cx="70" cy="195" r="8" fill="#333" opacity="0.3"/>
    <rect x="55" y="65" width="30" height="4" rx="2" fill="#333" opacity="0.3"/>
    <!-- Content blocks - single column -->
    <rect x="45" y="90" width="50" height="8" rx="2" fill="#667eea"/>
    <rect x="45" y="105" width="50" height="30" rx="2" fill="#ddd"/>
    <rect x="45" y="140" width="50" height="30" rx="2" fill="#ddd"/>
  </g>
  <text x="70" y="240" fill="#333" font-size="14" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">Mobile</text>
  <text x="70" y="258" fill="#666" font-size="11" text-anchor="middle" font-family="Arial, sans-serif">&lt; 480px</text>

  <!-- Arrow 1: Mobile to Tablet -->
  <g>
    <line x1="130" y1="135" x2="200" y2="135" stroke="#333" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowRight)"/>
    <text x="165" y="120" fill="#666" font-size="10" text-anchor="middle" font-family="Arial, sans-serif">480px</text>
  </g>

  <!-- Tablet Device (Medium) -->
  <g>
    <rect x="230" y="50" width="140" height="180" rx="12" fill="url(#tabletGrad)" stroke="#333" stroke-width="2"/>
    <rect x="245" y="70" width="110" height="130" rx="5" fill="white" opacity="0.9"/>
    <circle cx="300" cy="215" r="8" fill="#333" opacity="0.3"/>
    <!-- Content blocks - 2 columns -->
    <rect x="250" y="80" width="100" height="10" rx="2" fill="#11998e"/>
    <rect x="250" y="95" width="45" height="40" rx="2" fill="#ddd"/>
    <rect x="300" y="95" width="50" height="40" rx="2" fill="#ddd"/>
    <rect x="250" y="140" width="45" height="40" rx="2" fill="#ddd"/>
    <rect x="300" y="140" width="50" height="40" rx="2" fill="#ddd"/>
  </g>
  <text x="300" y="255" fill="#333" font-size="14" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">Tablet</text>
  <text x="300" y="273" fill="#666" font-size="11" text-anchor="middle" font-family="Arial, sans-serif">768px+</text>

  <!-- Arrow 2: Tablet to Desktop -->
  <g>
    <line x1="390" y1="135" x2="460" y2="135" stroke="#333" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowRight)"/>
    <text x="425" y="120" fill="#666" font-size="10" text-anchor="middle" font-family="Arial, sans-serif">768px</text>
  </g>

  <!-- Desktop Device (Large) -->
  <g>
    <rect x="490" y="40" width="190" height="140" rx="8" fill="url(#desktopGrad)" stroke="#333" stroke-width="2"/>
    <rect x="505" y="55" width="160" height="100" rx="4" fill="white" opacity="0.9"/>
    <rect x="560" y="180" width="30" height="30" fill="#333" opacity="0.3"/>
    <rect x="530" y="210" width="90" height="8" rx="2" fill="#333" opacity="0.3"/>
    <!-- Content blocks - 3 columns -->
    <rect x="510" y="65" width="150" height="12" rx="2" fill="#fc4a1a"/>
    <rect x="510" y="82" width="45" height="35" rx="2" fill="#ddd"/>
    <rect x="560" y="82" width="45" height="35" rx="2" fill="#ddd"/>
    <rect x="610" y="82" width="50" height="35" rx="2" fill="#ddd"/>
    <rect x="510" y="122" width="150" height="25" rx="2" fill="#eee"/>
  </g>
  <text x="585" y="245" fill="#333" font-size="14" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">Desktop</text>
  <text x="585" y="263" fill="#666" font-size="11" text-anchor="middle" font-family="Arial, sans-serif">1024px+</text>

  <!-- Breakpoint labels at bottom -->
  <rect x="150" y="280" width="400" height="15" rx="3" fill="#f0f0f0"/>
  <text x="350" y="292" fill="#666" font-size="10" text-anchor="middle" font-family="Arial, sans-serif">Breakpoints: 480px | 768px | 1024px</text>
</svg>
