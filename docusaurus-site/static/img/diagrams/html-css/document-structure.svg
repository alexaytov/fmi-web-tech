<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="htmlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e44d26" stop-opacity="1" />
      <stop offset="100%" stop-color="#f16529" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="1" />
      <stop offset="100%" stop-color="#764ba2" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11998e" stop-opacity="1" />
      <stop offset="100%" stop-color="#38ef7d" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="elemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fc4a1a" stop-opacity="1" />
      <stop offset="100%" stop-color="#f7b733" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- HTML Container (Orange) -->
  <rect x="20" y="20" width="560" height="360" rx="15" fill="url(#htmlGrad)" opacity="0.9"/>
  <text x="50" y="55" fill="white" font-weight="bold" font-size="18" font-family="Arial, sans-serif">&lt;html&gt;</text>

  <!-- Head Section (Purple) -->
  <rect x="40" y="70" width="520" height="80" rx="10" fill="url(#headGrad)" opacity="0.9"/>
  <text x="60" y="100" fill="white" font-weight="bold" font-size="16" font-family="Arial, sans-serif">&lt;head&gt;</text>
  <text x="80" y="125" fill="white" font-size="12" font-family="Arial, sans-serif">&lt;title&gt;, &lt;meta&gt;, &lt;link&gt;, &lt;style&gt;</text>

  <!-- Body Section (Green) -->
  <rect x="40" y="160" width="520" height="200" rx="10" fill="url(#bodyGrad)" opacity="0.9"/>
  <text x="60" y="190" fill="white" font-weight="bold" font-size="16" font-family="Arial, sans-serif">&lt;body&gt;</text>

  <!-- Semantic Elements inside Body -->
  <rect x="60" y="205" width="150" height="40" rx="5" fill="url(#elemGrad)" opacity="0.85"/>
  <text x="95" y="230" fill="white" font-size="12" font-family="Arial, sans-serif">&lt;header&gt;</text>

  <rect x="220" y="205" width="100" height="40" rx="5" fill="url(#elemGrad)" opacity="0.85"/>
  <text x="245" y="230" fill="white" font-size="12" font-family="Arial, sans-serif">&lt;nav&gt;</text>

  <rect x="330" y="205" width="100" height="40" rx="5" fill="url(#elemGrad)" opacity="0.85"/>
  <text x="355" y="230" fill="white" font-size="12" font-family="Arial, sans-serif">&lt;main&gt;</text>

  <rect x="440" y="205" width="100" height="40" rx="5" fill="url(#elemGrad)" opacity="0.85"/>
  <text x="455" y="230" fill="white" font-size="12" font-family="Arial, sans-serif">&lt;article&gt;</text>

  <rect x="60" y="255" width="150" height="40" rx="5" fill="url(#elemGrad)" opacity="0.85"/>
  <text x="95" y="280" fill="white" font-size="12" font-family="Arial, sans-serif">&lt;section&gt;</text>

  <rect x="220" y="255" width="100" height="40" rx="5" fill="url(#elemGrad)" opacity="0.85"/>
  <text x="243" y="280" fill="white" font-size="12" font-family="Arial, sans-serif">&lt;aside&gt;</text>

  <rect x="330" y="255" width="100" height="40" rx="5" fill="url(#elemGrad)" opacity="0.85"/>
  <text x="350" y="280" fill="white" font-size="12" font-family="Arial, sans-serif">&lt;footer&gt;</text>

  <!-- Connecting line -->
  <line x1="300" y1="150" x2="300" y2="165" stroke="white" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Label -->
  <text x="490" y="340" fill="white" font-size="14" font-style="italic" font-family="Arial, sans-serif">Visible Content</text>
</svg>
