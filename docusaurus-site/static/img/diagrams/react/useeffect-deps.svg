<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <defs>
    <linearGradient id="effectRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="effectGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="effectBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="effectShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="400" y="30" fill="#1e293b" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">useEffect Dependency Array</text>

  <!-- Case 1: No Array -->
  <g filter="url(#effectShadow)">
    <rect x="30" y="55" width="230" height="240" rx="12" fill="white" stroke="#fecaca" stroke-width="2"/>
    <rect x="30" y="55" width="230" height="45" rx="12" fill="url(#effectRed)"/>
    <rect x="30" y="88" width="230" height="12" fill="url(#effectRed)"/>
    <text x="145" y="82" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">No Array</text>

    <text x="145" y="125" fill="#1e293b" font-family="monospace" font-size="10" text-anchor="middle">useEffect(() =&gt; {</text>
    <text x="145" y="142" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">  // effect code</text>
    <text x="145" y="159" fill="#1e293b" font-family="monospace" font-size="10" text-anchor="middle">});</text>

    <line x1="50" y1="175" x2="240" y2="175" stroke="#e2e8f0" stroke-width="1"/>

    <text x="145" y="200" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Runs after EVERY render</text>

    <!-- Timeline visualization -->
    <g transform="translate(50, 215)">
      <line x1="0" y1="15" x2="180" y2="15" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="0" cy="15" r="8" fill="#ef4444"/>
      <circle cx="45" cy="15" r="8" fill="#ef4444"/>
      <circle cx="90" cy="15" r="8" fill="#ef4444"/>
      <circle cx="135" cy="15" r="8" fill="#ef4444"/>
      <circle cx="180" cy="15" r="8" fill="#ef4444"/>
      <text x="90" y="45" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Every render triggers effect</text>
    </g>

    <rect x="50" y="268" width="170" height="20" rx="4" fill="#fef2f2"/>
    <text x="135" y="282" fill="#dc2626" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">⚠️ Може да е проблемно!</text>
  </g>

  <!-- Case 2: Empty Array -->
  <g filter="url(#effectShadow)">
    <rect x="285" y="55" width="230" height="240" rx="12" fill="white" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="285" y="55" width="230" height="45" rx="12" fill="url(#effectGreen)"/>
    <rect x="285" y="88" width="230" height="12" fill="url(#effectGreen)"/>
    <text x="400" y="82" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Empty Array []</text>

    <text x="400" y="125" fill="#1e293b" font-family="monospace" font-size="10" text-anchor="middle">useEffect(() =&gt; {</text>
    <text x="400" y="142" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">  // effect code</text>
    <text x="400" y="159" fill="#1e293b" font-family="monospace" font-size="10" text-anchor="middle">}, <tspan fill="#10b981" font-weight="600">[]</tspan>);</text>

    <line x1="305" y1="175" x2="495" y2="175" stroke="#e2e8f0" stroke-width="1"/>

    <text x="400" y="200" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Runs ONCE on mount</text>

    <!-- Timeline visualization -->
    <g transform="translate(305, 215)">
      <line x1="0" y1="15" x2="180" y2="15" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="0" cy="15" r="8" fill="#10b981"/>
      <circle cx="45" cy="15" r="8" fill="#e2e8f0" stroke="#cbd5e1"/>
      <circle cx="90" cy="15" r="8" fill="#e2e8f0" stroke="#cbd5e1"/>
      <circle cx="135" cy="15" r="8" fill="#e2e8f0" stroke="#cbd5e1"/>
      <circle cx="180" cy="15" r="8" fill="#e2e8f0" stroke="#cbd5e1"/>
      <text x="90" y="45" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Only first render</text>
    </g>

    <rect x="305" y="268" width="170" height="20" rx="4" fill="#dcfce7"/>
    <text x="390" y="282" fill="#166534" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">✓ Идеално за init/fetch</text>
  </g>

  <!-- Case 3: With Dependencies -->
  <g filter="url(#effectShadow)">
    <rect x="540" y="55" width="230" height="240" rx="12" fill="white" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="540" y="55" width="230" height="45" rx="12" fill="url(#effectBlue)"/>
    <rect x="540" y="88" width="230" height="12" fill="url(#effectBlue)"/>
    <text x="655" y="82" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">With Dependencies</text>

    <text x="655" y="125" fill="#1e293b" font-family="monospace" font-size="10" text-anchor="middle">useEffect(() =&gt; {</text>
    <text x="655" y="142" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">  // effect code</text>
    <text x="655" y="159" fill="#1e293b" font-family="monospace" font-size="10" text-anchor="middle">}, <tspan fill="#3b82f6" font-weight="600">[count, user]</tspan>);</text>

    <line x1="560" y1="175" x2="750" y2="175" stroke="#e2e8f0" stroke-width="1"/>

    <text x="655" y="200" fill="#2563eb" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Runs when deps change</text>

    <!-- Timeline visualization -->
    <g transform="translate(560, 215)">
      <line x1="0" y1="15" x2="180" y2="15" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="0" cy="15" r="8" fill="#3b82f6"/>
      <circle cx="45" cy="15" r="8" fill="#e2e8f0" stroke="#cbd5e1"/>
      <circle cx="90" cy="15" r="8" fill="#3b82f6"/>
      <circle cx="135" cy="15" r="8" fill="#e2e8f0" stroke="#cbd5e1"/>
      <circle cx="180" cy="15" r="8" fill="#3b82f6"/>
      <text x="90" y="45" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">When count/user changes</text>
    </g>

    <rect x="560" y="268" width="170" height="20" rx="4" fill="#dbeafe"/>
    <text x="645" y="282" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">✓ Реактивен на промени</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 305)">
    <circle cx="8" cy="8" r="6" fill="#10b981"/>
    <text x="22" y="12" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Effect runs</text>
    <circle cx="108" cy="8" r="6" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text x="122" y="12" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Effect skipped</text>
  </g>
</svg>
