<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="hookState" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="hookEffect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="hookRef" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="hookContext" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="hookCustom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="hookCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61dafb"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="hookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="hookGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Title -->
  <text x="400" y="35" fill="#1e293b" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">React Hooks Overview</text>

  <!-- Center React Logo -->
  <g transform="translate(400, 200)" filter="url(#hookGlow)">
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="#61dafb" stroke-width="2" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="#61dafb" stroke-width="2" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="#61dafb" stroke-width="2" transform="rotate(-60)"/>
    <circle cx="0" cy="0" r="10" fill="#61dafb"/>
  </g>

  <!-- Connecting lines -->
  <line x1="345" y1="200" x2="230" y2="120" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="345" y1="200" x2="230" y2="280" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="455" y1="200" x2="570" y2="120" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="455" y1="200" x2="570" y2="280" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="400" y1="145" x2="400" y2="80" stroke="#ec4899" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- useState Hook -->
  <g filter="url(#hookShadow)">
    <rect x="70" y="70" width="160" height="100" rx="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <rect x="70" y="70" width="160" height="35" rx="12" fill="url(#hookState)"/>
    <rect x="70" y="93" width="160" height="12" fill="url(#hookState)"/>
    <text x="150" y="95" fill="white" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle">useState</text>
    <text x="150" y="125" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Локално състояние</text>
    <text x="150" y="145" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">[value, setValue]</text>
    <text x="150" y="162" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Re-renders on change</text>
  </g>

  <!-- useEffect Hook -->
  <g filter="url(#hookShadow)">
    <rect x="70" y="230" width="160" height="100" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
    <rect x="70" y="230" width="160" height="35" rx="12" fill="url(#hookEffect)"/>
    <rect x="70" y="253" width="160" height="12" fill="url(#hookEffect)"/>
    <text x="150" y="255" fill="white" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle">useEffect</text>
    <text x="150" y="285" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Странични ефекти</text>
    <text x="150" y="305" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">fetch, timers, subs</text>
    <text x="150" y="322" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">After render</text>
  </g>

  <!-- useRef Hook -->
  <g filter="url(#hookShadow)">
    <rect x="570" y="70" width="160" height="100" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <rect x="570" y="70" width="160" height="35" rx="12" fill="url(#hookRef)"/>
    <rect x="570" y="93" width="160" height="12" fill="url(#hookRef)"/>
    <text x="650" y="95" fill="white" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle">useRef</text>
    <text x="650" y="125" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">DOM референции</text>
    <text x="650" y="145" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">ref.current</text>
    <text x="650" y="162" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">No re-render</text>
  </g>

  <!-- useContext Hook -->
  <g filter="url(#hookShadow)">
    <rect x="570" y="230" width="160" height="100" rx="12" fill="white" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="570" y="230" width="160" height="35" rx="12" fill="url(#hookContext)"/>
    <rect x="570" y="253" width="160" height="12" fill="url(#hookContext)"/>
    <text x="650" y="255" fill="white" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle">useContext</text>
    <text x="650" y="285" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Глобално състояние</text>
    <text x="650" y="305" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Избягва prop drilling</text>
    <text x="650" y="322" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Споделени данни</text>
  </g>

  <!-- Custom Hooks -->
  <g filter="url(#hookShadow)">
    <rect x="320" y="55" width="160" height="70" rx="12" fill="white" stroke="#ec4899" stroke-width="2"/>
    <rect x="320" y="55" width="160" height="30" rx="12" fill="url(#hookCustom)"/>
    <rect x="320" y="73" width="160" height="12" fill="url(#hookCustom)"/>
    <text x="400" y="77" fill="white" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">Custom Hooks</text>
    <text x="400" y="100" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Преизползваема логика</text>
    <text x="400" y="118" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">useFetch, useForm...</text>
  </g>

  <!-- Rules Box -->
  <rect x="250" y="340" width="300" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="400" y="362" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Rules of Hooks</text>
  <text x="400" y="380" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Само на top level • Само в React функции • Започват с "use"</text>
</svg>
