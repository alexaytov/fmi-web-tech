<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <linearGradient id="fetchLoading" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="fetchSuccess" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="fetchError" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="fetchInit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="fetchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <marker id="fetchArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" fill="#1e293b" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Data Fetching Pattern</text>

  <!-- Initial State -->
  <g filter="url(#fetchShadow)">
    <rect x="30" y="60" width="170" height="130" rx="10" fill="white" stroke="#6366f1" stroke-width="2"/>
    <rect x="30" y="60" width="170" height="35" rx="10" fill="url(#fetchInit)"/>
    <rect x="30" y="83" width="170" height="12" fill="url(#fetchInit)"/>
    <text x="115" y="82" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Initial State</text>

    <text x="115" y="115" fill="#1e293b" font-family="monospace" font-size="9" text-anchor="middle">data: null</text>
    <text x="115" y="132" fill="#1e293b" font-family="monospace" font-size="9" text-anchor="middle">loading: true</text>
    <text x="115" y="149" fill="#1e293b" font-family="monospace" font-size="9" text-anchor="middle">error: null</text>

    <text x="115" y="175" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Component mounts</text>
  </g>

  <!-- Arrow to Fetching -->
  <line x1="205" y1="125" x2="255" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#fetchArrow)"/>
  <text x="230" y="115" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">fetch()</text>

  <!-- Loading State -->
  <g filter="url(#fetchShadow)">
    <rect x="265" y="60" width="170" height="130" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <rect x="265" y="60" width="170" height="35" rx="10" fill="url(#fetchLoading)"/>
    <rect x="265" y="83" width="170" height="12" fill="url(#fetchLoading)"/>
    <text x="350" y="82" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Loading</text>

    <!-- Spinner animation representation -->
    <g transform="translate(350, 120)">
      <circle cx="0" cy="0" r="15" fill="none" stroke="#fef3c7" stroke-width="3"/>
      <path d="M 0 -15 A 15 15 0 0 1 15 0" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="350" y="155" fill="#92400e" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Зареждане...</text>
    <text x="350" y="175" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Показва spinner</text>
  </g>

  <!-- Arrows to outcomes -->
  <path d="M 440 100 Q 490 100, 520 80" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#fetchArrow)"/>
  <path d="M 440 150 Q 490 150, 520 170" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#fetchArrow)"/>

  <text x="480" y="75" fill="#10b981" font-family="system-ui, sans-serif" font-size="9">Success</text>
  <text x="480" y="175" fill="#ef4444" font-family="system-ui, sans-serif" font-size="9">Error</text>

  <!-- Success State -->
  <g filter="url(#fetchShadow)">
    <rect x="530" y="20" width="240" height="130" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
    <rect x="530" y="20" width="240" height="35" rx="10" fill="url(#fetchSuccess)"/>
    <rect x="530" y="43" width="240" height="12" fill="url(#fetchSuccess)"/>
    <text x="650" y="42" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Success</text>

    <text x="650" y="72" fill="#1e293b" font-family="monospace" font-size="9" text-anchor="middle">data: [...products]</text>
    <text x="650" y="89" fill="#1e293b" font-family="monospace" font-size="9" text-anchor="middle">loading: false</text>
    <text x="650" y="106" fill="#1e293b" font-family="monospace" font-size="9" text-anchor="middle">error: null</text>

    <!-- Data representation -->
    <rect x="560" y="115" width="180" height="25" rx="4" fill="#dcfce7"/>
    <text x="650" y="132" fill="#166534" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Render списък с данни</text>
  </g>

  <!-- Error State -->
  <g filter="url(#fetchShadow)">
    <rect x="530" y="170" width="240" height="130" rx="10" fill="white" stroke="#ef4444" stroke-width="2"/>
    <rect x="530" y="170" width="240" height="35" rx="10" fill="url(#fetchError)"/>
    <rect x="530" y="193" width="240" height="12" fill="url(#fetchError)"/>
    <text x="650" y="192" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Error</text>

    <text x="650" y="222" fill="#1e293b" font-family="monospace" font-size="9" text-anchor="middle">data: null</text>
    <text x="650" y="239" fill="#1e293b" font-family="monospace" font-size="9" text-anchor="middle">loading: false</text>
    <text x="650" y="256" fill="#1e293b" font-family="monospace" font-size="9" text-anchor="middle">error: "Network Error"</text>

    <!-- Error representation -->
    <rect x="560" y="265" width="180" height="25" rx="4" fill="#fef2f2"/>
    <text x="650" y="282" fill="#dc2626" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Покажи съобщение за грешка</text>
  </g>

  <!-- Code pattern box -->
  <g filter="url(#fetchShadow)">
    <rect x="30" y="220" width="420" height="150" rx="8" fill="#1e1e2e"/>
    <text x="50" y="245" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Pattern Implementation:</text>

    <g font-family="monospace" font-size="9">
      <text x="50" y="268" fill="#c792ea">if</text>
      <text x="65" y="268" fill="#a6accd"> (loading) </text>
      <text x="128" y="268" fill="#c792ea">return</text>
      <text x="170" y="268" fill="#89ddff"> &lt;</text>
      <text x="178" y="268" fill="#f07178">Spinner</text>
      <text x="225" y="268" fill="#89ddff"> /&gt;</text>
      <text x="240" y="268" fill="#a6accd">;</text>

      <text x="50" y="290" fill="#c792ea">if</text>
      <text x="65" y="290" fill="#a6accd"> (error) </text>
      <text x="115" y="290" fill="#c792ea">return</text>
      <text x="157" y="290" fill="#89ddff"> &lt;</text>
      <text x="165" y="290" fill="#f07178">Error</text>
      <text x="195" y="290" fill="#ffcb6b"> msg</text>
      <text x="220" y="290" fill="#89ddff">=</text>
      <text x="228" y="290" fill="#a6accd">{</text>
      <text x="236" y="290" fill="#82aaff">error</text>
      <text x="265" y="290" fill="#a6accd">}</text>
      <text x="273" y="290" fill="#89ddff"> /&gt;</text>
      <text x="288" y="290" fill="#a6accd">;</text>

      <text x="50" y="318" fill="#c792ea">return</text>
      <text x="92" y="318" fill="#89ddff"> &lt;</text>
      <text x="100" y="318" fill="#f07178">DataList</text>
      <text x="160" y="318" fill="#ffcb6b"> items</text>
      <text x="195" y="318" fill="#89ddff">=</text>
      <text x="203" y="318" fill="#a6accd">{</text>
      <text x="211" y="318" fill="#82aaff">data</text>
      <text x="235" y="318" fill="#a6accd">}</text>
      <text x="243" y="318" fill="#89ddff"> /&gt;</text>
      <text x="258" y="318" fill="#a6accd">;</text>

      <text x="50" y="345" fill="#676e95">// Conditional rendering based on state</text>
    </g>
  </g>

  <!-- Bottom note -->
  <text x="400" y="375" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Тристепенен pattern: Loading → Success/Error - покрива всички възможни състояния</text>
</svg>
