<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <defs>
    <linearGradient id="stateBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="stateGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="statePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="stateOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="stateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <marker id="stateArrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="stateArrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" fill="#1e293b" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">useState: Цикъл на обновяване</text>

  <!-- Step 1: Initial State -->
  <g filter="url(#stateShadow)">
    <rect x="50" y="60" width="180" height="80" rx="10" fill="url(#stateBlue)"/>
    <text x="140" y="90" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">1. Initial Render</text>
    <text x="140" y="112" fill="rgba(255,255,255,0.9)" font-family="monospace" font-size="10" text-anchor="middle">useState(0)</text>
    <text x="140" y="130" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">count = 0</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 235 100 Q 290 100, 290 150 Q 290 200, 260 200" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#stateArrowBlue)"/>
  <text x="300" y="150" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Render</text>

  <!-- Step 2: UI Display -->
  <g filter="url(#stateShadow)">
    <rect x="50" y="170" width="200" height="90" rx="10" fill="url(#stateGreen)"/>
    <text x="150" y="198" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">2. UI Display</text>
    <rect x="70" y="210" width="160" height="35" rx="6" fill="rgba(255,255,255,0.2)"/>
    <text x="150" y="232" fill="white" font-family="monospace" font-size="11" text-anchor="middle">Count: 0  [+]</text>
  </g>

  <!-- Step 3: User Action -->
  <g filter="url(#stateShadow)">
    <rect x="50" y="290" width="200" height="70" rx="10" fill="url(#stateOrange)"/>
    <text x="150" y="318" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">3. User Click</text>
    <text x="150" y="340" fill="rgba(255,255,255,0.9)" font-family="monospace" font-size="10" text-anchor="middle">onClick={increment}</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="150" y1="265" x2="150" y2="285" stroke="#64748b" stroke-width="2" marker-end="url(#stateArrowGreen)"/>

  <!-- Step 4: setState called -->
  <g filter="url(#stateShadow)">
    <rect x="320" y="290" width="200" height="70" rx="10" fill="url(#statePurple)"/>
    <text x="420" y="318" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">4. State Update</text>
    <text x="420" y="340" fill="rgba(255,255,255,0.9)" font-family="monospace" font-size="10" text-anchor="middle">setCount(prev => prev+1)</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="255" y1="325" x2="315" y2="325" stroke="#64748b" stroke-width="2" marker-end="url(#stateArrowGreen)"/>

  <!-- Step 5: Re-render -->
  <g filter="url(#stateShadow)">
    <rect x="470" y="60" width="180" height="80" rx="10" fill="url(#stateBlue)"/>
    <text x="560" y="90" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">5. Re-render</text>
    <text x="560" y="112" fill="rgba(255,255,255,0.9)" font-family="monospace" font-size="10" text-anchor="middle">React обновява</text>
    <text x="560" y="130" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">count = 1</text>
  </g>

  <!-- Arrow 4 to 5 (curved) -->
  <path d="M 520 290 Q 600 290, 600 200 Q 600 145, 560 145" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="560,145 570,140 570,150" fill="#8b5cf6"/>
  <text x="620" y="220" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Triggers</text>
  <text x="620" y="232" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Re-render</text>

  <!-- New UI Display -->
  <g filter="url(#stateShadow)">
    <rect x="450" y="170" width="200" height="90" rx="10" fill="url(#stateGreen)"/>
    <text x="550" y="198" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">6. Updated UI</text>
    <rect x="470" y="210" width="160" height="35" rx="6" fill="rgba(255,255,255,0.2)"/>
    <text x="550" y="232" fill="white" font-family="monospace" font-size="11" text-anchor="middle">Count: 1  [+]</text>
  </g>

  <!-- Arrow 5 to 6 -->
  <line x1="560" y1="145" x2="560" y2="165" stroke="#3b82f6" stroke-width="2" marker-end="url(#stateArrowBlue)"/>

  <!-- Center cycle indicator -->
  <g transform="translate(320, 170)">
    <circle cx="35" cy="35" r="35" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="35" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">React</text>
    <text x="35" y="46" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Cycle</text>
  </g>

  <!-- Bottom note -->
  <text x="350" y="375" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">setState() предизвиква re-render → UI винаги отразява текущото състояние</text>
</svg>
