<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 350">
  <defs>
    <linearGradient id="keyGood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="keyBad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="keyItem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="keyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="375" y="30" fill="#1e293b" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Keys в List Rendering</text>
  <text x="375" y="50" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Защо уникалните keys са важни за React</text>

  <!-- Bad Example - Using Index -->
  <g filter="url(#keyShadow)">
    <rect x="40" y="70" width="320" height="260" rx="12" fill="white" stroke="#ef4444" stroke-width="2"/>
    <rect x="40" y="70" width="320" height="40" rx="12" fill="url(#keyBad)"/>
    <rect x="40" y="98" width="320" height="12" fill="url(#keyBad)"/>
    <text x="200" y="97" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">❌ Лош подход: key={index}</text>

    <!-- Code snippet -->
    <rect x="55" y="120" width="290" height="45" rx="6" fill="#1e1e2e"/>
    <text x="200" y="140" fill="#a6accd" font-family="monospace" font-size="9" text-anchor="middle">{items.map((item, <tspan fill="#ef4444">index</tspan>) =&gt;</text>
    <text x="200" y="155" fill="#a6accd" font-family="monospace" font-size="9" text-anchor="middle">  &lt;Item key={<tspan fill="#ef4444">index</tspan>} /&gt;)}</text>

    <!-- Before state -->
    <text x="110" y="185" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Before Delete</text>
    <rect x="60" y="195" width="100" height="25" rx="4" fill="url(#keyItem)"/>
    <text x="110" y="212" fill="white" font-family="monospace" font-size="9" text-anchor="middle">key=0: A</text>
    <rect x="60" y="225" width="100" height="25" rx="4" fill="#fecaca" stroke="#ef4444"/>
    <text x="110" y="242" fill="#dc2626" font-family="monospace" font-size="9" text-anchor="middle">key=1: B ←delete</text>
    <rect x="60" y="255" width="100" height="25" rx="4" fill="url(#keyItem)"/>
    <text x="110" y="272" fill="white" font-family="monospace" font-size="9" text-anchor="middle">key=2: C</text>

    <!-- After state -->
    <text x="290" y="185" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">After Delete</text>
    <rect x="240" y="195" width="100" height="25" rx="4" fill="url(#keyItem)"/>
    <text x="290" y="212" fill="white" font-family="monospace" font-size="9" text-anchor="middle">key=0: A</text>
    <rect x="240" y="225" width="100" height="25" rx="4" fill="#fecaca" stroke="#ef4444"/>
    <text x="290" y="242" fill="#dc2626" font-family="monospace" font-size="9" text-anchor="middle">key=1: C ⚠️</text>

    <!-- Arrow -->
    <line x1="168" y1="240" x2="232" y2="240" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- Problem explanation -->
    <rect x="55" y="290" width="290" height="30" rx="4" fill="#fef2f2"/>
    <text x="200" y="310" fill="#dc2626" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">C получава key=1 (старият B key) → React обърква елементите!</text>
  </g>

  <!-- Good Example - Using Unique ID -->
  <g filter="url(#keyShadow)">
    <rect x="390" y="70" width="320" height="260" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
    <rect x="390" y="70" width="320" height="40" rx="12" fill="url(#keyGood)"/>
    <rect x="390" y="98" width="320" height="12" fill="url(#keyGood)"/>
    <text x="550" y="97" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">✓ Добър подход: key={item.id}</text>

    <!-- Code snippet -->
    <rect x="405" y="120" width="290" height="45" rx="6" fill="#1e1e2e"/>
    <text x="550" y="140" fill="#a6accd" font-family="monospace" font-size="9" text-anchor="middle">{items.map(item =&gt;</text>
    <text x="550" y="155" fill="#a6accd" font-family="monospace" font-size="9" text-anchor="middle">  &lt;Item key={<tspan fill="#10b981">item.id</tspan>} /&gt;)}</text>

    <!-- Before state -->
    <text x="460" y="185" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Before Delete</text>
    <rect x="410" y="195" width="100" height="25" rx="4" fill="url(#keyItem)"/>
    <text x="460" y="212" fill="white" font-family="monospace" font-size="9" text-anchor="middle">id=1: A</text>
    <rect x="410" y="225" width="100" height="25" rx="4" fill="#fecaca" stroke="#ef4444"/>
    <text x="460" y="242" fill="#dc2626" font-family="monospace" font-size="9" text-anchor="middle">id=2: B ←delete</text>
    <rect x="410" y="255" width="100" height="25" rx="4" fill="url(#keyItem)"/>
    <text x="460" y="272" fill="white" font-family="monospace" font-size="9" text-anchor="middle">id=3: C</text>

    <!-- After state -->
    <text x="640" y="185" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">After Delete</text>
    <rect x="590" y="195" width="100" height="25" rx="4" fill="url(#keyItem)"/>
    <text x="640" y="212" fill="white" font-family="monospace" font-size="9" text-anchor="middle">id=1: A</text>
    <rect x="590" y="240" width="100" height="25" rx="4" fill="url(#keyItem)"/>
    <text x="640" y="257" fill="white" font-family="monospace" font-size="9" text-anchor="middle">id=3: C ✓</text>

    <!-- Arrow -->
    <line x1="518" y1="240" x2="582" y2="240" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- Correct explanation -->
    <rect x="405" y="290" width="290" height="30" rx="4" fill="#dcfce7"/>
    <text x="550" y="310" fill="#166534" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">C запазва key=3 → React знае точно кой елемент да премахне</text>
  </g>

  <!-- Bottom note -->
  <text x="375" y="345" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Keys помагат на React да идентифицира елементи при add/remove/reorder операции</text>
</svg>
