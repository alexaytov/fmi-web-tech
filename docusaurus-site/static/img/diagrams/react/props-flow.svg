<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <defs>
    <linearGradient id="propsParent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="propsChild" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="propsGrandchild" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="propsArrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="propsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <marker id="propsArrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" fill="#1e293b" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Unidirectional Data Flow: Props</text>

  <!-- Parent Component -->
  <g filter="url(#propsShadow)">
    <rect x="250" y="55" width="200" height="70" rx="10" fill="url(#propsParent)"/>
    <text x="350" y="82" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">App (Parent)</text>
    <text x="350" y="102" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="10" text-anchor="middle">state: { user, theme }</text>
    <text x="350" y="118" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Управлява данните</text>
  </g>

  <!-- Arrows from Parent to Children -->
  <line x1="300" y1="125" x2="170" y2="175" stroke="#f59e0b" stroke-width="3" marker-end="url(#propsArrow)"/>
  <line x1="400" y1="125" x2="530" y2="175" stroke="#f59e0b" stroke-width="3" marker-end="url(#propsArrow)"/>

  <!-- Props labels -->
  <rect x="195" y="140" width="85" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="237" y="155" fill="#92400e" font-family="monospace" font-size="9" text-anchor="middle">user={user}</text>

  <rect x="420" y="140" width="100" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="470" y="155" fill="#92400e" font-family="monospace" font-size="9" text-anchor="middle">theme={theme}</text>

  <!-- Child Component 1 -->
  <g filter="url(#propsShadow)">
    <rect x="50" y="180" width="200" height="70" rx="10" fill="url(#propsChild)"/>
    <text x="150" y="207" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">UserProfile (Child)</text>
    <text x="150" y="227" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="10" text-anchor="middle">props: { user }</text>
    <text x="150" y="243" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Показва user данни</text>
  </g>

  <!-- Child Component 2 -->
  <g filter="url(#propsShadow)">
    <rect x="450" y="180" width="200" height="70" rx="10" fill="url(#propsChild)"/>
    <text x="550" y="207" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Settings (Child)</text>
    <text x="550" y="227" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="10" text-anchor="middle">props: { theme }</text>
    <text x="550" y="243" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Показва настройки</text>
  </g>

  <!-- Arrow from Child 1 to Grandchild -->
  <line x1="150" y1="250" x2="150" y2="290" stroke="#f59e0b" stroke-width="3" marker-end="url(#propsArrow)"/>

  <rect x="85" y="260" width="130" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="150" y="275" fill="#92400e" font-family="monospace" font-size="9" text-anchor="middle">name={user.name}</text>

  <!-- Grandchild Component -->
  <g filter="url(#propsShadow)">
    <rect x="50" y="295" width="200" height="50" rx="10" fill="url(#propsGrandchild)"/>
    <text x="150" y="318" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Avatar (Grandchild)</text>
    <text x="150" y="336" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="9" text-anchor="middle">props: { name }</text>
  </g>

  <!-- Key insight box -->
  <rect x="380" y="275" width="280" height="70" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="520" y="298" fill="#dc2626" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Props са Read-Only!</text>
  <text x="520" y="316" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Дъщерните компоненти НЕ могат</text>
  <text x="520" y="332" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">да променят props</text>

  <!-- Flow direction indicator -->
  <g transform="translate(620, 100)">
    <rect x="0" y="0" width="60" height="80" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="30" y="25" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Data</text>
    <text x="30" y="40" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Flow</text>
    <polygon points="30,50 20,65 40,65" fill="#f59e0b"/>
    <text x="30" y="78" fill="#92400e" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">DOWN</text>
  </g>
</svg>
