<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="vdomBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="vdomGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="vdomOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="vdomPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="vdomShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <marker id="vdomArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="35" fill="#1e293b" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Virtual DOM: Ефективни UI обновявания</text>

  <!-- Step 1: State Change -->
  <g filter="url(#vdomShadow)">
    <rect x="30" y="70" width="160" height="80" rx="10" fill="url(#vdomBlue)"/>
    <text x="110" y="100" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">1. State Change</text>
    <text x="110" y="120" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="10" text-anchor="middle">setState(newValue)</text>
    <text x="110" y="138" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Промяна в данните</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="200" y1="110" x2="240" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#vdomArrow)"/>

  <!-- Step 2: New Virtual DOM -->
  <g filter="url(#vdomShadow)">
    <rect x="250" y="70" width="160" height="80" rx="10" fill="url(#vdomGreen)"/>
    <text x="330" y="100" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">2. New VDOM</text>
    <text x="330" y="120" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">React създава нов</text>
    <text x="330" y="138" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Virtual DOM tree</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="420" y1="110" x2="460" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#vdomArrow)"/>

  <!-- Step 3: Diffing -->
  <g filter="url(#vdomShadow)">
    <rect x="470" y="70" width="160" height="80" rx="10" fill="url(#vdomOrange)"/>
    <text x="550" y="100" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">3. Diffing</text>
    <text x="550" y="120" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Сравнява стар/нов</text>
    <text x="550" y="138" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Намира разликите</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="640" y1="110" x2="680" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#vdomArrow)"/>

  <!-- Step 4: Patch -->
  <g filter="url(#vdomShadow)">
    <rect x="690" y="70" width="90" height="80" rx="10" fill="url(#vdomPurple)"/>
    <text x="735" y="100" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">4. Patch</text>
    <text x="735" y="118" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Минимални</text>
    <text x="735" y="132" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">DOM updates</text>
  </g>

  <!-- Virtual DOM Trees Visualization -->
  <!-- Old VDOM -->
  <g transform="translate(80, 200)">
    <text x="80" y="0" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Old Virtual DOM</text>
    <rect x="50" y="15" width="60" height="25" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="80" y="32" fill="#475569" font-family="monospace" font-size="9" text-anchor="middle">div</text>
    <line x1="80" y1="40" x2="50" y2="60" stroke="#94a3b8" stroke-width="1"/>
    <line x1="80" y1="40" x2="110" y2="60" stroke="#94a3b8" stroke-width="1"/>
    <rect x="20" y="60" width="60" height="25" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="50" y="77" fill="#475569" font-family="monospace" font-size="9" text-anchor="middle">h1</text>
    <rect x="85" y="60" width="60" height="25" rx="4" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    <text x="115" y="77" fill="#dc2626" font-family="monospace" font-size="9" text-anchor="middle">p: "old"</text>
  </g>

  <!-- New VDOM -->
  <g transform="translate(300, 200)">
    <text x="80" y="0" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">New Virtual DOM</text>
    <rect x="50" y="15" width="60" height="25" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="80" y="32" fill="#475569" font-family="monospace" font-size="9" text-anchor="middle">div</text>
    <line x1="80" y1="40" x2="50" y2="60" stroke="#94a3b8" stroke-width="1"/>
    <line x1="80" y1="40" x2="110" y2="60" stroke="#94a3b8" stroke-width="1"/>
    <rect x="20" y="60" width="60" height="25" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="50" y="77" fill="#475569" font-family="monospace" font-size="9" text-anchor="middle">h1</text>
    <rect x="85" y="60" width="60" height="25" rx="4" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/>
    <text x="115" y="77" fill="#16a34a" font-family="monospace" font-size="9" text-anchor="middle">p: "new"</text>
  </g>

  <!-- Diff arrow -->
  <g transform="translate(460, 250)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5,3"/>
    <text x="30" y="-10" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">DIFF</text>
  </g>

  <!-- Real DOM -->
  <g transform="translate(560, 200)">
    <text x="100" y="0" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Real DOM</text>
    <rect x="40" y="15" width="120" height="90" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="40" fill="#92400e" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Browser DOM</text>
    <rect x="55" y="50" width="90" height="25" rx="4" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/>
    <text x="100" y="67" fill="#16a34a" font-family="monospace" font-size="9" text-anchor="middle">Only p updated!</text>
    <text x="100" y="95" fill="#78716c" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Minimal change</text>
  </g>

  <!-- Bottom description -->
  <text x="400" y="380" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Virtual DOM позволява на React да минимизира скъпите DOM операции</text>
</svg>
