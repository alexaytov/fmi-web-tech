<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 300">
  <defs>
    <linearGradient id="jsxPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="jsxYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="jsxCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="jsxCodeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <filter id="jsxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <marker id="jsxArrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="375" y="30" fill="#1e293b" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">JSX Трансформация</text>

  <!-- JSX Code Block -->
  <g filter="url(#jsxShadow)">
    <rect x="30" y="55" width="280" height="180" rx="10" fill="url(#jsxCodeBg)"/>
    <rect x="30" y="55" width="280" height="30" rx="10" fill="#ec4899"/>
    <rect x="30" y="73" width="280" height="12" fill="#ec4899"/>
    <text x="170" y="75" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">JSX Syntax</text>

    <g font-family="monospace" font-size="11">
      <text x="50" y="115" fill="#89ddff">&lt;</text>
      <text x="58" y="115" fill="#f07178">div</text>
      <text x="82" y="115" fill="#ffcb6b"> className</text>
      <text x="152" y="115" fill="#89ddff">=</text>
      <text x="160" y="115" fill="#c3e88d">"card"</text>
      <text x="200" y="115" fill="#89ddff">&gt;</text>

      <text x="60" y="140" fill="#89ddff">&lt;</text>
      <text x="68" y="140" fill="#f07178">h1</text>
      <text x="85" y="140" fill="#89ddff">&gt;</text>
      <text x="93" y="140" fill="#a6accd">{</text>
      <text x="102" y="140" fill="#82aaff">title</text>
      <text x="130" y="140" fill="#a6accd">}</text>
      <text x="138" y="140" fill="#89ddff">&lt;/</text>
      <text x="152" y="140" fill="#f07178">h1</text>
      <text x="168" y="140" fill="#89ddff">&gt;</text>

      <text x="60" y="165" fill="#89ddff">&lt;</text>
      <text x="68" y="165" fill="#f07178">p</text>
      <text x="78" y="165" fill="#89ddff">&gt;</text>
      <text x="86" y="165" fill="#a6accd">{</text>
      <text x="95" y="165" fill="#82aaff">text</text>
      <text x="120" y="165" fill="#a6accd">}</text>
      <text x="128" y="165" fill="#89ddff">&lt;/</text>
      <text x="142" y="165" fill="#f07178">p</text>
      <text x="152" y="165" fill="#89ddff">&gt;</text>

      <text x="50" y="190" fill="#89ddff">&lt;/</text>
      <text x="62" y="190" fill="#f07178">div</text>
      <text x="86" y="190" fill="#89ddff">&gt;</text>
    </g>

    <text x="170" y="225" fill="#a6accd" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">HTML-подобен синтаксис</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(320, 130)">
    <rect x="0" y="0" width="110" height="50" rx="8" fill="url(#jsxYellow)"/>
    <text x="55" y="22" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Babel/SWC</text>
    <text x="55" y="38" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Transpile</text>
    <polygon points="105,25 120,25 120,20 135,28 120,36 120,31 105,31" fill="#f59e0b"/>
  </g>

  <!-- JavaScript Code Block -->
  <g filter="url(#jsxShadow)">
    <rect x="440" y="55" width="280" height="220" rx="10" fill="url(#jsxCodeBg)"/>
    <rect x="440" y="55" width="280" height="30" rx="10" fill="url(#jsxCyan)"/>
    <rect x="440" y="73" width="280" height="12" fill="url(#jsxCyan)"/>
    <text x="580" y="75" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">JavaScript Output</text>

    <g font-family="monospace" font-size="10">
      <text x="460" y="105" fill="#82aaff">React</text>
      <text x="500" y="105" fill="#a6accd">.</text>
      <text x="505" y="105" fill="#ffcb6b">createElement</text>
      <text x="590" y="105" fill="#a6accd">(</text>

      <text x="470" y="125" fill="#c3e88d">'div'</text>
      <text x="500" y="125" fill="#a6accd">,</text>

      <text x="470" y="145" fill="#a6accd">{ </text>
      <text x="485" y="145" fill="#f78c6c">className</text>
      <text x="545" y="145" fill="#a6accd">:</text>
      <text x="555" y="145" fill="#c3e88d"> 'card'</text>
      <text x="595" y="145" fill="#a6accd"> },</text>

      <text x="470" y="170" fill="#82aaff">React</text>
      <text x="505" y="170" fill="#a6accd">.</text>
      <text x="510" y="170" fill="#ffcb6b">createElement</text>
      <text x="590" y="170" fill="#a6accd">(</text>
      <text x="598" y="170" fill="#c3e88d">'h1'</text>
      <text x="620" y="170" fill="#a6accd">,</text>
      <text x="628" y="170" fill="#f78c6c"> null</text>
      <text x="655" y="170" fill="#a6accd">,</text>
      <text x="663" y="170" fill="#82aaff"> title</text>
      <text x="695" y="170" fill="#a6accd">),</text>

      <text x="470" y="195" fill="#82aaff">React</text>
      <text x="505" y="195" fill="#a6accd">.</text>
      <text x="510" y="195" fill="#ffcb6b">createElement</text>
      <text x="590" y="195" fill="#a6accd">(</text>
      <text x="598" y="195" fill="#c3e88d">'p'</text>
      <text x="615" y="195" fill="#a6accd">,</text>
      <text x="623" y="195" fill="#f78c6c"> null</text>
      <text x="650" y="195" fill="#a6accd">,</text>
      <text x="658" y="195" fill="#82aaff"> text</text>
      <text x="685" y="195" fill="#a6accd">)</text>

      <text x="460" y="220" fill="#a6accd">)</text>
    </g>

    <text x="580" y="260" fill="#a6accd" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Истински JavaScript за браузъра</text>
  </g>

  <!-- Bottom explanation -->
  <text x="375" y="295" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">JSX е syntactic sugar - прави кода по-четим, но се компилира до createElement() извиквания</text>
</svg>
