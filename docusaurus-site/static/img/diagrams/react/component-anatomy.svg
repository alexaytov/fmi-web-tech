<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420">
  <defs>
    <linearGradient id="compCodeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="compAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61dafb"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="compGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="375" y="30" fill="#1e293b" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Анатомия на React Компонент</text>

  <!-- Code Block -->
  <g filter="url(#compGlow)">
    <rect x="30" y="50" width="420" height="340" rx="10" fill="url(#compCodeBg)"/>
    <!-- Window dots -->
    <circle cx="50" cy="68" r="6" fill="#ff5f56"/>
    <circle cx="70" cy="68" r="6" fill="#ffbd2e"/>
    <circle cx="90" cy="68" r="6" fill="#27c93f"/>

    <!-- Code lines -->
    <g font-family="monospace" font-size="12">
      <!-- Import -->
      <text x="50" y="105" fill="#c792ea">import</text>
      <text x="100" y="105" fill="#82aaff"> React, { useState }</text>
      <text x="270" y="105" fill="#c792ea"> from</text>
      <text x="305" y="105" fill="#c3e88d"> 'react'</text>
      <text x="360" y="105" fill="#a6accd">;</text>

      <!-- Function declaration -->
      <text x="50" y="135" fill="#c792ea">function</text>
      <text x="110" y="135" fill="#82aaff"> Counter</text>
      <text x="172" y="135" fill="#a6accd">(</text>
      <text x="180" y="135" fill="#f78c6c">{ initialCount }</text>
      <text x="285" y="135" fill="#a6accd">) {</text>

      <!-- useState -->
      <text x="70" y="165" fill="#c792ea">const</text>
      <text x="110" y="165" fill="#a6accd"> [</text>
      <text x="122" y="165" fill="#82aaff">count</text>
      <text x="160" y="165" fill="#a6accd">,</text>
      <text x="170" y="165" fill="#82aaff"> setCount</text>
      <text x="240" y="165" fill="#a6accd">] =</text>
      <text x="260" y="165" fill="#ffcb6b"> useState</text>
      <text x="330" y="165" fill="#a6accd">(</text>
      <text x="338" y="165" fill="#f78c6c">initialCount</text>
      <text x="418" y="165" fill="#a6accd">);</text>

      <!-- Handler function -->
      <text x="70" y="200" fill="#c792ea">const</text>
      <text x="110" y="200" fill="#82aaff"> increment</text>
      <text x="185" y="200" fill="#a6accd"> = () =></text>
      <text x="250" y="200" fill="#ffcb6b"> setCount</text>
      <text x="318" y="200" fill="#a6accd">(</text>
      <text x="326" y="200" fill="#82aaff">c</text>
      <text x="340" y="200" fill="#89ddff"> =></text>
      <text x="370" y="200" fill="#82aaff"> c</text>
      <text x="382" y="200" fill="#89ddff"> +</text>
      <text x="400" y="200" fill="#f78c6c"> 1</text>
      <text x="410" y="200" fill="#a6accd">);</text>

      <!-- Return -->
      <text x="70" y="235" fill="#c792ea">return</text>
      <text x="115" y="235" fill="#a6accd"> (</text>

      <!-- JSX -->
      <text x="90" y="265" fill="#89ddff">&lt;</text>
      <text x="100" y="265" fill="#f07178">div</text>
      <text x="125" y="265" fill="#89ddff">&gt;</text>

      <text x="110" y="290" fill="#89ddff">&lt;</text>
      <text x="120" y="290" fill="#f07178">p</text>
      <text x="130" y="290" fill="#89ddff">&gt;</text>
      <text x="140" y="290" fill="#a6accd">Count: {</text>
      <text x="200" y="290" fill="#82aaff">count</text>
      <text x="240" y="290" fill="#a6accd">}</text>
      <text x="250" y="290" fill="#89ddff">&lt;/</text>
      <text x="268" y="290" fill="#f07178">p</text>
      <text x="278" y="290" fill="#89ddff">&gt;</text>

      <text x="110" y="315" fill="#89ddff">&lt;</text>
      <text x="120" y="315" fill="#f07178">button</text>
      <text x="170" y="315" fill="#ffcb6b"> onClick</text>
      <text x="225" y="315" fill="#89ddff">=</text>
      <text x="235" y="315" fill="#a6accd">{</text>
      <text x="243" y="315" fill="#82aaff">increment</text>
      <text x="310" y="315" fill="#a6accd">}</text>
      <text x="320" y="315" fill="#89ddff">&gt;</text>
      <text x="330" y="315" fill="#a6accd">+1</text>
      <text x="350" y="315" fill="#89ddff">&lt;/</text>
      <text x="368" y="315" fill="#f07178">button</text>
      <text x="418" y="315" fill="#89ddff">&gt;</text>

      <text x="90" y="340" fill="#89ddff">&lt;/</text>
      <text x="105" y="340" fill="#f07178">div</text>
      <text x="130" y="340" fill="#89ddff">&gt;</text>

      <text x="70" y="365" fill="#a6accd">);</text>
      <text x="50" y="380" fill="#a6accd">}</text>
    </g>
  </g>

  <!-- Annotations -->
  <!-- Props annotation -->
  <g>
    <line x1="285" y1="135" x2="480" y2="100" stroke="#61dafb" stroke-width="2"/>
    <rect x="480" y="80" width="120" height="40" rx="6" fill="#e0f2fe" stroke="#61dafb" stroke-width="2"/>
    <text x="540" y="96" fill="#0369a1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Props</text>
    <text x="540" y="112" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Входни данни</text>
  </g>

  <!-- State annotation -->
  <g>
    <line x1="430" y1="165" x2="530" y2="165" stroke="#22c55e" stroke-width="2"/>
    <rect x="530" y="145" width="120" height="40" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="590" y="161" fill="#166534" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">State</text>
    <text x="590" y="177" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Вътрешни данни</text>
  </g>

  <!-- Handler annotation -->
  <g>
    <line x1="422" y1="200" x2="530" y2="230" stroke="#f59e0b" stroke-width="2"/>
    <rect x="530" y="210" width="130" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="595" y="226" fill="#92400e" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Event Handler</text>
    <text x="595" y="242" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Реакция на събития</text>
  </g>

  <!-- JSX annotation -->
  <g>
    <line x1="430" y1="290" x2="530" y2="320" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="530" y="300" width="150" height="50" rx="6" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="605" y="318" fill="#6b21a8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">JSX Return</text>
    <text x="605" y="334" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">UI описание</text>
    <text x="605" y="346" fill="#64748b" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">(компилира се до createElement)</text>
  </g>

  <!-- Bottom note -->
  <text x="375" y="410" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Функционален компонент = JavaScript функция, която връща JSX</text>
</svg>
