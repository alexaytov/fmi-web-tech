<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#4F46E5"/>

  <!-- Open book -->
  <g transform="translate(50, 55)">
    <!-- Left page -->
    <path d="M-5 -15 Q-20 -12 -30 -5 L-30 15 Q-20 10 -5 12 Z" fill="#fff"/>
    <!-- Right page -->
    <path d="M5 -15 Q20 -12 30 -5 L30 15 Q20 10 5 12 Z" fill="#fff"/>
    <!-- Spine -->
    <path d="M-5 -15 L-5 12 L0 14 L5 12 L5 -15 L0 -17 Z" fill="#E0E7FF"/>
    <!-- Page lines left -->
    <line x1="-25" y1="0" x2="-10" y2="-2" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="-25" y1="5" x2="-10" y2="3" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Page lines right -->
    <line x1="25" y1="0" x2="10" y2="-2" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="25" y1="5" x2="10" y2="3" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>

  <!-- Graduation cap -->
  <g transform="translate(50, 28)">
    <!-- Cap top -->
    <polygon points="0,-12 25,0 0,6 -25,0" fill="#1E1B4B"/>
    <!-- Tassel string -->
    <line x1="0" y1="-12" x2="18" y2="-8" stroke="#FCD34D" stroke-width="2"/>
    <!-- Tassel -->
    <circle cx="18" cy="-6" r="3" fill="#FCD34D"/>
    <path d="M15 -3 Q18 8 21 -3" fill="#FCD34D"/>
  </g>

  <!-- Sparkles -->
  <circle cx="75" cy="25" r="2" fill="#FCD34D"/>
  <circle cx="25" cy="30" r="1.5" fill="#FCD34D"/>
  <circle cx="80" cy="70" r="1.5" fill="#FCD34D"/>
</svg>
