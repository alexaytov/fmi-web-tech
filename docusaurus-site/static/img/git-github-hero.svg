<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gitOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f05033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#de4c36;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="branchGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#238636;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2ea043;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="branchPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8957e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="branchBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1f6feb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388bfd;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Stronger glow for HEAD -->
    <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <style>
    /* Title animations */
    .title-main {
      opacity: 0;
      animation: fadeInDown 0.8s ease-out 0.2s forwards;
    }
    .title-sub {
      opacity: 0;
      animation: fadeInDown 0.8s ease-out 0.5s forwards;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Branch drawing animations */
    .branch-main {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: drawLine 1.5s ease-out 0.8s forwards;
    }
    .branch-develop {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: drawLine 1.2s ease-out 1.2s forwards;
    }
    .branch-feature {
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: drawLine 1s ease-out 1.5s forwards;
    }
    .branch-hotfix {
      stroke-dasharray: 350;
      stroke-dashoffset: 350;
      animation: drawLine 0.8s ease-out 1.8s forwards;
    }
    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }
    
    /* Commit pop-in animations */
    .commit { transform-origin: center; transform: scale(0); }
    .commit-1 { animation: popIn 0.3s ease-out 1.3s forwards; }
    .commit-2 { animation: popIn 0.3s ease-out 1.5s forwards; }
    .commit-3 { animation: popIn 0.3s ease-out 1.7s forwards; }
    .commit-4 { animation: popIn 0.3s ease-out 1.9s forwards; }
    .commit-5 { animation: popIn 0.3s ease-out 2.1s forwards; }
    .commit-6 { animation: popIn 0.3s ease-out 2.3s forwards; }
    .commit-7 { animation: popIn 0.3s ease-out 2.5s forwards; }
    .commit-dev-1 { animation: popIn 0.3s ease-out 1.8s forwards; }
    .commit-dev-2 { animation: popIn 0.3s ease-out 2.0s forwards; }
    .commit-dev-3 { animation: popIn 0.3s ease-out 2.2s forwards; }
    .commit-feat-1 { animation: popIn 0.3s ease-out 2.0s forwards; }
    .commit-feat-2 { animation: popIn 0.3s ease-out 2.2s forwards; }
    .commit-hotfix { animation: popIn 0.3s ease-out 2.3s forwards; }
    @keyframes popIn {
      0% { transform: scale(0); }
      70% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    
    /* HEAD commit pulse */
    .commit-head {
      animation: popIn 0.3s ease-out 2.5s forwards, pulse 2s ease-in-out 3s infinite;
    }
    @keyframes pulse {
      0%, 100% { filter: url(#shadow); }
      50% { filter: url(#glowStrong); }
    }
    
    /* Label fade-in */
    .label { opacity: 0; }
    .label-main { animation: fadeIn 0.5s ease-out 2.7s forwards; }
    .label-develop { animation: fadeIn 0.5s ease-out 2.0s forwards; }
    .label-feature { animation: fadeIn 0.5s ease-out 2.3s forwards; }
    .label-hotfix { animation: fadeIn 0.5s ease-out 2.5s forwards; }
    .label-init { animation: fadeIn 0.5s ease-out 1.5s forwards; }
    .label-head { animation: fadeIn 0.5s ease-out 2.7s forwards; }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    
    /* Git logo animation */
    .git-logo {
      opacity: 0;
      transform-origin: center;
      animation: logoIn 0.6s ease-out 0.3s forwards;
    }
    @keyframes logoIn {
      0% { opacity: 0; transform: rotate(-180deg) scale(0); }
      100% { opacity: 1; transform: rotate(0deg) scale(1); }
    }
    
    /* Octocat animation */
    .octocat {
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.5s forwards, float 3s ease-in-out 1.3s infinite;
    }
    @keyframes float {
      0%, 100% { transform: translate(680px, 300px) scale(0.4); }
      50% { transform: translate(680px, 295px) scale(0.4); }
    }
    
    /* Decorative dots */
    .dot {
      animation: twinkle 2s ease-in-out infinite;
    }
    .dot-1 { animation-delay: 0s; }
    .dot-2 { animation-delay: 0.5s; }
    .dot-3 { animation-delay: 1s; }
    .dot-4 { animation-delay: 1.5s; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    
    /* Terminal typing effect */
    .terminal-box {
      opacity: 0;
      animation: fadeIn 0.5s ease-out 2.8s forwards;
    }
    .terminal-text {
      opacity: 0;
      animation: typing 0.8s steps(10) 3s forwards;
    }
    @keyframes typing {
      from { opacity: 1; width: 0; }
      to { opacity: 1; width: 100%; }
    }
    .cursor {
      opacity: 0;
      animation: blink 0.8s step-end 3s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    
    /* Data flow particles */
    .particle {
      opacity: 0;
      animation: flowParticle 3s linear infinite;
    }
    .particle-1 { animation-delay: 0s; }
    .particle-2 { animation-delay: 1s; }
    .particle-3 { animation-delay: 2s; }
    @keyframes flowParticle {
      0% { opacity: 0; offset-distance: 0%; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; offset-distance: 100%; }
    }
  </style>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1" stroke="#30363d" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
  </g>
  
  <!-- Main branch line -->
  <path class="branch-main" d="M 100 200 L 700 200" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Develop branch -->
  <path class="branch-develop" d="M 150 200 Q 180 200 200 130 L 600 130 Q 620 130 650 200" 
        stroke="url(#branchBlue)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Feature branch (top) -->
  <path class="branch-feature" d="M 250 200 Q 280 200 300 150 L 450 150 Q 470 150 500 200" 
        stroke="url(#branchGreen)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Hotfix branch (bottom) -->
  <path class="branch-hotfix" d="M 350 200 Q 380 200 400 270 L 500 270 Q 520 270 550 200" 
        stroke="url(#branchPurple)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Flow particles on main branch -->
  <circle class="particle particle-1" r="4" fill="#f05033">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 100 200 L 700 200"/>
  </circle>
  <circle class="particle particle-2" r="3" fill="#388bfd">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 150 200 Q 180 200 200 130 L 600 130 Q 620 130 650 200"/>
  </circle>
  
  <!-- Commits on main -->
  <g filter="url(#shadow)">
    <circle class="commit commit-1" cx="100" cy="200" r="12" fill="url(#gitOrange)"/>
    <circle class="commit commit-2" cx="250" cy="200" r="12" fill="url(#gitOrange)"/>
    <circle class="commit commit-3" cx="350" cy="200" r="12" fill="url(#gitOrange)"/>
    <circle class="commit commit-4" cx="500" cy="200" r="12" fill="url(#gitOrange)"/>
    <circle class="commit commit-5" cx="550" cy="200" r="12" fill="url(#gitOrange)"/>
    <circle class="commit commit-6" cx="650" cy="200" r="12" fill="url(#gitOrange)"/>
    <circle class="commit commit-head" cx="700" cy="200" r="12" fill="url(#gitOrange)"/>
  </g>
  
  <!-- Commits on feature branch -->
  <g filter="url(#shadow)">
    <circle class="commit commit-feat-1" cx="350" cy="150" r="10" fill="#2ea043"/>
    <circle class="commit commit-feat-2" cx="420" cy="150" r="10" fill="#2ea043"/>
  </g>
  
  <!-- Commits on hotfix branch -->
  <g filter="url(#shadow)">
    <circle class="commit commit-hotfix" cx="450" cy="270" r="10" fill="#a371f7"/>
  </g>
  
  <!-- Commits on develop branch -->
  <g filter="url(#shadow)">
    <circle class="commit commit-dev-1" cx="300" cy="130" r="10" fill="#388bfd"/>
    <circle class="commit commit-dev-2" cx="400" cy="130" r="10" fill="#388bfd"/>
    <circle class="commit commit-dev-3" cx="500" cy="130" r="10" fill="#388bfd"/>
  </g>
  
  <!-- Git logo (simplified) -->
  <g class="git-logo" transform="translate(60, 320) scale(0.6)">
    <path d="M92.71 44.408L52.591 4.291a10.097 10.097 0 00-14.281 0l-8.332 8.332 10.567 10.567a11.997 11.997 0 0115.19 15.29l10.188 10.188a11.996 11.996 0 0112.164 20.134 11.996 11.996 0 01-16.952-16.952l-9.5-9.5v24.988a12.011 12.011 0 11-9.869-.299V42.125a11.985 11.985 0 01-6.517-15.736L15.592 16.732.291 32.032a10.097 10.097 0 000 14.281l40.118 40.118a10.096 10.096 0 0014.281 0l37.02-37.02a10.097 10.097 0 000-14.281" 
          fill="url(#gitOrange)" filter="url(#glow)"/>
  </g>
  
  <!-- GitHub Octocat silhouette -->
  <g class="octocat" transform="translate(680, 300) scale(0.4)">
    <path d="M80 0C35.8 0 0 35.8 0 80c0 35.4 22.9 65.4 54.7 76 4 .7 5.5-1.7 5.5-3.9 0-1.9-.1-8.2-.1-14.9-20.1 3.7-25.4-4.9-27-9.4-0.9-2.3-4.8-9.4-8.2-11.3-2.8-1.5-6.8-5.2-.1-5.3 6.3-.1 10.8 5.8 12.3 8.2 7.2 12.1 18.7 8.7 23.3 6.6.7-5.2 2.8-8.7 5.1-10.7-17.9-2-36.6-8.9-36.6-39.6 0-8.7 3.1-15.9 8.2-21.5-.8-2-3.6-10.2.8-21.2 0 0 6.7-2.1 22 8.2 6.4-1.8 13.2-2.7 20-2.7 6.8 0 13.6.9 20 2.7 15.3-10.4 22-8.2 22-8.2 4.4 11 1.6 19.2.8 21.2 5.1 5.6 8.2 12.7 8.2 21.5 0 30.8-18.8 37.6-36.7 39.6 2.9 2.5 5.4 7.3 5.4 14.8 0 10.7-.1 19.3-.1 22 0 2.1 1.5 4.7 5.5 3.9C137.1 145.4 160 115.4 160 80c0-44.2-35.8-80-80-80z"
          fill="#c9d1d9" filter="url(#shadow)"/>
  </g>
  
  <!-- Labels -->
  <text class="label label-init" x="100" y="235" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">init</text>
  <text class="label label-head" x="700" y="235" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">HEAD</text>
  
  <!-- Branch labels -->
  <g font-family="system-ui, sans-serif" font-size="12" font-weight="600">
    <text class="label label-feature" x="385" y="140" fill="#2ea043" text-anchor="middle">feature</text>
    <text class="label label-hotfix" x="450" y="295" fill="#a371f7" text-anchor="middle">hotfix</text>
    <text class="label label-develop" x="400" y="118" fill="#388bfd" text-anchor="middle">develop</text>
    <text class="label label-main" x="400" y="220" fill="#f05033" text-anchor="middle" font-size="14">main</text>
  </g>
  
  <!-- Title -->
  <text class="title-main" x="400" y="50" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle" filter="url(#shadow)">
    Git &amp; GitHub
  </text>
  <text class="title-sub" x="400" y="75" fill="#8b949e" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">
    Version Control &amp; Collaboration
  </text>
  
  <!-- Decorative elements -->
  <circle class="dot dot-1" cx="50" cy="50" r="3" fill="#238636"/>
  <circle class="dot dot-2" cx="750" cy="50" r="3" fill="#a371f7"/>
  <circle class="dot dot-3" cx="50" cy="350" r="3" fill="#388bfd"/>
  <circle class="dot dot-4" cx="750" cy="350" r="3" fill="#f05033"/>
  
  <!-- Command hint -->
  <g class="terminal-box" transform="translate(580, 330)">
    <rect x="0" y="0" width="120" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text class="terminal-text" x="10" y="18" fill="#7ee787" font-family="monospace" font-size="11">$ git push</text>
    <rect class="cursor" x="95" y="8" width="8" height="14" fill="#7ee787"/>
  </g>
</svg>