<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <circle cx="16" cy="16" r="15" fill="#4F46E5"/>

  <!-- Open book simplified -->
  <g transform="translate(16, 18)">
    <!-- Left page -->
    <path d="M-2 -5 Q-7 -4 -10 -2 L-10 6 Q-7 4 -2 5 Z" fill="#fff"/>
    <!-- Right page -->
    <path d="M2 -5 Q7 -4 10 -2 L10 6 Q7 4 2 5 Z" fill="#fff"/>
    <!-- Spine -->
    <rect x="-2" y="-5" width="4" height="10" fill="#E0E7FF"/>
  </g>

  <!-- Graduation cap simplified -->
  <g transform="translate(16, 9)">
    <polygon points="0,-4 8,0 0,2 -8,0" fill="#1E1B4B"/>
    <!-- Tassel -->
    <circle cx="6" cy="-2" r="1.5" fill="#FCD34D"/>
  </g>
</svg>
